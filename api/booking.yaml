      description: 'Aktuelle ETA getrennt von der verbindlichen Zusage `promise` (WP-M2-43): geplante Ankunftszeit am Einstiegsstopp aus der letzten Planrevision (`source=PLAN`; die laufende Prognose-ETA folgt mit M4, WP-M4-62). `previous_pickup_at` ist nur bei einer Zeitänderung gesetzt (alt zu neu). `plan_sequence` zählt die Planänderungen der Buchung (Revisionsreihenfolge des Änderungsstroms).'
      properties:
        pickup_at:
          $ref: common.yaml#/components/schemas/Timestamp
        dropoff_at:
