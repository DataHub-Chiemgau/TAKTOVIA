        description: Angebots-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideHold'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/bookings:
    post:
      summary: Hold in Buchung bestätigen
      operationId: confirmBooking
      description: 'Konvertiert einen gültigen Hold in derselben Transaktion in eine Buchung. `If-Match` ist die Angebotsrevision aus dem ETag der Hold-Antwort
        (fehlt er: 428, veraltet: 412). Wiederholte Bestätigung desselben Holds liefert dieselbe Buchung. 409: `HOLD_EXPIRED`, `REQUOTE_REQUIRED`, `CAPACITY_UNAVAILABLE`,
        `OPERATION_IN_PROGRESS`, `INVALID_STATE_TRANSITION`. Fremder Hold: 404; ohne Fahrgastkonto: 403.'
      security:
      - oidc:
        - rides:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideConfirmRequest'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideBooking'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    get:
      summary: Eigene Buchungen auflisten
      operationId: listBookings
      description: 'Eigene Buchungen, aufsteigend nach `(created_at, id)`. `bereich` filtert nach dem serverseitig zugeordneten Bereich (`bevorstehend`, `laufend`, `vergangen`, `storniert`, WP-M2-45); ein anderer Wert ist `422`, ein Cursor einer anderen Sicht (anderer Bereich, anderer Fahrgast) wird mit `400` abgewiesen.'
      security:
      - oidc:
        - rides:read
      parameters:
      - name: bereich
        in: query
        required: false
        schema:
          type: string
          enum:
          - bevorstehend
          - laufend
          - vergangen
          - storniert
        description: Bereichsfilter der Buchungsübersicht.
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideBookingPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/bookings/{booking_id}:
    get:
      summary: Buchung lesen
      operationId: getBooking
      security:
      - oidc:
        - rides:read
      description: 'ETag = Buchungsrevision. Ein Client, der seinen Stand per `If-Match` mitsendet, erhält bei veralteter Revision `412 REVISION_MISMATCH`; die Antwort nennt die aktuelle Revision im `ETag`-Header, danach liest er ohne `If-Match` den aktuellen Stand (WP-M2-28, LH-6.5-OPT-010).'
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Buchungs-ID.
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
          pattern: ^"[0-9]+"$
        description: Optional, bekannter Stand des Clients als starker ETag; weicht er ab, 412.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideBooking'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/bookings/{booking_id}/history:
    get:
      summary: Statushistorie der Buchung
      operationId: listBookingHistory
      description: 'Unveränderliche Historie aller Zustandsübergänge mit Änderungsgrund (WP-M2-25, LH-6.4-BKG-013), aufsteigend nach Revision. `view=reduced` (Standard für Fahrgäste):
        Zeitpunkt, Zustand und Grund in Fahrgastsprache, ohne Akteur-IDs und Verknüpfungen. `view=audit` (Standard für Betriebspersonal im Dienstscope und Prüfer): zusätzlich Akteur,
        Korrelation und Verknüpfungen zu Anfrage, Angebot, Hold und Preisangebot; für Fahrgäste `403`. Fremde Buchung, fremder Dienst oder Mandant: `404`.'
      security:
      - oidc:
        - rides:read
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Buchungs-ID.
      - name: view
        in: query
        required: false
        schema:
          type: string
          enum:
          - reduced
          - audit
        description: Sichtweise; Standard `reduced` für Fahrgäste, `audit` sonst.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideBookingHistory'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/bookings/{booking_id}/cancel:
    post:
      summary: Buchung stornieren
      operationId: cancelBooking
      security:
      - oidc:
        - rides:write
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Buchungs-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCancelRequest'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideBooking'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/bookings/{booking_id}/changes:
    post:
      summary: Buchung durch die Disposition ändern (atomarer Tausch)
      operationId: changeBooking
      security:
      - oidc:
        - dispatch:write
      description: 'Leitstellenkommando (WP-M3-39, LH-6.7-OPS-004): ändert die Buchung auf einen neuen, bereits gehaltenen Wunsch. Unter den Sperren beider Umläufe entsteht die Folgebuchung, die
        bisherige wird storniert (Hold frei) und ein Änderungseintrag mit Akteur, Grund sowie alter und neuer Zusage geschrieben; scheitert ein Schritt, bleibt die bisherige Buchung samt Zusage
        unverändert und der neue Hold wird freigegeben. `If-Match` = Revision der bisherigen Buchung (fehlt er: 428, veraltet: 412 `REVISION_MISMATCH`; zwei Disponenten: genau einer gewinnt).
        Ohne Dispositionsrolle 403, ohne Recht am Dienst oder fremdes Objekt 404, fehlender Grund oder fehlende Zustimmung bei Preis- bzw. Zeitänderung 422, nicht (mehr) bedienbar 409
        (`CAPACITY_UNAVAILABLE`, `HOLD_EXPIRED`, `REQUOTE_REQUIRED`, `INVALID_STATE_TRANSITION`). Wiederholung mit demselben `Idempotency-Key` erzeugt keine zweite Änderung.'
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Bisherige Buchung.
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingChangeRequest'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingChangeResult'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/plan-changes:
    get:
      summary: Änderungsstrom der Planrevisionen (Fahrgastkanal)
      operationId: listPlanChanges
      security:
      - oidc:
        - rides:updates
      description: 'Planänderungen der **eigenen** Buchungen ab `after`, aufsteigend nach Cursor (WP-M2-28, LH-6.5-OPT-010). Je Planänderung höchstens ein Eintrag, der nur die eigenen Buchungen trägt; andere Buchungen desselben Umlaufs erscheinen nie. Jede Buchung hat eine fortlaufende `sequence` (1, 2, 3 ...): der Client übernimmt einen Eintrag nur, wenn `sequence` genau eins über seinem Stand liegt, verwirft gleiche oder ältere (doppelt oder ungeordnet zugestellt) und ruft bei einer Lücke den Snapshot ab (`listPlanChangesSnapshot`). Der Cursor ist monoton, aber nicht lückenlos. Das Protokoll ist ein abfragbarer Strom; SSE oder WebSocket sind ein Transport darüber (Offener Punkt 25). Nur Rolle Fahrgast mit Fahrgastkonto; andere Rollen: 403.'
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          default: 0
        description: Cursor des zuletzt verarbeiteten Eintrags (`next_cursor` der vorigen Antwort, anfangs der `cursor` des Snapshots).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 50
        description: Höchstzahl der Planänderungen je Antwort, 1 bis 100 (Standard 50).
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerPlanChangeFeed'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/plan-changes/snapshot:
    get:
      summary: Snapshot des Plans der eigenen Buchungen
      operationId: getPlanChangesSnapshot
      security:
      - oidc:
        - rides:updates
      description: 'Aktueller Planstand je eigener Buchung (`sequence`, Abholzeit und Ausstiegszeit, Buchungsrevision) und der Cursor, ab dem der Strom weiterzulesen ist. Schließt die Lücke nach einem Verbindungsabbruch oder einer erkannten Revisionslücke; ein älterer Snapshot setzt den Clientstand nie zurück (Tracker).'
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassengerPlanSnapshot'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    RideResourceVector:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          const: '1.0'
        seats:
          type: integer
          format: int64
          minimum: 0
          maximum: 99
        wheelchair:
          type: integer
          format: int64
          minimum: 0
          maximum: 20
        equipment:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            enum:
            - RAMP
            - LIFT
            - CHILD_SEAT
            - BOOSTER_SEAT
            - LUGGAGE_SPACE
            - ASSISTANCE_DOG_SPACE
            - STRETCHER_FIXING
      required:
      - seats
      - wheelchair
      description: 'Ressourcenvektor (Schema `docs/umsetzungsplan/vertraege/schemas/resource-vector.v1.schema.json`): getrennte Dimensionen
        Sitz, Rollstuhlplatz, Ausstattung; keine ersetzt die andere. Unbekannte Dimension: 422 UNKNOWN_FIELD.'
      examples:
      - schema_version: '1.0'
        seats: 2
        wheelchair: 1
        equipment:
        - RAMP
    RidePlace:
      type: object
      additionalProperties: false
      properties:
        stop_id:
          $ref: common.yaml#/components/schemas/UUID
        point:
          $ref: common.yaml#/components/schemas/Point
        label:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - point
      description: Start oder Ziel; `stop_id` bindet an einen definierten Haltepunkt, ohne `stop_id` wird der nächste zulässige Haltepunkt
        gewählt (Fußweg `stop_walk_max_m`).
    RideAssistanceCodes:
      type: array
      maxItems: 16
      uniqueItems: true
      items:
        type: string
        enum:
        - BOARDING_HELP
        - AUDIO_GUIDANCE
        - LOW_FLOOR
        - WHEELCHAIR_SPACE
        - ASSISTANCE_ANIMAL
        - ACCOMPANYING_PERSON
      description: 'Transportrelevanter Unterstützungsbedarf als Auswahl aus dem Katalog (Feldschutz WP-M1-31, Kap. 06 §6.2): keine
        Diagnose, kein Freitext. Jeder andere Wert ergibt 422 NOT_IN_ENUM, jedes Diagnosefeld 422 UNKNOWN_FIELD.'
    RideOfferRequest:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        origin:
          $ref: '#/components/schemas/RidePlace'
        destination:
          $ref: '#/components/schemas/RidePlace'
        time_kind:
          type: string
          enum:
          - DEPARTURE
          - ARRIVAL
        desired:
          $ref: common.yaml#/components/schemas/ZonedMoment
        passengers:
          type: integer
          format: int64
          minimum: 1
          maximum: 99
        wheelchair_spaces:
          type: integer
          format: int64
          minimum: 0
          maximum: 20
        equipment:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            enum:
            - RAMP
            - LIFT
            - CHILD_SEAT
            - BOOSTER_SEAT
            - LUGGAGE_SPACE
            - ASSISTANCE_DOG_SPACE
            - STRETCHER_FIXING
        assistance_codes:
          $ref: '#/components/schemas/RideAssistanceCodes'
        channel:
          type: string
          enum:
          - WEB
          - APP
          - API
          description: Kanal der Anfrage für die Nachfrageauswertung (Standard `WEB`).
        booking_subject:
          $ref: '#/components/schemas/DispatchBookingSubject'
      required:
      - service_id
      - origin
      - destination
      - time_kind
      - desired
      - passengers
      examples:
      - service_id: 00000000-0000-4000-8000-000000000005
        origin:
          point:
            latitude: 51.05
            longitude: 13.74
        destination:
          point:
            latitude: 51.06
            longitude: 13.76
        time_kind: DEPARTURE
        desired:
          desired_at: '2026-12-01T08:00:00+01:00'
          time_zone: Europe/Berlin
        passengers: 2
        wheelchair_spaces: 1
    DispatchBookingSubject:
      type: object
      additionalProperties: false
      description: 'Für wen gebucht wird (Kap. 05 §5.9, WP-M3-39). `SELF` (Standard) bindet den angemeldeten Fahrgast. `DELEGATED` bindet einen Fahrgast im Mandanten durch die Leitstelle
        (Rolle Disposition oder Callcenter und Schreibrecht am Dienst, sonst 403 bzw. 404; der Fahrgast braucht ein aktives Konto, sonst 422): der Server bindet das Angebot an diesen Fahrgast
        und prüft Rolle, Dienstscope und Konto bei Hold und Bestätigung erneut. Der Disponent bleibt als eigener Akteur im Audit. Ein Subjektwechsel verlangt ein neues Angebot. Mindestumfang
        bis zur Entscheidung D-12/OP-30; Vertretung und Callcenter-Zustimmung (UI-06) folgen in M7.'
      properties:
        kind:
          type: string
          enum:
          - SELF
          - DELEGATED
        passenger_id:
          $ref: common.yaml#/components/schemas/UUID
      required:
      - kind
    RideWindow:
      type: object
      additionalProperties: false
      properties:
        earliest_at:
          $ref: common.yaml#/components/schemas/Timestamp
        latest_at:
          $ref: common.yaml#/components/schemas/Timestamp
      required:
      - earliest_at
      - latest_at
    RideOfferProposal:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        booking_kind:
          type: string
          enum:
          - IMMEDIATE
          - ADVANCE
          description: Sofort (Abfahrtswunsch höchstens 5 Minuten von jetzt) oder Voraus; der Mindestvorlauf gilt nur für Voraus.
        time_kind:
          type: string
          enum:
          - DEPARTURE
          - ARRIVAL
        pickup_window:
          $ref: '#/components/schemas/RideWindow'
        arrival_window:
          $ref: '#/components/schemas/RideWindow'
        arrival_grace_min:
          type: integer
          format: int64
          minimum: 0
          maximum: 240
          description: Ankunftstoleranz (`arrival_grace_min`) über dem späten Rand des Ankunftsfensters.
        direct_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 86400
          description: Zugrunde gelegte Direktfahrzeit (Planungsschätzung, nicht die Zusage).
        id:
          $ref: common.yaml#/components/schemas/UUID
        expires_at:
          $ref: common.yaml#/components/schemas/Timestamp
        gross:
          $ref: common.yaml#/components/schemas/Money
        fare_components:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: federation.yaml#/components/schemas/FareComponent
          description: 'Preisaufschlüsselung des unveränderlichen Preisstands (`fare_quote`, WP-M2-09): Netto (`TRANSPORT`), Gebühren (`SURCHARGE`) und
            enthaltene Steuer (`TAX`); die Summe der Komponenten ist `gross`. `COMMISSION` ist nie eine Kundenkomponente.'
        tariff_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        cancellation_policy_ref:
          type: string
          minLength: 1
          maxLength: 64
        pickup_stop:
          $ref: '#/components/schemas/RideOfferStop'
        dropoff_stop:
          $ref: '#/components/schemas/RideOfferStop'
        run_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Planrevision, an die das Angebot gebunden ist; fehlt, solange keine Fahrt zugeordnet ist (ein Hold ergibt dann 409 CAPACITY_UNAVAILABLE).
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: Angebotsrevision (ETag von `GET /v1/ride-offers/{id}`), Bedingung `If-Match` für Hold und Freigabe.
        walk:
          $ref: '#/components/schemas/RideWalkRoute'
        eta:
          $ref: '#/components/schemas/RideOfferEta'
      required:
      - service_id
      - booking_kind
      - time_kind
      - pickup_window
      - arrival_window
      - arrival_grace_min
      - direct_seconds
      - id
      - expires_at
      - gross
      - fare_components
      - revision
      description: Angebot mit Zeitfenster, Ablauf (`expires_at`) und unveränderlichem Preisstand, aber ohne gesicherte Kapazität (Kap. 01 §1.4 Schritt 4); Hold und Bestätigung folgen. Ein abgelaufenes
        Angebot kann nicht gehalten werden (409 OFFER_EXPIRED).
    RideOfferEta:
      type: object
      additionalProperties: false
      description: 'Genau eine Modell-/Konfigurationsversion des ETA-Grundmodells, aus der die Fenster des Angebots stammen (WP-M4-66, ETA-001/-002 am echten Angebot). `buffer_seconds` ist die Sicherheitsreserve, die nur den späten Rand des Ankunftsfensters verlängert; `direct_seconds` enthält Haltezeit und Referenzfahrzeit. Mit `fallback_reason` konnte das Grundmodell keine regelkonforme Prognose liefern (kein Modell, Routingausfall, fehlende Geschwindigkeitsattribute): das Fenster beruht dann auf der Planungsannahme, ohne Modellversion.'
      properties:
        model_version:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
        config_version:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
        buffer_seconds:
          type: integer
          minimum: 0
          maximum: 86400
        fallback_reason:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
      required:
      - model_version
      - config_version
      - buffer_seconds
      - fallback_reason
    RideOfferStop:
      type: object
      additionalProperties: false
      properties:
        stop_id:
          $ref: common.yaml#/components/schemas/UUID
        revision_id:
          $ref: common.yaml#/components/schemas/UUID
      required:
      - stop_id
      - revision_id
      description: Haltepunkt und die Haltepunktrevision, die zum Angebotszeitpunkt galt (Teil des Angebots, ändert sich nie).
    RideRejectionCode:
      type: string
      enum:
      - LEAD_TIME
      - HORIZON
      - WINDOW_NOT_FEASIBLE
      - OUTSIDE_HOURS
      - OUTSIDE_AREA
      - RULE_FORBIDDEN
      - NO_STOP_IN_RANGE
      - NO_ACCESSIBLE_STOP
      - NO_ROUTE
      - EQUIPMENT_MISSING
      - NO_STAFF
      - NO_CAPACITY
      - NO_TARIFF
      - NO_VEHICLE
      - SHIFT_ENDED
      - MAX_WAIT_EXCEEDED
      - MAX_DETOUR_EXCEEDED
      - PARTNER_UNAVAILABLE
      description: 'Standardisierter Ablehnungsgrund (WP-M2-13, Katalog `rejection_reason`, Vorschlag M2 OP-14). Technische Fehler sind kein
        Ablehnungsgrund (`503`, nie in dieser Liste).'
    RideRejection:
      type: object
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/RideRejectionCode'
        secondary_codes:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RideRejectionCode'
          description: Weitere Ursachen nach Priorität; der Primärgrund zählt den Versuch genau einmal.
        text:
          type: string
          minLength: 1
          maxLength: 300
          description: Begründung für den Fahrgast.
        next_action:
          type: string
          minLength: 1
          maxLength: 300
          description: Nächste Handlung für UI-01.
      required:
      - code
      - secondary_codes
      - text
      - next_action
    RideOfferResponse:
      type: object
      additionalProperties: false
      properties:
        attempt_id:
          $ref: common.yaml#/components/schemas/UUID
        offers:
          type: array
          maxItems: 1
          items:
            $ref: '#/components/schemas/RideOfferProposal'
        rejection:
          oneOf:
          - $ref: '#/components/schemas/RideRejection'
          - type: 'null'
      required:
      - attempt_id
      - offers
      - rejection
      description: Entweder genau ein Zeitfenster (`rejection` null) oder eine leere Liste mit normiertem Grund.
      examples:
      - attempt_id: 00000000-0000-4000-8000-0000000000a1
        offers:
        - service_id: 00000000-0000-4000-8000-000000000005
          booking_kind: ADVANCE
          time_kind: DEPARTURE
          pickup_window:
            earliest_at: '2026-12-01T07:00:00Z'
            latest_at: '2026-12-01T07:15:00Z'
          arrival_window:
            earliest_at: '2026-12-01T07:10:00Z'
            latest_at: '2026-12-01T07:25:00Z'
          arrival_grace_min: 5
          direct_seconds: 600
          id: 00000000-0000-4000-8000-0000000000b1
          expires_at: '2026-12-01T06:05:00Z'
          gross:
            amount_minor: 950
            currency: EUR
            exponent: 2
          fare_components:
          - code: TRANSPORT
            description: Fahrpreis (netto)
            amount:
              amount_minor: 841
              currency: EUR
              exponent: 2
            tariff_revision: '3'
          - code: SURCHARGE
            description: Buchungsgebühr (netto)
            amount:
              amount_minor: 47
              currency: EUR
              exponent: 2
            tariff_revision: '3'
          - code: TAX
            description: Umsatzsteuer (enthalten)
            amount:
              amount_minor: 62
              currency: EUR
              exponent: 2
            tariff_revision: '3'
          tariff_revision: 3
          cancellation_policy_ref: std-24h
          revision: 1
        rejection: null
    RideOffer:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        attempt_id:
          $ref: common.yaml#/components/schemas/UUID
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        state:
          type: string
          enum:
          - OFFERED
          - HELD
          - EXPIRED
          - DECLINED
        pickup_window:
          $ref: '#/components/schemas/RideWindow'
        arrival_window:
          $ref: '#/components/schemas/RideWindow'
        expires_at:
          $ref: common.yaml#/components/schemas/Timestamp
        run_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        gross:
          $ref: common.yaml#/components/schemas/Money
        tariff_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        cancellation_policy_ref:
          type: string
          minLength: 1
          maxLength: 64
        fare_components:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: federation.yaml#/components/schemas/FareComponent
          description: Preisaufschlüsselung des gebundenen Preisstands (Netto, Gebühren, Steuer); Summe = `gross`.
        pickup_stop:
          $ref: '#/components/schemas/RideOfferStop'
        dropoff_stop:
          $ref: '#/components/schemas/RideOfferStop'
        demand:
          $ref: '#/components/schemas/RideResourceVector'
        hold:
          oneOf:
          - $ref: '#/components/schemas/RideHold'
          - type: 'null'
        eta:
          $ref: '#/components/schemas/RideOfferEta'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        walk:
          $ref: '#/components/schemas/RideWalkRoute'
      required:
      - id
      - attempt_id
      - service_id
      - state
      - pickup_window
      - arrival_window
      - expires_at
      - gross
      - fare_components
      - pickup_stop
      - dropoff_stop
      - demand
      - hold
      - revision
      description: Angebot ohne Hold verspricht keine gesicherte Kapazität (Kap. 01 §1.4 Schritt 4). Ablehnung einer Anfrage ist keine
        Angebotsressource, sondern 200 mit leerer Liste und `rejection` (`NO_CAPACITY`, `EQUIPMENT_MISSING`, `OUTSIDE_AREA`, …, M2 OP-14).
    RideHold:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        state:
          type: string
          enum:
          - HELD
          - CONSUMED
          - RELEASED
          - EXPIRED
        expires_at:
          $ref: common.yaml#/components/schemas/Timestamp
        capacity_vector:
          $ref: '#/components/schemas/RideResourceVector'
      required:
      - id
      - state
      - expires_at
      - capacity_vector
    RideHoldRequest:
      type: object
      additionalProperties: false
      properties:
        max_gross:
          $ref: common.yaml#/components/schemas/Money
      required:
      - max_gross
      description: Höchster akzeptierter Betrag; Abweichung vom Angebot ergibt 409 REQUOTE_REQUIRED.
      examples:
      - max_gross:
          amount_minor: 950
          currency: EUR
          exponent: 2
    RideConfirmRequest:
      type: object
      additionalProperties: false
      properties:
        hold_id:
          $ref: common.yaml#/components/schemas/UUID
        max_gross:
          $ref: common.yaml#/components/schemas/Money
        payment_reference:
          type: string
          minLength: 1
          maxLength: 128
        reason_code:
          $ref: '#/components/schemas/DispatchReasonCode'
        reason_text:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - hold_id
      - max_gross
      description: '`payment_reference` ist ein PSP-Referenzwert (nie rohe Zahlungsdaten). Wiederholte Bestätigung desselben Holds liefert
        dieselbe Buchung. Bestätigt die Leitstelle den Hold eines für einen Fahrgast gebundenen Angebots (`booking_subject` `DELEGATED`), sind `reason_code` (Grundkatalog der Leitstelle) und bei
        `OTHER` `reason_text` Pflicht (422 sonst); Akteur, Zeitpunkt und Grund stehen im Änderungsprotokoll und im Audit, die Buchung gehört dem Fahrgast (WP-M3-39).'
      examples:
      - hold_id: 00000000-0000-4000-8000-000000000009
        max_gross:
          amount_minor: 950
          currency: EUR
          exponent: 2
    DispatchReasonCode:
      type: string
      enum:
      - PHONE_REQUEST
      - COUNTER_REQUEST
      - PASSENGER_REQUEST
      - OPERATIONAL_NEED
      - CORRECTION
      - OTHER
      description: Grundkatalog der Leitstelle für Anlage und Änderung einer Buchung (Arbeitskatalog, WP-M3-39).
    BookingChangeRequest:
      type: object
      additionalProperties: false
      description: 'Änderung einer Buchung durch die Disposition als atomarer Tausch (WP-M3-39, Mindestumfang OP-30): `new_hold_id` ist der bereits gehaltene Hold des geänderten Wunsches (Angebot
        und Hold über `POST /v1/ride-offers` und `.../hold` mit `booking_subject` `DELEGATED` auf denselben Fahrgast), `offer_revision` der ETag der Hold-Antwort, `max_gross` der akzeptierte Betrag.
        `If-Match` ist die Revision der bestehenden Buchung. `reason_code` ist Pflicht, bei `OTHER` auch `reason_text`. Ändern sich Preis oder Beginn des Abholfensters, ist `passenger_consent`
        (Kanal und Zeitpunkt der Zustimmung des Fahrgasts) Pflicht, sonst wird die Änderung nicht wirksam (422).'
      properties:
        new_hold_id:
          $ref: common.yaml#/components/schemas/UUID
        offer_revision:
          type: integer
          format: int64
          minimum: 1
        max_gross:
          $ref: common.yaml#/components/schemas/Money
        reason_code:
          $ref: '#/components/schemas/DispatchReasonCode'
        reason_text:
          type: string
          minLength: 1
          maxLength: 500
        passenger_consent:
          type: object
          additionalProperties: false
          properties:
            channel:
              type: string
              enum:
              - PHONE
              - COUNTER
              - WRITTEN
            obtained_at:
              $ref: common.yaml#/components/schemas/Timestamp
          required:
          - channel
          - obtained_at
      required:
      - new_hold_id
      - offer_revision
      - max_gross
      - reason_code
      examples:
      - new_hold_id: 00000000-0000-4000-8000-000000000009
        offer_revision: 2
        max_gross:
          amount_minor: 950
          currency: EUR
          exponent: 2
        reason_code: PASSENGER_REQUEST
    BookingChangeResult:
      type: object
      additionalProperties: false
      description: Ergebnis des Tauschs. `booking` ist die Folgebuchung (neue Buchungsnummer), `replaced` die bisherige, nun stornierte Buchung. `replayed` zeigt die Wiederholung desselben Tauschs.
      properties:
        booking:
          $ref: '#/components/schemas/RideBooking'
        replaced:
          $ref: '#/components/schemas/RideBooking'
        change_id:
          $ref: common.yaml#/components/schemas/UUID
        replayed:
          type: boolean
        price_changed:
          type: boolean
        time_changed:
          type: boolean
      required:
      - booking
      - replaced
      - change_id
      - replayed
      - price_changed
      - time_changed
    RideBooking:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        hold_id:
          $ref: common.yaml#/components/schemas/UUID
        booking_number:
          type: string
          pattern: ^BK-[0-9]{4}-[0-9]{6,}$
          description: Je Mandant eindeutige, lesbare Buchungsnummer (M2 OP-42, Vorschlag `BK-<Jahr>-<laufende Nummer>`); erscheint unverändert in Bestätigung, UI-04 und Nachrichten.
        state:
          type: string
          enum:
          - CONFIRMING
          - CONFIRMED
          - RECONCILING
          - COMPENSATING
          - CANCEL_PENDING
          - CANCELED
          - COMPLETED
          - FAILED
        created_at:
          $ref: common.yaml#/components/schemas/Timestamp
        cancel_reason:
          type: string
          enum:
          - PASSENGER_REQUEST
          - OPERATOR_CANCELLATION
          - NO_SHOW
          - PAYMENT_FAILED
          - SAFETY
          - VEHICLE_OUTAGE
          description: Stornogrund (WP-M2-27); nur bei stornierten Buchungen, nach dem Setzen unveränderlich.
        cancel_cause_class:
          type: string
          enum:
          - FAHRGAST
          - BETREIBER
          - FAHRZEUGAUSFALL
          description: Verursacherklasse des Stornos (WP-M2-27); folgt dem Grund. Datenbasis der Stornoquoten (Fahrzeugausfall getrennt).
        passengers:
          type: integer
          format: int64
          minimum: 1
          maximum: 99
        wheelchair_spaces:
          type: integer
          format: int64
          minimum: 0
          maximum: 20
        assistance_codes:
          $ref: '#/components/schemas/RideAssistanceCodes'
        promise:
          $ref: '#/components/schemas/RidePromise'
        payment:
          $ref: '#/components/schemas/RidePayment'
        refund_hint:
          $ref: '#/components/schemas/RideRefundHint'
        bereich:
          type: string
          enum:
          - bevorstehend
          - laufend
          - vergangen
          - storniert
          description: 'Bereich der Buchungsübersicht (WP-M2-45, LH-6.3-PAX-008), serverseitig aus `state`, Ausführungszustand und Zeit berechnet (eine einzige Zuordnungsfunktion): jede Buchung liegt in genau einem Bereich. `laufend` setzt Ausführungszustände aus M3 voraus (Offener Punkt 37).'
        pickup_stop:
          $ref: '#/components/schemas/RideBookingStop'
        dropoff_stop:
          $ref: '#/components/schemas/RideBookingStop'
        eta:
          $ref: '#/components/schemas/RideBookingEta'
        vehicle:
          $ref: '#/components/schemas/RideVehicleIdentification'
        cancellation:
          $ref: '#/components/schemas/RideCancellationOption'
        walk:
          $ref: '#/components/schemas/RideWalkRoute'
        data_as_of:
          $ref: common.yaml#/components/schemas/Timestamp
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - booking_number
      - service_id
      - hold_id
      - state
      - created_at
      - passengers
      - wheelchair_spaces
      - promise
      - bereich
      - revision
    RideBookingStop:
      type: object
      additionalProperties: false
      description: 'Treffpunkt der Buchung (WP-M2-43): unveränderliche Haltepunktrevision des Angebots mit Name, Lage und Zugänglichkeitsangaben (Fahrgastsicht ohne interne Felder).'
      properties:
        stop_id:
          $ref: common.yaml#/components/schemas/UUID
        revision_id:
          $ref: common.yaml#/components/schemas/UUID
