paths:
  /v1/ride-offers:
    post:
      summary: Fahrt suchen und Zeitfenster erhalten
      operationId: createRideOffer
      description: 'Erfasst jeden fachlich neuen Versuch als `travel_attempt` (auch abgelehnte, mit Primärgrund) und liefert ein
        Zeitfenster für Abholung und Ankunft ohne Preis und ohne Kapazitätszusage (WP-M2-11). Eine fachliche Ablehnung (Frist, Betriebszeit,
        Gebiet, Regelverbot, Haltepunkt, Kapazität) ist **kein Fehler**: 200 mit leerer `offers`-Liste und normiertem Grund in `rejection`
        (WP-M2-13). 422 nur bei formal fehlerhafter Eingabe (Personenzahl, Zeitzone, nicht existente Ortszeit, doppelte Ortszeit ohne Offset).
        Gleicher `Idempotency-Key` mit gleichem Inhalt wiederholt das gespeicherte Ergebnis (kein neuer Versuch, Antwort mit `Idempotent-Replayed`),
        mit anderem Inhalt: 409 `IDEMPOTENCY_CONFLICT`.'
      security:
      - oidc:
        - rides:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideOfferRequest'
      responses:
        '200':
          description: Zeitfenster oder normierter Ablehnungsgrund.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOfferResponse'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/ride-offers/{ride_offer_id}:
    get:
      summary: Angebot lesen
      operationId: getRideOffer
      security:
      - oidc:
        - rides:read
      parameters:
      - name: ride_offer_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Angebots-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOffer'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/ride-offers/{ride_offer_id}/hold:
    post:
      summary: Kapazität befristet halten
      operationId: holdRideOffer
      description: 'Lokaler Hold in einer Transaktion (Kap. 01 §1.4 Schritt 5). 409: `OFFER_EXPIRED`, `CAPACITY_UNAVAILABLE`, `REQUOTE_REQUIRED`,
        `OPERATION_IN_PROGRESS`. Standarddauer 180 s.'
      security:
      - oidc:
        - rides:write
      parameters:
      - name: ride_offer_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Angebots-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideHoldRequest'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideHold'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/ride-offers/{ride_offer_id}/hold/release:
    post:
      summary: Eigenen Hold freigeben
      operationId: releaseHold
      description: Idempotente Freigabe nach Abbruch des Checkouts (Kap. 05 §5.4).
      security:
      - oidc:
        - rides:write
      parameters:
      - name: ride_offer_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Angebots-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideHold'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/bookings:
    post:
      summary: Hold in Buchung bestätigen
      operationId: confirmBooking
      description: 'Konvertiert einen gültigen Hold in derselben Transaktion in eine Buchung. 409: `HOLD_EXPIRED`, `REQUOTE_REQUIRED`,
        `OPERATION_IN_PROGRESS`, `INVALID_STATE_TRANSITION`.'
      security:
      - oidc:
        - rides:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideConfirmRequest'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideBooking'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    get:
      summary: Eigene Buchungen auflisten
      operationId: listBookings
      security:
      - oidc:
        - rides:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideBookingPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/bookings/{booking_id}:
    get:
      summary: Buchung lesen
      operationId: getBooking
      security:
      - oidc:
        - rides:read
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Buchungs-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideBooking'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
