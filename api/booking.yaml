          maximum: 9007199254740991
        plan_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        data_as_of:
          $ref: common.yaml#/components/schemas/Timestamp
        source:
          type: string
          enum:
          - PLAN
        forecast:
          oneOf:
          - $ref: '#/components/schemas/RideBookingEtaForecast'
          - type: 'null'
          description: Prognose des ETA-Grundmodells am Einstiegsstopp (WP-M4-66), getrennt von der verbindlichen Zusage `promise` und der Plan-ETA; fehlt ohne angeschlossenes Grundmodell.
      required:
      - pickup_at
      - dropoff_at
      - previous_pickup_at
      - plan_sequence
      - plan_revision
      - data_as_of
      - source
    RideBookingEtaForecast:
      type: object
      additionalProperties: false
      description: 'Prognosefenster der Ankunft am Einstiegsstopp mit Datenstand (WP-M4-66). Bei Positionsdaten älter als `eta_max_data_age_sec` (oder ohne Position, ohne Modell) ist `fallback_reason` gesetzt und `basis` der Rückfall laut `eta_fallback_policy` (`PLAN_TIME` bzw. `REFERENCE_FORECAST`) statt einer scheinbar aktuellen Prognose; die Zusage bleibt unverändert.'
      properties:
        earliest_at:
          $ref: common.yaml#/components/schemas/Timestamp
        latest_at:
          $ref: common.yaml#/components/schemas/Timestamp
        basis:
          type: string
          enum:
          - LIVE_POSITION
          - PLAN_TIME
          - REFERENCE_FORECAST
        data_stand:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
          description: Messzeit der letzten Position.
        fallback_reason:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
        model_version:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
        config_version:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
      required:
      - earliest_at
      - latest_at
      - basis
      - data_stand
      - fallback_reason
    RideVehicleIdentification:
      type: object
      additionalProperties: false
      description: 'Fahrzeugidentifikation für Fahrgäste, sobald die Buchung einem Fahrzeug im Plan zugewiesen ist (Arbeitsannahme zu Offener Punkt 35): Bezeichnung und Klasse, nie Halter, Fahrer oder Wartungsdaten.'
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
        vehicle_class:
          oneOf:
          - type: string
            pattern: ^[A-Z][A-Z0-9_]{1,39}$
          - type: 'null'
      required:
      - label
      - vehicle_class
    RideCancellationOption:
      type: object
      additionalProperties: false
      description: 'Stornoregel der Buchung für UI-04 (WP-M2-46): `allowed` ist, ob der Fahrgast jetzt stornieren darf (Zustand, Frist, zulässiger Grund); `deadline_at` der späteste Zeitpunkt (Beginn des zugesagten Abholfensters minus Frist). Die Entscheidung trifft der Server beim Storno erneut (`409 CANCEL_DEADLINE_EXPIRED`).'
      properties:
        allowed:
          type: boolean
        deadline_at:
          $ref: common.yaml#/components/schemas/Timestamp
        deadline_min:
          type: integer
          format: int64
          minimum: 0
          maximum: 525600
        deadline_defaulted:
          type: boolean
          description: Die Frist ist ein Planungsdefault (kein veröffentlichter Dienstparameter).
      required:
      - allowed
      - deadline_at
      - deadline_min
      - deadline_defaulted
    RideWalkRoute:
      type: object
      additionalProperties: false
      description: 'Fußweg zum Abholhaltepunkt (WP-M2-44, LH-6.3-PAX-007) als Snapshot von Angebot bzw. Buchung: `status=ROUTE` mit Geometrie, Distanz, Gehzeit und nummerierten Wegschritten; `status=FALLBACK` bei Ausfall des Fußwegdienstes (nur Haltepunktname, Luftlinie, gekennzeichnet); `status=NO_WALK`, wenn Start und Haltepunkt zusammenfallen. Kein angebotener Weg überschreitet `stop_walk_max_m`. Karte und Textanleitung tragen denselben Snapshot (`snapshot_id`).'
      properties:
        status:
          type: string
          enum:
          - ROUTE
          - FALLBACK
          - NO_WALK
        snapshot_id:
          $ref: common.yaml#/components/schemas/UUID
        distance_m:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000
        duration_s:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
        profile:
          type: string
          minLength: 1
          maxLength: 32
        map_version:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
        fallback_reason:
          oneOf:
          - type: string
            enum:
            - ROUTING_UNAVAILABLE
            - NO_ORIGIN_STOP
          - type: 'null'
        geometry:
          type: array
          maxItems: 2000
          items:
            $ref: common.yaml#/components/schemas/Point
        steps:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/RideWalkStep'
        pickup_stop_name:
          type: string
          minLength: 1
          maxLength: 200
        computed_at:
          $ref: common.yaml#/components/schemas/Timestamp
      required:
      - status
      - snapshot_id
      - distance_m
      - duration_s
      - profile
      - map_version
      - fallback_reason
      - geometry
      - steps
      - pickup_stop_name
      - computed_at
    RideWalkStep:
      type: object
      additionalProperties: false
      description: 'Ein Wegschritt der Textanleitung (WP-M2-44): `instruction` ist der ausformulierte Satz (Formulierungsregeln im Detailvertrag LH-6.3-PAX-007), `maneuver` der strukturierte Typ, Distanz und Dauer gelten für den Abschnitt bis zum nächsten Schritt.'
      properties:
        seq:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
        maneuver:
          type: string
          enum:
          - START
          - TURN_LEFT
          - TURN_RIGHT
          - ARRIVE
        distance_m:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000
        duration_s:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
        instruction:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - seq
      - maneuver
      - distance_m
      - duration_s
      - instruction
    RidePayment:
      type: object
      additionalProperties: false
      description: 'Zahlungsblock (WP-M2-30, LH-6.10-PAY-004): UI-Projektion des Zahlstatus, **getrennt** vom Buchungsstatus `state` gespeichert und abgerufen. Interne `CAPTURE_UNKNOWN`/`RECONCILING`
        und eine unbestimmte Autorisierung erscheinen als `UNKNOWN` (Kap. 05 §5.9); `refund_pending` ist eine beauftragte, noch nicht bestätigte Erstattung (WP-M2-31). Fehlt der Block, wurde keine Zahlung begonnen.'
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        status:
          type: string
          enum:
          - CREATED
          - REQUIRES_ACTION
          - AUTHORIZED
          - AUTHORIZATION_FAILED
          - CAPTURE_PENDING
          - CAPTURED
          - VOID_PENDING
          - VOIDED
          - PARTIALLY_REFUNDED
          - REFUNDED
          - UNKNOWN
        authorized:
          $ref: common.yaml#/components/schemas/Money
        captured:
          $ref: common.yaml#/components/schemas/Money
        refunded:
          $ref: common.yaml#/components/schemas/Money
        refund_pending:
          $ref: common.yaml#/components/schemas/Money
        failure_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
          description: Stabiler Fehlercode (z. B. `DECLINED`, `AUTHORIZATION_EXPIRED`, `CAPTURE_DECLINED`); nie Freitext.
        refund:
          $ref: '#/components/schemas/RideRefund'
        operation_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - status
      - authorized
      - captured
      - refunded
      - revision
    RideRefund:
      type: object
      additionalProperties: false
      description: 'Stand der Erstattung nach Storno (WP-M2-31): `REQUESTED` beauftragt, noch nicht vom PSP bestätigt (dem Fahrgast „Erstattung beauftragt“, nie „erstattet“), `CONFIRMED` bestätigt,
        `FAILED` vom PSP abgelehnt (die Buchung bleibt storniert, der Betrag `requested` abzüglich `refunded` bleibt offen), `PENDING_CAPTURE` wartet auf einen laufenden Einzug, `NOT_DUE` kein Anspruch nach der Regel.'
      properties:
        status:
          type: string
          enum:
          - PENDING_CAPTURE
          - REQUESTED
          - CONFIRMED
          - FAILED
          - NOT_DUE
          - NOT_REQUIRED
        requested:
          $ref: common.yaml#/components/schemas/Money
        refunded:
          $ref: common.yaml#/components/schemas/Money
        failure_code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{0,63}$
      required:
      - status
      - requested
      - refunded
    RideRefundHint:
      type: object
      additionalProperties: false
      description: 'Erstattungshinweis in der Storno-Antwort (WP-M2-31): was mit der Zahlung geschieht. `VOID_REQUESTED` die Autorisierung wird aufgehoben (kein Einzug), `REQUESTED` eine Erstattung ist beauftragt,
        `PENDING_CAPTURE` sie folgt nach dem laufenden Einzug, `NOT_DUE` kein Anspruch, `NONE` nichts zu tun. „Erstattet“ steht erst nach Bestätigung des PSP in `payment.refund`.'
      properties:
        status:
          type: string
          enum:
          - NONE
          - VOID_REQUESTED
          - PENDING_CAPTURE
          - REQUESTED
          - CONFIRMED
          - FAILED
          - NOT_DUE
        amount:
          $ref: common.yaml#/components/schemas/Money
      required:
      - status
      - amount
    RidePromise:
      type: object
      additionalProperties: false
      properties:
        pickup_earliest:
          $ref: common.yaml#/components/schemas/Timestamp
        pickup_latest:
          $ref: common.yaml#/components/schemas/Timestamp
        arrival_earliest:
          $ref: common.yaml#/components/schemas/Timestamp
        arrival_latest:
          $ref: common.yaml#/components/schemas/Timestamp
        gross:
          $ref: common.yaml#/components/schemas/Money
        cancellation_policy_ref:
          type: string
          minLength: 1
          maxLength: 64
        vehicle_class:
          type: string
          minLength: 1
          maxLength: 32
        resource_vector:
          $ref: '#/components/schemas/RideResourceVector'
      required:
      - pickup_earliest
      - pickup_latest
      - arrival_earliest
      - arrival_latest
      - gross
      - cancellation_policy_ref
      - resource_vector
      description: 'Lesesicht auf `booking.promise_snapshot`: nach Bestätigung unveränderlich je Revision, der Ressourcenvektor ist
        Teil davon.'
    RideCancelRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          enum:
          - PASSENGER_REQUEST
          - OPERATOR_CANCELLATION
          - NO_SHOW
          - PAYMENT_FAILED
          - SAFETY
          - VEHICLE_OUTAGE
        reason_text:
          type: string
          minLength: 1
          maxLength: 500
          description: Freitext zum Grund; wird nur beim Storno durch Betriebspersonal im Änderungsprotokoll der Leitstelle gespeichert (WP-M3-39).
      required:
      - reason
      description: 'Einstufiges Storno (M2 OP-24, Annahme). Fahrgäste dürfen nur `PASSENGER_REQUEST` setzen (sonst 403) und nur innerhalb der Stornofrist des Dienstes
        (`409 CANCEL_DEADLINE_EXPIRED`); Betrieb im Dienstscope setzt jeden für den Dienst zulässigen Grund (sonst 422), auch `VEHICLE_OUTAGE`; ein Storno durch Betriebspersonal schreibt Akteur, Zeitpunkt, Grund und Freitext in das Änderungsprotokoll und das Audit (WP-M3-39). Antwort: die stornierte Buchung (Erstattungshinweis folgt mit WP-M2-31).'
      examples:
      - reason: PASSENGER_REQUEST
