paths:
  /v1/expenses/receipts:
    post:
      summary: Uploadticket für ein Beleg-Original anfordern
      operationId: requestReceiptUpload
      security:
      - oidc:
        - receipts:write
      description: 'Stellt ein einmal verbrauchbares Uploadticket mit erlaubter Größe, MIME-Typ (JPEG, PNG, PDF) und erwartetem SHA-256 aus; Planungsdefaults: höchstens 10 MiB, 15 Minuten gültig (nicht freigegeben, Offener Punkt 13). Die Datei wird danach direkt in die Quarantäne des Objektspeichers geladen (`upload.url`, vorsigniert; solange kein Objektspeicher-Adapter angebunden ist, ist `upload` null) und mit `completeReceiptUpload` abgeschlossen. Der Hash wird als base64url ohne Auffüllung (43 Zeichen) übertragen, weil lange Hexfolgen die Kartendatenerkennung (SEC-008) fehldeuten können. Rechtsträger eines anderen Mandanten: 404; Typ, Größe oder Hash unzulässig: 422. Das Ticket gilt auch für andere Module (`purpose` DAMAGE_PHOTO: Fotoevidenz der Schadenmeldung). Idempotente Anlage (WP-M4-25/-26): mit `client_uuid` (vom Gerät vor dem Upload erzeugt) liefert 201 ein neues Ticket, 200 dasselbe noch gültige Ticket (Wiederaufnahme eines abgebrochenen Uploads) oder, wenn der Beleg schon angelegt ist, dessen Ticket mit `document_id` (Zustand CONSUMED, nichts mehr hochzuladen). Dieselbe `client_uuid` mit abweichendem Hash, Typ oder Größe ist 409 ohne Überschreiben; ein Vorgang (`case_ref`), der dem Fahrer der Fahrer-App nicht zugewiesen ist, 403 (unbekannt: 404). `captured_at` ist die Erfassungszeit am Gerät und wird getrennt von der Eingangszeit des Servers gespeichert. Ein Abbruch vor dem Abschluss hinterlässt keinen Beleg.'
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '201':
          description: Neues Ticket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptUploadTicket'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '200':
          description: Vorhandenes Ticket zur `client_uuid` (Wiederaufnahme) oder Ticket des bereits angelegten Belegs (`document_id` gesetzt).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptUploadTicket'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptUploadRequest'
  /v1/expenses/receipts/{ticket_id}/complete:
    post:
      summary: Upload abschließen und Quarantäneprüfung starten
      operationId: completeReceiptUpload
      security:
      - oidc:
        - receipts:write
      description: 'Schließt den Upload ab: der Server liest die Datei aus der Quarantäne und prüft Größe, SHA-256 und tatsächlichen Dateityp gegen das Ticket (Abweichung: 422, das Ticket ist danach verbraucht). Danach läuft die Malware-Prüfung. Antwort `QUARANTINED` (Prüfer nicht verfügbar, bleibt in Quarantäne), `STORED` (Original gespeichert) oder `QUARANTINE_REJECTED` (Schadsoftware, endgültig, Sicherheitsereignis, nie ausgeliefert oder an OCR übergeben). `If-Match` trägt die Ticketrevision (veraltet: 412, fehlend: 428). Ein abgelaufenes oder bereits verbrauchtes Ticket ist nicht wiederverwendbar (409); parallele Abschlüsse ergeben genau ein Dokument; fremde Tickets sind nicht auffindbar (404). Für Tickets mit `client_uuid` ist der Abschluss idempotent: ein bereits verbrauchtes Ticket liefert 200 mit dem vorhandenen Beleg (nicht 409); läuft der Abschluss gerade in einem parallelen Lauf, 409 zum Wiederholen.'
      parameters:
      - name: ticket_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Ticket-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '201':
          description: Beleg neu angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDocument'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '200':
          description: Der Beleg zu diesem Ticket (Client-UUID) war schon angelegt; keiner zusätzlich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDocument'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/expenses/receipts/{document_id}:
    get:
      summary: Beleg-Original mit Prüfzustand lesen
      operationId: getReceiptDocument
      security:
      - oidc:
        - receipts:read
      description: 'Liefert Zustand und Metadaten des hochgeladenen Dokuments (nicht den Inhalt). Sichtbar für den Erfasser und die Finanzrolle; fremde Mandanten und andere Akteure: 404.'
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Dokument-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDocument'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/expenses/receipts/{document_id}/extract:
    post:
      summary: Feldextraktion (OCR) zu einem Beleg anstoßen
      operationId: requestReceiptExtraction
      security:
      - oidc:
        - receipts:write
      description: 'Legt den Extraktionslauf zum Beleg an (höchstens einer je Beleg und OCR-Version; ein zweiter Aufruf liefert den vorhandenen) und stößt die Ausführung an (202). Der Lauf erkennt Belegdatum, Betrag, Währung, Händler, Belegnummer und Mehrwertsteuerbeträge; nicht sichtbare Felder bleiben leer, der Text wird nie als Anweisung ausgeführt. Nur für Belege im Zustand STORED (Quarantäne und Ablehnung: 409), mit `receipt_ocr_enabled = false` 409 (manuelle Erfassung bleibt möglich), ohne konfigurierte Engine 503. `If-Match` trägt die Revision des Belegs, auf der die Extraktion beruht (veraltet: 412, fehlend: 428). Ergebnis über `getReceiptExtraction`.'
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Dokument-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '202':
          description: Lauf angenommen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionRun'
          headers:
            Location:
              schema:
                type: string
                maxLength: 300
              description: Ort des Ergebnisses (`/v1/expenses/receipts/{document_id}/extraction`).
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/expenses/receipts/{document_id}/extraction:
    get:
      summary: Extraktionsergebnis eines Belegs lesen
      operationId: getReceiptExtraction
      security:
      - oidc:
        - receipts:read
      description: 'Liefert den jüngsten Lauf mit den unveränderten OCR-Vorschlägen (`proposals`) und dem jeweils jüngsten Stand je Feld (`current`: Vorschlag, Bestätigung oder Korrektur). Jedes Feld trägt Rohwert, normalisierten Wert, neutralisierten Anzeigewert, Konfidenz und Fundstelle. Bestätigen und Korrigieren geschieht über `correctExpense`. 404, wenn kein Lauf existiert oder der Beleg nicht sichtbar ist.'
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Dokument-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionResult'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/expenses/receipts/{document_id}/edited-view:
    put:
      summary: Bearbeitete Ansicht (Zuschnitt, Drehung) eines Belegs ablegen
      operationId: attachReceiptEditedView
      security:
      - oidc:
        - receipts:write
      description: 'Legt die bearbeitete Ansicht des Fotos (Zuschnitt, Drehung) als eigenes Objekt ab; das Rohbild (Original) bleibt byteweise unverändert und über `getExpenseOriginal` abrufbar (WP-M4-25). Jede Ablage erzeugt genau eine neue Belegrevision; die jüngste Ansicht gilt. Nur für Belege im Zustand STORED; `If-Match` trägt die Belegrevision (428 ohne, 412 veraltet). Typ (JPEG oder PNG) wird am Inhalt geprüft (422). Sichtbar nur für den Erfasser und die Finanzrolle (sonst 404).'
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Dokument-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptEditedViewRequest'
      responses:
        '200':
          description: Ansicht abgelegt; der Beleg trägt die neue Revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDocument'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    get:
      summary: Bearbeitete Ansicht eines Belegs abrufen
      operationId: getReceiptEditedView
      security:
      - oidc:
        - receipts:read
      description: 'Liefert die jüngste bearbeitete Ansicht (Bytes, JPEG oder PNG), unabhängig vom Original. Ohne abgelegte Ansicht und für nicht sichtbare Belege 404.'
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Dokument-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    ReceiptEditedViewRequest:
      type: object
      additionalProperties: false
      properties:
        mime:
          type: string
          enum:
          - image/jpeg
          - image/png
        content_base64:
          type: string
          minLength: 4
          maxLength: 20000000
          description: Bearbeitete Ansicht, base64 (Standardalphabet).
      required:
      - mime
      - content_base64
    ReceiptUploadRequest:
      type: object
      additionalProperties: false
      properties:
        legal_entity_id:
          $ref: common.yaml#/components/schemas/UUID
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        mime:
          type: string
          enum:
          - image/jpeg
          - image/png
          - application/pdf
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1073741824
          description: Erwartete Größe in Byte; über der Obergrenze der Anlage ist 422.
        sha256:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Erwarteter SHA-256 der Datei, base64url ohne Auffüllung (43 Zeichen).
        source_channel:
          type: string
          enum:
          - DRIVER_APP
          - DISPATCH_WEB
          description: Herkunftskanal des Belegs (Fahrer-App oder Leitstelle/Web-Upload); Vorgabe DISPATCH_WEB. E-Mail-Eingang und Rechnungsimport sind serverseitige Kanäle und hier nicht wählbar (422).
        document_kind:
          type: string
          enum:
          - RECEIPT
          - FUEL_RECEIPT
          - INVOICE
          - OTHER
          description: Belegart; Vorgabe RECEIPT.
        case_ref:
          $ref: finance.yaml#/components/schemas/ExpenseCaseRef
          description: Vorgang (Fahrzeug oder Schicht) des Mandanten; ein unbekannter oder fremder Vorgang ist 404. Aus der Fahrer-App nur ein dem Fahrer zugewiesener Vorgang (Fahrzeug einer eigenen Schicht bzw. eigene Schicht), sonst 403.
        client_uuid:
          $ref: common.yaml#/components/schemas/UUID
          description: Stabile Kennung des Entwurfs, vom Gerät vor dem Upload erzeugt; macht die Anlage idempotent (je Mandant eindeutig, WP-M4-26).
        captured_at:
          type: string
          format: date-time
          description: Erfassungszeit am Gerät; wird getrennt von der Eingangszeit des Servers gespeichert und nie überschrieben.
      required:
      - legal_entity_id
      - purpose
      - mime
      - size_bytes
      - sha256
    UploadPurpose:
      type: string
      enum:
      - RECEIPT
      - DAMAGE_PHOTO
    ReceiptUploadTicket:
      type: object
      additionalProperties: false
      properties:
        ticket_id:
          $ref: common.yaml#/components/schemas/UUID
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        mime:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1073741824
        sha256:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        max_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1073741824
          description: Obergrenze der Anlage (Planungsdefault, nicht freigegeben).
        expires_at:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - ISSUED
          - CONSUMED
          description: ISSUED = Upload und Abschluss stehen aus; CONSUMED = der Beleg ist angelegt (`document_id`), nichts mehr hochzuladen.
        client_uuid:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        captured_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        document_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Gesetzt, sobald der Beleg angelegt ist.
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        upload_key:
          type: string
          maxLength: 200
          description: Objektname in der Quarantäne (ohne Mandantenpräfix), nur zur Zuordnung.
        upload:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            properties:
              method:
                type: string
                enum:
                - PUT
              url:
                type: string
                maxLength: 2048
              headers:
                type: object
                additionalProperties:
                  type: string
                  maxLength: 512
            required:
            - method
            - url
            - headers
          description: Vorsigniertes Ziel des direkten Uploads; null, solange kein Objektspeicher-Adapter angebunden ist.
      required:
      - ticket_id
      - purpose
      - mime
      - size_bytes
      - sha256
      - max_bytes
      - expires_at
      - state
      - revision
      - upload_key
      - upload
    ReceiptDocument:
      type: object
      additionalProperties: false
      properties:
        document_id:
          $ref: common.yaml#/components/schemas/UUID
        ticket_id:
          $ref: common.yaml#/components/schemas/UUID
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        state:
          type: string
          enum:
          - QUARANTINED
          - STORED
          - QUARANTINE_REJECTED
          description: In Quarantäne (nicht ausgeliefert, nicht an OCR), geprüft und als Original gespeichert, oder endgültig abgelehnt.
        mime:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1073741824
        sha256:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Serverseitig berechneter SHA-256 des Originals, base64url.
        received_at:
          type: string
          format: date-time
        scanned_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        source_channel:
          type: string
          enum:
          - DRIVER_APP
          - DISPATCH_WEB
          - EMAIL_INBOUND
          - INVOICE_IMPORT
        document_kind:
          type: string
          enum:
          - RECEIPT
          - FUEL_RECEIPT
          - INVOICE
          - OTHER
        integrity:
          type: string
          enum:
          - UNCHECKED
          - VERIFIED
          - VIOLATED
        client_uuid:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Kennung des Entwurfs aus der Fahrer-App (Idempotenzschlüssel); bei anderen Kanälen die Beleg-ID.
        captured_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Erfassungszeit am Gerät, getrennt von `received_at` (Eingangszeit am Server).
      required:
      - source_channel
      - document_kind
      - integrity
      - document_id
      - ticket_id
      - purpose
      - state
      - mime
      - size_bytes
      - sha256
      - received_at
      - scanned_at
      - revision
    ExtractedField:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        field:
          type: string
          enum:
          - DOCUMENT_DATE
          - AMOUNT
          - CURRENCY
          - MERCHANT
          - DOCUMENT_NUMBER
          - VAT_AMOUNT
          - NET_AMOUNT
        occurrence:
          type: integer
          minimum: 0
          maximum: 20
          description: Laufende Nummer bei mehreren Mehrwertsteuerbeträgen (je Satz).
        origin:
          type: string
          enum:
          - OCR
          - HUMAN
        status:
          type: string
          enum:
          - PROPOSED
          - CONFIRMED
          - CORRECTED
        raw_value:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
          description: Rohtext der Fundstelle, nur als Datum.
        normalized_value:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
          description: Normalisierter Wert (Betrag als Ganzzahl in kleinster Einheit, Datum ISO-8601, Währung ISO-4217); null = nicht erkannt.
        display_value:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
          description: Neutralisierte Darstellung (kein Markup, keine Formel); die Oberfläche zeigt nur diesen Wert.
        qualifier:
          oneOf:
          - type: string
            maxLength: 40
          - type: 'null'
          description: Bei Mehrwertsteuerbeträgen der Satz in Prozent.
        confidence:
          oneOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        source:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            properties:
              page:
                type: integer
                minimum: 1
              x:
                type: number
              y:
                type: number
              width:
                type: number
              height:
                type: number
            required:
            - page
            - x
            - y
            - width
            - height
          description: Fundstelle im Beleg.
        suspicious:
          type: boolean
          description: Der Text wirkt wie Anweisung, Formel oder Markup; er wurde nur als Daten gespeichert und löst keine Aktion aus.
        corrects_field_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        decided_by:
          oneOf:
          - type: string
            maxLength: 200
          - type: 'null'
        decided_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        flag_reason:
          oneOf:
          - type: string
            enum:
            - LOW_CONFIDENCE
            - SUM_MISMATCH
          - type: 'null'
          description: Nur am OCR-Vorschlag. Niedrige Konfidenz oder Summenabweichung (Netto + Steuer ≠ Brutto); ein markierter Vorschlag bedarf einer menschlichen Bestätigung oder Korrektur vor der Freigabe.
      required:
      - id
      - field
      - occurrence
      - origin
      - status
      - raw_value
      - normalized_value
      - display_value
      - qualifier
      - confidence
      - source
      - suspicious
      - corrects_field_id
      - decided_by
      - decided_at
      - flag_reason
    ExtractionRun:
      type: object
      additionalProperties: false
      properties:
        run_id:
          $ref: common.yaml#/components/schemas/UUID
        document_id:
          $ref: common.yaml#/components/schemas/UUID
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - COMPLETED
          - FAILED
        engine:
          type: string
          maxLength: 100
        ocr_version:
          type: string
          maxLength: 100
        attempt:
          type: integer
          minimum: 0
        failure:
          oneOf:
          - type: string
            enum:
            - TIMEOUT
            - ENGINE_ERROR
            - UNSUPPORTED_CONTENT
            - ORIGINAL_UNAVAILABLE
          - type: 'null'
        field_count:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        requested_at:
          type: string
          format: date-time
        finished_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - run_id
      - document_id
      - status
      - engine
      - ocr_version
      - attempt
      - failure
      - field_count
      - requested_at
      - finished_at
    ExtractionResult:
      type: object
      additionalProperties: false
      properties:
        run:
          $ref: '#/components/schemas/ExtractionRun'
        proposals:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedField'
        current:
          type: array
          items:
            $ref: '#/components/schemas/ExtractedField'
      required:
      - run
      - proposals
      - current
