paths:
  /v1/audit-events:
    get:
      summary: Auditereignisse abfragen (nur lesend)
      operationId: listAuditEvents
      security:
      - oidc:
        - audit:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - name: object_ref
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/company-profile:
    get:
      summary: Unternehmensprofil lesen
      operationId: getCompanyProfile
      security:
      - oidc:
        - company:read
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    put:
      summary: Unternehmensprofil ändern
      operationId: updateCompanyProfile
      security:
      - oidc:
        - company:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyProfileUpdate'
  /v1/retention-rules:
    get:
      summary: Aufbewahrungsregeln auflisten
      operationId: listRetentionRules
      security:
      - oidc:
        - retention:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionRulePage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/retention-rules/{rule_id}:
    put:
      summary: Aufbewahrungsregel ändern
      operationId: updateRetentionRule
      security:
      - oidc:
        - retention:write
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionRule'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetentionRuleUpdate'
components:
  schemas:
    AuditEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        actor_ref:
          type: string
          minLength: 1
          maxLength: 200
        action:
          type: string
          minLength: 1
          maxLength: 128
        object_ref:
          type: string
          minLength: 1
          maxLength: 256
        occurred_at:
          type: string
          format: date-time
        correlation_id:
          $ref: common.yaml#/components/schemas/UUID
      required:
      - id
      - actor_ref
      - action
      - object_ref
      - occurred_at
      - correlation_id
    AuditEventPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
    CompanyProfile:
      type: object
      additionalProperties: false
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 500
        contact_email:
          type: string
          minLength: 3
          maxLength: 254
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - legal_name
      - address
      - contact_email
      - revision
    CompanyProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          minLength: 1
          maxLength: 500
        contact_email:
          type: string
          minLength: 3
          maxLength: 254
      required:
      - legal_name
      - address
      - contact_email
      examples:
      - legal_name: Stadtwerke Beispiel GmbH
        address: Musterstraße 1, 12345 Musterstadt
        contact_email: info@example.org
    RetentionRule:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        data_category:
          type: string
          minLength: 1
          maxLength: 64
        retention_days:
          type: integer
          format: int64
          minimum: 1
          maximum: 36500
        action:
          type: string
          enum:
          - ARCHIVE
          - DELETE
          - ANONYMIZE
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - data_category
      - retention_days
      - action
      - revision
    RetentionRuleUpdate:
      type: object
      additionalProperties: false
      properties:
        retention_days:
          type: integer
          format: int64
          minimum: 1
          maximum: 36500
        action:
          type: string
          enum:
          - ARCHIVE
          - DELETE
          - ANONYMIZE
      required:
      - retention_days
      - action
      examples:
      - retention_days: 365
        action: ANONYMIZE
    RetentionRulePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RetentionRule'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
