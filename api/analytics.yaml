paths:
  /v1/analytics/metrics:
    get:
      summary: Kennzahlregister lesen und Kennzahlwerte mit Datenstand abfragen
      operationId: getAnalyticsMetrics
      security:
      - oidc:
        - analytics:read
      description: 'Liefert die freigegebenen Kennzahldefinitionen (stabile ID, Definitionsversion, Zähler, Nenner, Ausschlüsse, Zeitbezug, zulässige Filterdimensionen; WP-M4-46) und, wenn ein Zeitraum (`from`/`to`) angegeben ist, die Werte der Kennzahl(en) mit Definition und Version, Filter, Zähler, Nenner, Datenstand (`as_of`) und Vollständigkeit. Der Zeitraum besteht aus Betriebstagen in der `reporting_timezone` des Mandanten, nie aus festen 24 Stunden. Ein Nullnenner oder fehlende Daten ergeben `NOT_COMPUTABLE` mit Grund (nie 0 oder 100 %), unvollständige Quellen `PROVISIONAL` mit Abdeckungsgrad, kleine Gruppen `SUPPRESSED` (auch per Differenzbildung benachbarter Filter nicht ableitbar). Identische Abfragen liefern für alle berechtigten Benutzer des Mandanten identische Werte und denselben Datenstand. Mit `breakdown=rejection_reason` zusätzlich die Ablehnungen nach Grund und Gruppe (Spalte „Ablehnungsgrund“: Primärgründe zählen Ablehnungen, Sekundärgründe nur als Label, technische Fehler getrennt; `reason_code` begrenzt auf einen Katalogcode). Unbekannte Kennzahl oder Version: 404; nicht zulässige Filterdimension (bei angegebener `metric_id`; ohne `metric_id` erscheinen nur die Kennzahlen, die alle gesetzten Dimensionen kennen), unbekannter Ablehnungscode oder unvollständige Parameter: 400. Mit `breakdown=funnel` zusätzlich der Nachfragetrichter (WP-M4-51, KPI-005/ANA-001): die vier Zählgrößen Anfragen, Angebote (angezeigt), bestätigte und abgeschlossene Buchungen stehen getrennt in `funnel.counts` und werden nie als Summe ausgewiesen; `funnel.end_states` trennt Anfrage abgelehnt, Angebot angezeigt aber nicht gebucht, Zahlung fehlgeschlagen, Fahrgaststorno und Betreiberstorno (Storno nach Abschluss ändert die Stufe „abgeschlossen“ nicht). Jede Auswertung wird als Snapshot mit Definitionsversion festgehalten. Energiekosten (WP-M4-43, `energy_cost_per_100km` und `energy_cost_per_operating_hour`): nur freigegebene, gebuchte Tankvorgänge gehen ein (Kostenbasis in Minor Units, je Energieart und Währung getrennt, nie gemischt oder addiert); nicht eingegangene Vorgänge stehen mit Grund in `exclusions`, fehlende Energiedaten senken den Abdeckungsgrad (`PROVISIONAL`) und ergeben nie 0 Kosten; `approximation` kennzeichnet die P1-Erwerbsnäherung. Ein unbekanntes oder fremdes Fahrzeug (`vehicle_id`) ist 404. Berichtsdimensionen (WP-M4-58, ANA-003/KPI-011): Betreiber, Region, Bediengebiet, Dienst, Tag, Ortsstunde und Fahrzeugtyp lassen sich einzeln und kombiniert filtern; die Filter bilden mit dem Dienstscope der Mitgliedschaft (`membership.service_scope`, zum Auswertungszeitpunkt gelesen) die Schnittmenge und erweitern ihn nie, ein abweichender Mandantenbezug (`tenant_id` in Query oder Header) wird nie ausgewertet, der Anfragefilter antwortet 404 wie bei einem nicht vorhandenen Objekt (der Mandant kommt allein aus dem Token), fremde Kennungen liefern dieselbe leere Menge wie nie vergebene. Gruppen unter dem Parameter `kpi_aggregation_min_n` werden nicht ausgewiesen (`SUPPRESSED`/`suppressed`, Zahlen `null`), auch wenn sie sich aus zwei benachbarten Filtern durch Differenzbildung ergäben. Die Antwort trägt zusätzlich die Listenhülle `items`, `next_cursor` (immer `null`) und `as_of`.'
      parameters:
      - name: metric_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        description: Stabile technische Kennzahl-ID; ohne Angabe alle Kennzahlen.
      - name: version
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Definitionsversion (nur zusammen mit `metric_id`); ohne Angabe die jüngste freigegebene Version.
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Erster Betriebstag (lokales Datum in der `reporting_timezone`). Ohne Zeitraum werden nur Definitionen geliefert.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Letzter Betriebstag einschließlich; Standard `from`.
      - name: service_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Filterdimension Dienst (nur für Kennzahlen, deren Definition sie zulässt).
      - name: channel
        in: query
        required: false
        schema:
          type: string
          enum:
          - WEB
          - APP
          - API
        description: Filterdimension Kanal (nur für Kennzahlen, deren Definition sie zulässt).
      - name: vehicle_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Filterdimension Fahrzeug (nur Energiekosten-Kennzahlen); ein unbekanntes oder fremdes Fahrzeug ist 404.
      - name: energy
        in: query
        required: false
        schema:
          type: string
          enum:
          - FUEL
          - ELECTRIC
        description: Filterdimension Energieart (nur Energiekosten-Kennzahlen); ohne Angabe je Energieart ein eigener Wert (Kraftstoff in Liter, Strom in kWh, nie gemischt).
      - name: currency
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z]{3}$
        description: Filterdimension Währung (nur Energiekosten-Kennzahlen); ohne Angabe je vorkommender Währung ein eigener Wert, Währungen werden nie addiert.
      - name: operator_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Berichtsdimension Betreiber (WP-M4-58, ANA-003/KPI-011). Eine fremde oder unbekannte Kennung ergibt dieselbe leere Menge, nie Daten eines anderen Mandanten.
      - name: region_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Berichtsdimension Region (Region des Dienstes zum Ereigniszeitpunkt).
      - name: service_area_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Berichtsdimension Bediengebiet (stabiler Gebietsschlüssel der Revisionskette).
      - name: vehicle_type
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
        description: Berichtsdimension Fahrzeugtyp (`vehicle.vehicle_type`); nur für Kennzahlen mit Fahrzeugbezug (Abholpünktlichkeit, Energiekosten), sonst 400.
      - name: day
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Berichtsdimension Tag (Betriebstag in der `reporting_timezone`); muss im Zeitraum `from`/`to` liegen (sonst 400) und schränkt ihn auf diesen Tag ein.
      - name: hour
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 23
        description: Berichtsdimension Ortsstunde in der `reporting_timezone` (DST-sicher; am Herbstumstellungstag gehören beide Durchläufe der Stunde 2 zur Stunde 2).
      - name: breakdown
        in: query
        required: false
        schema:
          type: string
          enum:
          - rejection_reason
          - funnel
        description: 'Zusätzlich `rejection_reason`: die Ablehnungsstatistik nach Grund, oder `funnel`: der Nachfragetrichter (WP-M4-51) mit den vier getrennten Zählgrößen und den Endzuständen (erfordert `from`; `channel` ist für den Trichter nicht zulässig, 400).'
      - name: reason_code
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
        description: 'Nur mit `breakdown=rejection_reason`, Katalogcode; ein unbekannter Code ist 400.'
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Definitionen und, bei angegebenem Zeitraum, Werte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsMetrics'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/analytics/vehicle-km:
    get:
      summary: Kennzahlen-Datenbasis lesen (Fahrzeugkilometer je Kategorie)
      operationId: getVehicleKmClasses
      security:
      - oidc:
        - costs:read
      description: 'WP-M4-42 (FCO-005, Kap. 05 §5.7): Fahrzeugkilometer je Kategorie (`PASSENGER`, `EMPTY`, `TRANSFER`, `WORKSHOP`) und **separat** die nicht zuordenbaren Kilometer (`unassigned_km_thousandths`, der Rest zur Gesamtstrecke, nie auf andere Kategorien verteilt). Es gilt `total_km_thousandths` = Summe der vier Kategorien + `unassigned_km_thousandths` (ganzzahlig in Tausendstel Kilometern, also Metern). Je Fahrzeug und Betriebstag (UTC) zählt der jüngste Klassifikationslauf; `as_of` ist dessen Datenstand, `completeness` ist `INCOMPLETE`, solange die Fahrerereignisse eines Laufs unvollständig sind (Revisionslücke, Einstieg ohne Ausstieg). `definition_version` ist die Regelversion der Klassifikation (Vorschlag, in WP-M4-01 freizugeben, OP-22). Ohne `vehicle_id` über alle Fahrzeuge des Mandanten; ein Zeitraum ohne Fahrten liefert eine leere Auswertung (200, `days` leer). **`metric`, `from` und `to` sind Pflicht** (422 ohne), höchstens 366 Tage, `to` nicht vor `from`; fremdes oder unbekanntes Fahrzeug 404. Keine Fahrerbezüge.'
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - name: metric
        in: query
        required: false
        schema:
          type: string
          enum:
          - VEHICLE_KM_CLASSES
        description: Kennzahl, **Pflicht**; in P1 nur `VEHICLE_KM_CLASSES` (Datenbasis für `Leerkilometerquote` und `Produktive Kilometer`, Formeln in WP-M4-56).
      - name: from
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
        description: Erster Betriebstag (inklusive, `JJJJ-MM-TT`, UTC-Tag), **Pflicht**.
      - name: to
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
        description: Letzter Betriebstag (inklusive), **Pflicht**.
      - name: vehicle_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Auf ein Fahrzeug des Mandanten einschränken.
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KmMetrics'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    MetricDefinition:
      type: object
      additionalProperties: false
      description: Freigegebene Kennzahldefinition in einer Version; nach der Freigabe unveränderlich, eine Änderung ist eine neue Version.
      properties:
        metric_id:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        version:
          type: integer
          minimum: 1
        name:
          type: string
        value_kind:
          type: string
          enum:
          - COUNT
          - RATIO
          - MEAN
          - SUM
        unit:
          type: string
        numerator:
          type: string
          description: Definition des Zählers.
        denominator:
          type: string
          description: Definition des Nenners (bei Absolutzahlen "Keiner").
        exclusions:
          type: string
        time_basis:
          type: string
          description: Zeitbezug (Zeitpunkt, nach dem der Berichtszeitraum bestimmt wird).
        period_basis:
          type: string
          enum:
          - BUSINESS_DAY_LOCAL
          - INSTANT
        filter_dimensions:
          type: array
          items:
            type: string
            enum:
            - service_id
            - channel
            - vehicle_id
            - energy
            - currency
        report_dimensions:
          type: array
          description: Berichtsdimensionen (WP-M4-58), die für diese Kennzahl zusätzlich zu `filter_dimensions` filterbar sind; sie sind Eigenschaft der Faktentabellen, nicht der Definitionsversion.
          items:
            type: string
            enum:
            - operator_id
            - region_id
            - service_area_id
            - vehicle_id
            - vehicle_type
            - hour
            - day
        executable:
          type: boolean
          description: In diesem Stand berechenbar.
        not_executable_reason:
          oneOf:
          - type: string
            enum:
            - NOT_EXECUTABLE_IN_THIS_RELEASE
            - NO_PARTNERS_IN_P1
          - type: 'null'
      required:
      - metric_id
      - version
      - name
      - value_kind
      - unit
      - numerator
      - denominator
      - exclusions
      - time_basis
      - period_basis
      - filter_dimensions
      - report_dimensions
      - executable
      - not_executable_reason
    MetricFilterUsed:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        channel:
          type: string
          enum:
          - WEB
          - APP
          - API
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        energy:
          type: string
          enum:
          - FUEL
          - ELECTRIC
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        operator_id:
          $ref: common.yaml#/components/schemas/UUID
        region_id:
          $ref: common.yaml#/components/schemas/UUID
        service_area_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_type:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
        hour:
          type: string
          pattern: ^([0-9]|1[0-9]|2[0-3])$
          description: Ortsstunde 0 bis 23 in der `reporting_timezone` (als Zeichenfolge im Filterschlüssel).
        day:
          type: string
          format: date
        scope:
          type: string
          description: Fingerabdruck des Dienstscopes, der die Auswertung begrenzte (nur bei dienstbeschränkter Mitgliedschaft); kein Filterwert des Aufrufers.
    MetricExclusion:
      type: object
      additionalProperties: false
      description: Ein nicht eingegangener Tankvorgang einer Energiekosten-Kennzahl (WP-M4-43) mit Beleg und Grund.
      properties:
        document_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        reason:
          type: string
          enum:
          - NOT_RELEASED
          - OPEN_HINT
          - MISSING_ENERGY_TYPE
          - MISSING_QUANTITY
          - MISSING_VEHICLE
          - MIXED_ENERGY_VEHICLE
          - REVERSED
          - OTHER_CURRENCY
      required:
      - document_id
      - vehicle_id
      - reason
    MetricPeriod:
      type: object
      additionalProperties: false
      description: Berichtszeitraum aus Betriebstagen der `reporting_timezone`; `from_instant` inklusiv und `to_instant` exklusiv als absolute Zeitpunkte.
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          type: string
        from_instant:
          type: string
          format: date-time
        to_instant:
          type: string
          format: date-time
      required:
      - from
      - to
      - timezone
      - from_instant
      - to_instant
    MetricValue:
      type: object
      additionalProperties: false
      properties:
        metric_id:
          type: string
        definition_version:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - OK
          - PROVISIONAL
          - NOT_COMPUTABLE
          - SUPPRESSED
        reason:
          oneOf:
          - type: string
            enum:
            - ZERO_DENOMINATOR
            - MISSING_DENOMINATOR
            - NO_DATA
            - NOT_EXECUTABLE_IN_THIS_RELEASE
            - NO_PARTNERS_IN_P1
            - SMALL_GROUP
          - type: 'null'
        value:
          oneOf:
          - type: number
          - type: 'null'
          description: Wert; `null` bei `NOT_COMPUTABLE` und `SUPPRESSED`, nie ersatzweise 0 oder 100 %.
        numerator:
          oneOf:
          - type: number
          - type: 'null'
        denominator:
          oneOf:
          - type: number
          - type: 'null'
        coverage:
          oneOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
          description: Abdeckungsgrad der Quelle (1 = vollständig); bei `PROVISIONAL` kleiner 1.
        unit:
          type: string
        filter:
          $ref: '#/components/schemas/MetricFilterUsed'
        period:
          $ref: '#/components/schemas/MetricPeriod'
        as_of:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Datenstand der Quelle (jüngste Ereigniszeit der verarbeiteten Ereignisse), aus demselben Lesestand wie der Wert.
        source_events:
          type: integer
          minimum: 0
        snapshot_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        exclusions:
          type: array
          items:
            $ref: '#/components/schemas/MetricExclusion'
          description: 'Nur Energiekosten-Kennzahlen (WP-M4-43): nicht eingegangene Vorgänge mit Grund; sonst leer.'
        approximation:
          oneOf:
          - type: string
            enum:
            - ACQUISITION_BASIS_P1
          - type: 'null'
          description: Kennzeichnung einer Näherung; `ACQUISITION_BASIS_P1` = Erwerbsnäherung ohne Bestandsführung und Ladeverluste (Kap. 03 §1.1).
      required:
      - metric_id
      - definition_version
      - state
      - reason
      - value
      - numerator
      - denominator
      - coverage
      - unit
      - filter
      - period
      - as_of
      - source_events
      - snapshot_id
      - exclusions
      - approximation
    RejectionRow:
      type: object
      additionalProperties: false
      description: Eine Zeile der Spalte „Ablehnungsgrund“.
      properties:
        code:
          type: string
        group:
          type: string
          enum:
          - CAPACITY
          - PERSONNEL
          - EQUIPMENT
          - AREA
          - TIME_OPENING
          - TIME_DEADLINE
          - RULE
          - TARIFF
          - LIMIT
          - PARTNER
          - TECHNICAL
        metric:
          oneOf:
          - type: string
            enum:
            - CAPACITY
            - PERSONNEL
            - EQUIPMENT
            - AREA
            - TIME_WINDOW
            - PARTNER
          - type: 'null'
        text:
          type: string
          description: Normtext auf Deutsch.
        texts:
          type: object
          additionalProperties:
            type: string
          description: Texte weiterer Sprachen (Schlüssel = Sprachcode).
        primary_count:
          type: integer
          minimum: 0
          description: Ablehnungen mit diesem Primärgrund.
        secondary_count:
          type: integer
          minimum: 0
          description: Nennungen als zusätzliches Label; keine zusätzlichen Ablehnungen.
      required:
      - code
      - group
      - metric
      - text
      - texts
      - primary_count
      - secondary_count
    RejectionBreakdown:
      type: object
      additionalProperties: false
      properties:
        attempts:
          type:
          - integer
          - 'null'
          minimum: 0
        rejections:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Summe der Primärgründe = Zahl der abgelehnten Versuche.
        technical_errors:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Technische Anfragefehler, getrennt von den fachlichen Ablehnungen.
        state:
          type: string
          enum:
          - OK
          - PROVISIONAL
          - NOT_COMPUTABLE
        suppressed:
          type: boolean
          description: Kleine Gruppe unter `kpi_aggregation_min_n` (WP-M4-58), die Zahlen sind `null`, nie 0.
        coverage:
          oneOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        as_of:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        source_events:
          type:
          - integer
          - 'null'
          minimum: 0
        reason_code:
          oneOf:
          - type: string
          - type: 'null'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RejectionRow'
      required:
      - attempts
      - rejections
      - technical_errors
      - state
      - suppressed
      - coverage
      - as_of
      - source_events
      - reason_code
      - rows
    FunnelCounts:
      type: object
      additionalProperties: false
      description: Die vier Zählgrößen des Trichters, getrennt und nie als Summe; jede zählt ihr eigenes Ereignis im Berichtszeitraum.
      properties:
        requests:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Anfragen (Versuche, `attempt_id`; technische Wiederholungen und Testanfragen zählen nicht).
        offers:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Angebote angezeigt (Ereignis `booking.offer_created`, OP 27).
        confirmed_bookings:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Bestätigte Buchungen (Ereignis `booking.confirmed`).
        completed_bookings:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Abgeschlossene Buchungen (Fahrtabschluss/Ausstieg, OP 27); ein späteres Storno ändert sie nicht.
      required:
      - requests
      - offers
      - confirmed_bookings
      - completed_bookings
    FunnelEndStates:
      type: object
      additionalProperties: false
      description: Getrennte Endzustände; eine Buchung zählt je Endzustand genau einmal.
      properties:
        request_rejected:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Anfrage abgelehnt (fachlicher Primärgrund).
        request_technical_error:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Technischer Anfragefehler, keine fachliche Ablehnung.
        offer_not_booked:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Angebot angezeigt, aber nicht gebucht (nur belastbar, wenn `unlinked_bookings` 0 ist).
        payment_failed:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Zahlung fehlgeschlagen (Ereignis `payment.authorization_failed` oder Storno mit Grund `PAYMENT_FAILED`).
        cancelled_by_passenger:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Fahrgaststorno (Verursacher FAHRGAST, Grund `PASSENGER_REQUEST`).
        cancelled_by_operator:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Betreiberstorno (Verursacher BETREIBER).
        cancelled_other:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Sonstige Stornos (Fahrzeugausfall, No-Show), weder Fahrgast- noch Betreiberstorno.
      required:
      - request_rejected
      - request_technical_error
      - offer_not_booked
      - payment_failed
      - cancelled_by_passenger
      - cancelled_by_operator
      - cancelled_other
    FunnelBreakdown:
      type: object
      additionalProperties: false
      properties:
        period:
          $ref: '#/components/schemas/MetricPeriod'
        filter:
          $ref: '#/components/schemas/MetricFilterUsed'
        counts:
          $ref: '#/components/schemas/FunnelCounts'
        end_states:
          $ref: '#/components/schemas/FunnelEndStates'
        unlinked_bookings:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Bestätigte Buchungen ohne Angebotsbezug (`offer_id` fehlt); bei Werten über 0 ist der Zustand `PROVISIONAL`.
        state:
          type: string
          enum:
          - OK
          - PROVISIONAL
          - NOT_COMPUTABLE
        suppressed:
          type: boolean
          description: Kleine Gruppe unter `kpi_aggregation_min_n` (WP-M4-58), alle Zahlen sind `null`, nie 0.
        coverage:
          oneOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        as_of:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        source_events:
          type: integer
          minimum: 0
      required:
      - period
      - filter
      - counts
      - end_states
      - unlinked_bookings
      - suppressed
      - state
      - coverage
      - as_of
      - source_events
    AnalyticsMetrics:
      type: object
      additionalProperties: false
      properties:
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/MetricDefinition'
        values:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/MetricValue'
          - type: 'null'
          description: Nur bei angegebenem Zeitraum.
        rejections:
          oneOf:
          - $ref: '#/components/schemas/RejectionBreakdown'
          - type: 'null'
          description: Nur mit `breakdown=rejection_reason`.
        funnel:
          oneOf:
          - $ref: '#/components/schemas/FunnelBreakdown'
          - type: 'null'
          description: Nur mit `breakdown=funnel`.
        items:
          type: array
          items:
            $ref: '#/components/schemas/MetricValue'
          description: Listenhülle der Plattform (WP-M4-58), dieselben Kennzahlwerte wie `values` (leer ohne Zeitraum).
        next_cursor:
          type: 'null'
          description: Immer `null`, die Menge ist durch das Kennzahlregister begrenzt, es gibt keine Folgeseite.
        as_of:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Ältester Datenstand der ausgewiesenen Werte, ohne Zeitraum `null`.
      required:
      - definitions
      - values
      - rejections
      - funnel
    KmCategories:
      type: object
      additionalProperties: false
      description: Kilometer je Kategorie in Tausendstel Kilometern (Meter, ganzzahlig).
      properties:
        PASSENGER:
          type: integer
          format: int64
          minimum: 0
          description: Fahrgastfahrt (mindestens ein Fahrgast an Bord, von Einstieg bis Ausstieg).
        EMPTY:
          type: integer
          format: int64
          minimum: 0
          description: Leerfahrt im Betriebsdienst mit Fahrtenplan, ohne Fahrgast.
        TRANSFER:
          type: integer
          format: int64
          minimum: 0
          description: Überführung (Schicht mit Überführungsbezug).
        WORKSHOP:
          type: integer
          format: int64
          minimum: 0
          description: Werkstattfahrt (Schicht mit Werkstattbezug).
      required:
      - PASSENGER
      - EMPTY
      - TRANSFER
      - WORKSHOP
    KmDay:
      type: object
      additionalProperties: false
      properties:
        service_day:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Betriebstag (UTC).
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        run_id:
          $ref: common.yaml#/components/schemas/UUID
        as_of:
          type: string
          format: date-time
          description: Datenstand des Klassifikationslaufs.
        total_km_thousandths:
          type: integer
          format: int64
          minimum: 0
        km_thousandths_by_category:
          $ref: '#/components/schemas/KmCategories'
        unassigned_km_thousandths:
          type: integer
          format: int64
          minimum: 0
          description: Nicht zuordenbare Kilometer (Lücke in den Positionsdaten, keine Fahrtenplan- oder Ereignisdeckung).
        events_complete:
          type: boolean
      required:
      - service_day
      - vehicle_id
      - run_id
      - as_of
      - total_km_thousandths
      - km_thousandths_by_category
      - unassigned_km_thousandths
      - events_complete
    KmMetrics:
      type: object
      additionalProperties: false
      properties:
        metric:
          type: string
          enum:
          - VEHICLE_KM_CLASSES
        definition_version:
          type: integer
          minimum: 1
          description: Regelversion der Klassifikation.
        from:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        to:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        vehicle_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        as_of:
          description: Jüngster Datenstand der enthaltenen Läufe; `null` ohne Läufe im Zeitraum.
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        completeness:
          type: string
          enum:
          - COMPLETE
          - INCOMPLETE
        total_km_thousandths:
          type: integer
          format: int64
          minimum: 0
          description: Gesamtkilometer = Summe der vier Kategorien + `unassigned_km_thousandths`.
        km_thousandths_by_category:
          $ref: '#/components/schemas/KmCategories'
        unassigned_km_thousandths:
          type: integer
          format: int64
          minimum: 0
        days:
          type: array
          items:
            $ref: '#/components/schemas/KmDay'
      required:
      - metric
      - definition_version
      - from
      - to
      - vehicle_id
      - as_of
      - completeness
      - total_km_thousandths
      - km_thousandths_by_category
      - unassigned_km_thousandths
      - days
