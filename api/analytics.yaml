paths:
  /v1/analytics/metrics:
    get:
      summary: Kennzahlregister lesen und Kennzahlwerte mit Datenstand abfragen
      operationId: getAnalyticsMetrics
      security:
      - oidc:
        - analytics:read
      description: 'Liefert die freigegebenen Kennzahldefinitionen (stabile ID, Definitionsversion, Zähler, Nenner, Ausschlüsse, Zeitbezug, zulässige Filterdimensionen; WP-M4-46) und, wenn ein Zeitraum (`from`/`to`) angegeben ist, die Werte der Kennzahl(en) mit Definition und Version, Filter, Zähler, Nenner, Datenstand (`as_of`) und Vollständigkeit. Der Zeitraum besteht aus Betriebstagen in der `reporting_timezone` des Mandanten, nie aus festen 24 Stunden. Ein Nullnenner oder fehlende Daten ergeben `NOT_COMPUTABLE` mit Grund (nie 0 oder 100 %), unvollständige Quellen `PROVISIONAL` mit Abdeckungsgrad, kleine Gruppen `SUPPRESSED` (auch per Differenzbildung benachbarter Filter nicht ableitbar). Identische Abfragen liefern für alle berechtigten Benutzer des Mandanten identische Werte und denselben Datenstand. Mit `breakdown=rejection_reason` zusätzlich die Ablehnungen nach Grund und Gruppe (Spalte „Ablehnungsgrund“: Primärgründe zählen Ablehnungen, Sekundärgründe nur als Label, technische Fehler getrennt; `reason_code` begrenzt auf einen Katalogcode). Unbekannte Kennzahl oder Version: 404; nicht zulässige Filterdimension, unbekannter Ablehnungscode oder unvollständige Parameter: 400. Jede Auswertung wird als Snapshot mit Definitionsversion festgehalten.'
      parameters:
      - name: metric_id
        in: query
        required: false
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        description: Stabile technische Kennzahl-ID; ohne Angabe alle Kennzahlen.
      - name: version
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Definitionsversion (nur zusammen mit `metric_id`); ohne Angabe die jüngste freigegebene Version.
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Erster Betriebstag (lokales Datum in der `reporting_timezone`). Ohne Zeitraum werden nur Definitionen geliefert.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Letzter Betriebstag einschließlich; Standard `from`.
      - name: service_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Filterdimension Dienst (nur für Kennzahlen, deren Definition sie zulässt).
      - name: channel
        in: query
        required: false
        schema:
          type: string
          enum:
          - WEB
          - APP
          - API
        description: Filterdimension Kanal (nur für Kennzahlen, deren Definition sie zulässt).
      - name: breakdown
        in: query
        required: false
        schema:
          type: string
          enum:
          - rejection_reason
        description: Zusätzlich die Ablehnungsstatistik nach Grund (erfordert `from`).
      - name: reason_code
        in: query
        required: false
        schema:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
        description: 'Nur mit `breakdown=rejection_reason`, Katalogcode; ein unbekannter Code ist 400.'
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Definitionen und, bei angegebenem Zeitraum, Werte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsMetrics'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/analytics/vehicle-km:
    get:
      summary: Kennzahlen-Datenbasis lesen (Fahrzeugkilometer je Kategorie)
      operationId: getVehicleKmClasses
      security:
      - oidc:
        - analytics:read
      description: 'WP-M4-42 (FCO-005, Kap. 05 §5.7): Fahrzeugkilometer je Kategorie (`PASSENGER`, `EMPTY`, `TRANSFER`, `WORKSHOP`) und **separat** die nicht zuordenbaren Kilometer (`unassigned_km_thousandths`, der Rest zur Gesamtstrecke, nie auf andere Kategorien verteilt). Es gilt `total_km_thousandths` = Summe der vier Kategorien + `unassigned_km_thousandths` (ganzzahlig in Tausendstel Kilometern, also Metern). Je Fahrzeug und Betriebstag (UTC) zählt der jüngste Klassifikationslauf; `as_of` ist dessen Datenstand, `completeness` ist `INCOMPLETE`, solange die Fahrerereignisse eines Laufs unvollständig sind (Revisionslücke, Einstieg ohne Ausstieg). `definition_version` ist die Regelversion der Klassifikation (Vorschlag, in WP-M4-01 freizugeben, OP-22). Ohne `vehicle_id` über alle Fahrzeuge des Mandanten; ein Zeitraum ohne Fahrten liefert eine leere Auswertung (200, `days` leer). **`metric`, `from` und `to` sind Pflicht** (422 ohne), höchstens 366 Tage, `to` nicht vor `from`; fremdes oder unbekanntes Fahrzeug 404. Keine Fahrerbezüge.'
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - name: metric
        in: query
        required: false
        schema:
          type: string
          enum:
          - VEHICLE_KM_CLASSES
        description: Kennzahl, **Pflicht**; in P1 nur `VEHICLE_KM_CLASSES` (Datenbasis für `Leerkilometerquote` und `Produktive Kilometer`, Formeln in WP-M4-56).
      - name: from
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
        description: Erster Betriebstag (inklusive, `JJJJ-MM-TT`, UTC-Tag), **Pflicht**.
      - name: to
        in: query
        required: false
        schema:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
        description: Letzter Betriebstag (inklusive), **Pflicht**.
      - name: vehicle_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Auf ein Fahrzeug des Mandanten einschränken.
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KmMetrics'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    MetricDefinition:
      type: object
      additionalProperties: false
      description: Freigegebene Kennzahldefinition in einer Version; nach der Freigabe unveränderlich, eine Änderung ist eine neue Version.
      properties:
        metric_id:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,63}$
        version:
          type: integer
          minimum: 1
        name:
          type: string
        value_kind:
          type: string
          enum:
          - COUNT
          - RATIO
          - MEAN
          - SUM
        unit:
          type: string
        numerator:
          type: string
          description: Definition des Zählers.
        denominator:
          type: string
          description: Definition des Nenners (bei Absolutzahlen "Keiner").
        exclusions:
          type: string
        time_basis:
          type: string
          description: Zeitbezug (Zeitpunkt, nach dem der Berichtszeitraum bestimmt wird).
        period_basis:
          type: string
          enum:
          - BUSINESS_DAY_LOCAL
          - INSTANT
        filter_dimensions:
          type: array
          items:
            type: string
            enum:
            - service_id
            - channel
        executable:
          type: boolean
          description: In diesem Stand berechenbar.
        not_executable_reason:
          oneOf:
          - type: string
            enum:
            - NOT_EXECUTABLE_IN_THIS_RELEASE
            - NO_PARTNERS_IN_P1
          - type: 'null'
      required:
      - metric_id
      - version
      - name
      - value_kind
      - unit
      - numerator
      - denominator
      - exclusions
      - time_basis
      - period_basis
      - filter_dimensions
      - executable
      - not_executable_reason
    MetricFilterUsed:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        channel:
          type: string
          enum:
          - WEB
          - APP
          - API
    MetricPeriod:
      type: object
      additionalProperties: false
      description: Berichtszeitraum aus Betriebstagen der `reporting_timezone`; `from_instant` inklusiv und `to_instant` exklusiv als absolute Zeitpunkte.
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        timezone:
          type: string
        from_instant:
          type: string
          format: date-time
        to_instant:
          type: string
          format: date-time
      required:
      - from
      - to
      - timezone
      - from_instant
      - to_instant
    MetricValue:
      type: object
      additionalProperties: false
      properties:
        metric_id:
          type: string
        definition_version:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - OK
          - PROVISIONAL
          - NOT_COMPUTABLE
          - SUPPRESSED
        reason:
          oneOf:
          - type: string
            enum:
            - ZERO_DENOMINATOR
            - MISSING_DENOMINATOR
            - NO_DATA
            - NOT_EXECUTABLE_IN_THIS_RELEASE
            - NO_PARTNERS_IN_P1
            - SMALL_GROUP
          - type: 'null'
        value:
          oneOf:
          - type: number
          - type: 'null'
          description: Wert; `null` bei `NOT_COMPUTABLE` und `SUPPRESSED`, nie ersatzweise 0 oder 100 %.
        numerator:
          oneOf:
          - type: number
          - type: 'null'
        denominator:
          oneOf:
          - type: number
          - type: 'null'
        coverage:
          oneOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
          description: Abdeckungsgrad der Quelle (1 = vollständig); bei `PROVISIONAL` kleiner 1.
        unit:
          type: string
        filter:
          $ref: '#/components/schemas/MetricFilterUsed'
        period:
          $ref: '#/components/schemas/MetricPeriod'
        as_of:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Datenstand der Quelle (jüngste Ereigniszeit der verarbeiteten Ereignisse), aus demselben Lesestand wie der Wert.
        source_events:
          type: integer
          minimum: 0
        snapshot_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
      required:
      - metric_id
      - definition_version
      - state
      - reason
      - value
      - numerator
      - denominator
      - coverage
      - unit
      - filter
      - period
      - as_of
      - source_events
      - snapshot_id
    RejectionRow:
      type: object
      additionalProperties: false
      description: Eine Zeile der Spalte „Ablehnungsgrund“.
      properties:
        code:
          type: string
        group:
          type: string
          enum:
          - CAPACITY
          - PERSONNEL
          - EQUIPMENT
          - AREA
          - TIME_OPENING
          - TIME_DEADLINE
          - RULE
          - TARIFF
          - LIMIT
          - PARTNER
          - TECHNICAL
        metric:
          oneOf:
          - type: string
            enum:
            - CAPACITY
            - PERSONNEL
            - EQUIPMENT
            - AREA
            - TIME_WINDOW
            - PARTNER
          - type: 'null'
        text:
          type: string
          description: Normtext auf Deutsch.
        texts:
          type: object
          additionalProperties:
            type: string
          description: Texte weiterer Sprachen (Schlüssel = Sprachcode).
        primary_count:
          type: integer
          minimum: 0
          description: Ablehnungen mit diesem Primärgrund.
        secondary_count:
          type: integer
          minimum: 0
          description: Nennungen als zusätzliches Label; keine zusätzlichen Ablehnungen.
      required:
      - code
      - group
      - metric
      - text
      - texts
      - primary_count
      - secondary_count
    RejectionBreakdown:
      type: object
      additionalProperties: false
      properties:
        attempts:
          type: integer
          minimum: 0
        rejections:
          type: integer
          minimum: 0
          description: Summe der Primärgründe = Zahl der abgelehnten Versuche.
        technical_errors:
          type: integer
          minimum: 0
          description: Technische Anfragefehler, getrennt von den fachlichen Ablehnungen.
        state:
          type: string
          enum:
          - OK
          - PROVISIONAL
          - NOT_COMPUTABLE
        coverage:
          oneOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
        as_of:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        source_events:
          type: integer
          minimum: 0
        reason_code:
          oneOf:
          - type: string
          - type: 'null'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RejectionRow'
      required:
      - attempts
      - rejections
      - technical_errors
      - state
      - coverage
      - as_of
      - source_events
      - reason_code
      - rows
    AnalyticsMetrics:
      type: object
      additionalProperties: false
      properties:
        definitions:
          type: array
          items:
            $ref: '#/components/schemas/MetricDefinition'
        values:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/MetricValue'
          - type: 'null'
          description: Nur bei angegebenem Zeitraum.
        rejections:
          oneOf:
          - $ref: '#/components/schemas/RejectionBreakdown'
          - type: 'null'
          description: Nur mit `breakdown=rejection_reason`.
      required:
      - definitions
      - values
      - rejections
    KmCategories:
      type: object
      additionalProperties: false
      description: Kilometer je Kategorie in Tausendstel Kilometern (Meter, ganzzahlig).
      properties:
        PASSENGER:
          type: integer
          format: int64
          minimum: 0
          description: Fahrgastfahrt (mindestens ein Fahrgast an Bord, von Einstieg bis Ausstieg).
        EMPTY:
          type: integer
          format: int64
          minimum: 0
          description: Leerfahrt im Betriebsdienst mit Fahrtenplan, ohne Fahrgast.
        TRANSFER:
          type: integer
          format: int64
          minimum: 0
          description: Überführung (Schicht mit Überführungsbezug).
        WORKSHOP:
          type: integer
          format: int64
          minimum: 0
          description: Werkstattfahrt (Schicht mit Werkstattbezug).
      required:
      - PASSENGER
      - EMPTY
      - TRANSFER
      - WORKSHOP
    KmDay:
      type: object
      additionalProperties: false
      properties:
        service_day:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
          description: Betriebstag (UTC).
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        run_id:
          $ref: common.yaml#/components/schemas/UUID
        as_of:
          type: string
          format: date-time
          description: Datenstand des Klassifikationslaufs.
        total_km_thousandths:
          type: integer
          format: int64
          minimum: 0
        km_thousandths_by_category:
          $ref: '#/components/schemas/KmCategories'
        unassigned_km_thousandths:
          type: integer
          format: int64
          minimum: 0
          description: Nicht zuordenbare Kilometer (Lücke in den Positionsdaten, keine Fahrtenplan- oder Ereignisdeckung).
        events_complete:
          type: boolean
      required:
      - service_day
      - vehicle_id
      - run_id
      - as_of
      - total_km_thousandths
      - km_thousandths_by_category
      - unassigned_km_thousandths
      - events_complete
    KmMetrics:
      type: object
      additionalProperties: false
      properties:
        metric:
          type: string
          enum:
          - VEHICLE_KM_CLASSES
        definition_version:
          type: integer
          minimum: 1
          description: Regelversion der Klassifikation.
        from:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        to:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        vehicle_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        as_of:
          description: Jüngster Datenstand der enthaltenen Läufe; `null` ohne Läufe im Zeitraum.
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        completeness:
          type: string
          enum:
          - COMPLETE
          - INCOMPLETE
        total_km_thousandths:
          type: integer
          format: int64
          minimum: 0
          description: Gesamtkilometer = Summe der vier Kategorien + `unassigned_km_thousandths`.
        km_thousandths_by_category:
          $ref: '#/components/schemas/KmCategories'
        unassigned_km_thousandths:
          type: integer
          format: int64
          minimum: 0
        days:
          type: array
          items:
            $ref: '#/components/schemas/KmDay'
      required:
      - metric
      - definition_version
      - from
      - to
      - vehicle_id
      - as_of
      - completeness
      - total_km_thousandths
      - km_thousandths_by_category
      - unassigned_km_thousandths
      - days
