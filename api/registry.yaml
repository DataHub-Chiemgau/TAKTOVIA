paths:
  /v1/config/effective:
    get:
      summary: Wirksame Konfiguration lesen
      description: 'Wirksame Konfiguration nach Präzedenzkette (global, Mandant, Region, Dienst, Fahrzeug; die Produktebene folgt mit M2) zum Zeitpunkt
        at (Standard: jetzt) im angegebenen Kontext. Ohne parameter werden alle Parameter des Katalogs aufgelöst. Je Parameter nennt items den Wert,
        die Einheit, die Herkunft (Ebene, Revision, Wirksamkeit), die angewandte Vorrangregel und alle Ebenen in der Reihenfolge der Auswertung. Ein
        Wert, der die globale Sicherheitsgrenze verletzt, wird nie als wirksam geliefert. Der Kontext besteht aus region_id, service_id und
        vehicle_id; mit service_id gilt die Region des Dienstes. Fremde oder unbekannte Kontextobjekte und Dienste außerhalb des Dienstscopes
        sind nicht sichtbar (404).'
      operationId: getEffectiveConfig
      security:
      - oidc:
        - config:read
      parameters:
      - name: at
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: parameter
        in: query
        required: false
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,62}$
        description: Technischer Parametername; ohne Angabe alle Parameter des Katalogs.
      - name: region_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: service_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: vehicle_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveConfig'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/config/parameters:
    get:
      summary: Parameterkatalog lesen
      description: Katalog der aktuell gültigen Schema-Version (policy_schema) für jeden Mandanten lesbar. Der Bereich minimum..maximum ist
        zugleich die Systemgrenze, die keine Mandantenkonfiguration überschreibt; security_class SAFETY_INVARIANT kennzeichnet nicht abschaltbare
        Sicherheitsparameter. Der Katalog ist über die API nicht änderbar (nur per Migration).
      operationId: listConfigParameters
      security:
      - oidc:
        - config:read
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigParameterCatalog'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/config/revisions:
    get:
      summary: Konfigurationsrevisionen auflisten
      description: 'Revisionen des Mandanten, nach Anlage sortiert; Filter nach scope_kind, scope_id und state. Mit as_of (zusammen mit scope_kind
        und scope_id) liefert die Liste genau die zum Zeitpunkt wirksame publizierte Revision samt Revisions-ID (Rekonstruktion für einen
        historischen Fall, höchstens ein Eintrag, next_cursor null); ohne wirksame Revision ist die Liste leer. Jede Revision trägt ihr
        Änderungsprotokoll (change_log) mit Benutzer, Zeitpunkt, Grund, Gültigkeitsbeginn und Altwert/Neuwert gegen die Vorgängerrevision.'
      operationId: listConfigRevisions
      security:
      - oidc:
        - config:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      - name: scope_kind
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ConfigScopeKind'
      - name: scope_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ConfigRevisionState'
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Zeitpunkt der Rekonstruktion (RFC 3339 mit Offset); verlangt scope_kind und scope_id.
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigRevisionPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Entwurf einer Konfigurationsrevision anlegen
      operationId: createConfigRevision
      security:
      - oidc:
        - config:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigRevisionCreate'
  /v1/config/revisions/{revision_id}:
    get:
      summary: Konfigurationsrevision lesen
      description: Revision mit Werten und Änderungsprotokoll; der ETag ist die Zeilenversion des Entwurfs (If-Match beim Ändern). Fremder Mandant
        oder unbekannte ID ist 404.
      operationId: getConfigRevision
      security:
      - oidc:
        - config:read
      parameters:
      - $ref: common.yaml#/components/parameters/revision_id
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    patch:
      summary: Entwurf einer Konfigurationsrevision ändern
      description: Ändert Werte, Beginn, Ende oder Grund eines Entwurfs (JSON-Merge auf oberster Ebene; values ersetzt die Werte vollständig).
        Nur Entwürfe sind änderbar; eine publizierte Revision ist unveränderlich (409 IMMUTABLE_RECORD), eine Änderung ist eine neue Revision.
        Veralteter ETag ist 412 REVISION_MISMATCH, fehlender 428.
      operationId: updateConfigRevision
      security:
      - oidc:
        - config:write
      parameters:
      - $ref: common.yaml#/components/parameters/revision_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigRevisionUpdate'
  /v1/config/revisions/{revision_id}/validate:
    post:
      summary: Entwurf gegen das policy_schema und die Systemgrenzen prüfen
      operationId: validateConfigRevision
      security:
      - oidc:
        - config:write
      parameters:
      - $ref: common.yaml#/components/parameters/revision_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigValidationReport'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/config/revisions/{revision_id}/impact:
    post:
      summary: Wirkungsanalyse für eine Revision anfordern
      operationId: requestConfigImpact
      security:
      - oidc:
        - config:write
      parameters:
      - $ref: common.yaml#/components/parameters/revision_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigImpactReport'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    EffectiveConfig:
      type: object
      additionalProperties: false
      properties:
        as_of:
          type: string
          format: date-time
        values:
          type: object
          description: Wirksame Werte je Parameter (nur Parameter mit Wert); Form und Bereiche bestimmt das policy_schema der Schema-Version, die Prüfung
            geschieht serverseitig.
        revision_ids:
          type: array
          items:
            $ref: common.yaml#/components/schemas/UUID
          maxItems: 50
          description: Revisionen, aus denen die wirksamen Werte stammen (ohne Duplikate).
        schema_version:
          type: string
          minLength: 1
          maxLength: 16
          description: Zum Zeitpunkt as_of gültige Schema-Version des Parameterkatalogs.
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/EffectiveParameter'
          description: Je Parameter Wert, Einheit, Herkunft, Vorrangregel und alle Ebenen.
      required:
      - as_of
      - values
      - revision_ids
      description: Wirksame Konfiguration nach Präzedenzkette zum Zeitpunkt as_of.
    ConfigLevel:
      type: string
      enum:
      - GLOBAL
      - TENANT
      - REGION
      - SERVICE
      - VEHICLE
      description: Ebene der Präzedenzkette, aufsteigend nach Spezifität. Die Ebene Produkt folgt mit M2.
    EffectiveParameter:
      type: object
      additionalProperties: false
      properties:
        parameter:
          type: string
          minLength: 1
          maxLength: 64
        unit:
          type: string
          minLength: 1
          maxLength: 32
        status:
          type: string
          enum:
          - EFFECTIVE
          - NO_VALUE
          description: NO_VALUE, wenn zum Zeitpunkt weder eine wirksame Revision noch eine globale Vorgabe existiert.
        value:
          description: Wirksamer Wert (beliebiger JSON-Wert; null ohne Wert).
        level:
          oneOf:
          - $ref: '#/components/schemas/ConfigLevel'
          - type: 'null'
        revision_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        revision:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
        scope_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        effective_from:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        effective_to:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        schema_version:
          type: string
          minLength: 1
          maxLength: 16
        rule:
          $ref: '#/components/schemas/PrecedenceRule'
        precedence:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/PrecedenceEntry'
          description: Alle Ebenen in der Reihenfolge der Auswertung (spezifischste zuerst, global zuletzt) mit ihrem Schicksal.
      required:
      - parameter
      - unit
      - status
      - value
      - level
      - revision_id
      - revision
      - scope_id
      - effective_from
      - effective_to
      - schema_version
      - rule
      - precedence
    PrecedenceRule:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - MOST_SPECIFIC_LEVEL_WINS
          - SINGLE_LEVEL
          - SAFETY_LIMIT_FALLBACK
          - GLOBAL_DEFAULT
          - NO_VALUE
        description:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - code
      - description
    PrecedenceEntry:
      type: object
      additionalProperties: false
      properties:
        level:
          $ref: '#/components/schemas/ConfigLevel'
        outcome:
          type: string
          enum:
          - APPLIED
          - OVERRIDDEN
          - SKIPPED_LIMIT
          - SKIPPED_NOT_ALLOWED
          - NOT_SET
          - NOT_IN_CONTEXT
          description: APPLIED gilt; OVERRIDDEN wird von einer spezifischeren Ebene überstimmt; SKIPPED_LIMIT verletzt die globale Sicherheitsgrenze;
            SKIPPED_NOT_ALLOWED ist auf der Ebene nicht zulässig bzw. nicht freigegeben; NOT_SET setzt den Parameter nicht; NOT_IN_CONTEXT gehört
            nicht zum Kontext der Anfrage.
        scope_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        value:
          description: Wert dieser Ebene (beliebiger JSON-Wert; null, wenn die Ebene den Parameter nicht setzt).
        revision_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        revision:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
        violation:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
          description: Verletzungscode, wenn der Wert übersprungen wurde.
        proposal:
          oneOf:
          - $ref: '#/components/schemas/EffectiveProposal'
          - type: 'null'
      required:
      - level
      - outcome
      - scope_id
      - value
      - revision_id
      - revision
      - violation
      - proposal
    EffectiveProposal:
      type: object
      additionalProperties: false
      description: Vorgeschlagener, noch nicht publizierter Wert (jüngster Entwurf, geprüfter oder freigegebener Stand dieses Scopes).
      properties:
        revision_id:
          $ref: common.yaml#/components/schemas/UUID
        state:
          $ref: '#/components/schemas/ConfigRevisionState'
        value:
          description: Vorgeschlagener Wert (beliebiger JSON-Wert).
      required:
      - revision_id
      - state
      - value
    ConfigScopeKind:
      type: string
      enum:
      - TENANT
      - REGION
      - DEPOT
      - SERVICE
      - VEHICLE
    ConfigRevisionState:
      type: string
      enum:
      - DRAFT
      - VALIDATED
      - APPROVED
      - PUBLISHED
      - SUPERSEDED
    ConfigChange:
      type: object
      additionalProperties: false
      description: Eine Änderung gegenüber der Vorgängerrevision. pointer ist ein JSON-Pointer in values; old_value und new_value sind beliebige
        JSON-Werte (null bei hinzugefügt bzw. entfernt).
      properties:
        pointer:
          type: string
          minLength: 1
          maxLength: 512
        kind:
          type: string
          enum:
          - ADDED
          - CHANGED
          - REMOVED
        old_value:
          description: Altwert (beliebiger JSON-Wert; null, wenn hinzugefügt).
        new_value:
          description: Neuwert (beliebiger JSON-Wert; null, wenn entfernt).
      required:
      - pointer
      - kind
    ConfigChangeLog:
      type: object
      additionalProperties: false
      description: Änderungsprotokoll der Revision (LH-I.7-CFG-003) mit Benutzer, Zeitpunkt, Grund, Gültigkeitsbeginn und Diff Altwert/Neuwert gegen
        die Vorgängerrevision (höchste publizierte Revision desselben Scopes mit kleinerer Nummer).
      properties:
        changed_by:
          type: string
          minLength: 1
          maxLength: 200
        changed_at:
          type: string
          format: date-time
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        effective_from:
          type: string
          format: date-time
        effective_to:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        predecessor_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        predecessor_revision:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
        changes:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ConfigChange'
      required:
      - changed_by
      - changed_at
      - reason
      - effective_from
      - effective_to
      - predecessor_id
      - predecessor_revision
      - changes
    ConfigParameter:
      type: object
      additionalProperties: false
      description: Ein Parameter des Katalogs (policy_schema) mit Systemgrenzen.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 63
        type:
          type: string
          enum:
          - integer
          - number
          - boolean
          - string
          - object
        unit:
          type: string
          minLength: 1
          maxLength: 40
        minimum:
          oneOf:
          - type: number
          - type: 'null'
        maximum:
          oneOf:
          - type: number
          - type: 'null'
        default:
          description: Vorgabewert oder null, solange kein Zielwert freigegeben ist (D-05).
        allowed_levels:
          type: array
          maxItems: 4
          items:
            $ref: '#/components/schemas/ConfigScopeKind'
        security_class:
          type: string
          enum:
          - STANDARD
          - SAFETY_INVARIANT
        limit_source:
          type: string
          enum:
          - KATALOG
          - PLANUNGSANNAHME
        description:
          type: string
          minLength: 1
          maxLength: 1000
        schema:
          type: object
          description: Das vollständige JSON-Schema (Draft 2020-12) des Parameters.
      required:
      - name
      - type
      - unit
      - minimum
      - maximum
      - allowed_levels
      - security_class
      - limit_source
      - description
      - schema
    ConfigParameterCatalog:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          type: string
          minLength: 1
          maxLength: 40
        valid_from:
          type: string
          format: date-time
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/ConfigParameter'
      required:
      - schema_version
      - valid_from
      - items
    ConfigRevisionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Änderung eines Entwurfs; nicht gesendete Felder bleiben unverändert, values ersetzt die Werte vollständig, effective_to null löscht das Ende.
      properties:
        values:
          type: object
          description: Konfigurationswerte; Form und Bereiche bestimmt das policy_schema der gültigen Schema-Version.
        effective_from:
          $ref: common.yaml#/components/schemas/Timestamp
        effective_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
        reason:
          type: string
          minLength: 3
          maxLength: 1000
    ConfigRevision:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        scope_kind:
          type: string
          enum:
          - TENANT
          - REGION
          - DEPOT
          - SERVICE
          - VEHICLE
        scope_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        state:
          type: string
          enum:
          - DRAFT
          - VALIDATED
          - APPROVED
          - PUBLISHED
          - SUPERSEDED
        schema_version:
          type: string
          minLength: 1
          maxLength: 40
        values:
          type: object
          description: Konfigurationswerte; Form und Bereiche bestimmt das policy_schema der Schema-Version, die Prüfung geschieht
            serverseitig.
        effective_from:
          type: string
          format: date-time
        effective_to:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        created_by:
          type: string
          minLength: 1
          maxLength: 200
        approved_by:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: Änderungsgrund; immer vorhanden.
        created_at:
          type: string
          format: date-time
          description: Zeitpunkt der Änderung (Anlage der Revision); immer vorhanden.
        published_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        change_log:
          $ref: '#/components/schemas/ConfigChangeLog'
      required:
      - id
      - scope_kind
      - scope_id
      - revision
      - state
      - schema_version
      - values
      - effective_from
      - effective_to
      - created_by
      - approved_by
    ConfigRevisionCreate:
      type: object
      additionalProperties: false
      properties:
        scope_kind:
          type: string
          enum:
          - TENANT
          - REGION
          - DEPOT
          - SERVICE
          - VEHICLE
        scope_id:
          $ref: common.yaml#/components/schemas/UUID
        schema_version:
          type: string
          minLength: 1
          maxLength: 40
        values:
          type: object
          description: Konfigurationswerte; Form und Bereiche bestimmt das policy_schema der Schema-Version, die Prüfung geschieht
            serverseitig.
        effective_from:
          $ref: common.yaml#/components/schemas/Timestamp
        effective_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: Änderungsgrund; Pflichtfeld (fehlt er, 422 mit Feldverletzung REQUIRED). Im Schema nicht als required geführt, damit die
            Erweiterung gegenüber dem Ausgangsstand kompatibel bleibt. Der Ersteller wird nie aus der Anfrage übernommen, sondern aus dem Principal.
      required:
      - scope_kind
      - scope_id
      - schema_version
      - values
      - effective_from
      examples:
      - scope_kind: TENANT
        scope_id: 00000000-0000-4000-8000-000000000001
        schema_version: '1'
        values:
          max_wait_min: 20
        effective_from: '2026-12-01T00:00:00Z'
        reason: Wartezeit für den Winterfahrplan angepasst
    ConfigValidationReport:
      type: object
      additionalProperties: false
      properties:
        revision_id:
          $ref: common.yaml#/components/schemas/UUID
        valid:
          type: boolean
        violations:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              pointer:
                type: string
                minLength: 1
                maxLength: 256
              code:
                type: string
                minLength: 1
                maxLength: 256
              message:
                type: string
                minLength: 1
                maxLength: 256
            required:
            - pointer
            - code
            - message
          maxItems: 500
      required:
      - revision_id
      - valid
      - violations
    ConfigImpactReport:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        revision_id:
          $ref: common.yaml#/components/schemas/UUID
        generated_at:
          type: string
          format: date-time
        affected:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                minLength: 1
                maxLength: 64
              count:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
            required:
            - kind
            - count
          maxItems: 100
      required:
      - id
      - revision_id
      - generated_at
      - affected
    ConfigRevisionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConfigRevision'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
