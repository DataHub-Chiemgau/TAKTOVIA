      - oidc:
        - platform:tenants:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantStatusChanged'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantStatusChange'
components:
  schemas:
    Me:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        issuer:
          type: string
          minLength: 1
          maxLength: 512
        tenant_id:
          $ref: common.yaml#/components/schemas/UUID
        tenant_name:
          type: string
          minLength: 1
          maxLength: 200
        roles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 50
        service_scope:
          oneOf:
          - type: array
            items:
              $ref: common.yaml#/components/schemas/UUID
            maxItems: 500
          - type: 'null'
        session_id:
          $ref: common.yaml#/components/schemas/UUID
        mfa:
          type: boolean
        tenants:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              tenant_id:
                $ref: common.yaml#/components/schemas/UUID
              name:
                type: string
                minLength: 1
                maxLength: 200
            required:
            - tenant_id
            - name
          maxItems: 100
        scopes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 200
          description: Wirksame Funktionsscopes des aktiven Mandanten, abgeleitet aus den Rollen der Mitgliedschaft über die Rechtematrix. Nur
            zur Anzeige (Navigation); die Prüfung erfolgt serverseitig bei jeder Anfrage.
        context_token:
          type: string
          minLength: 1
          maxLength: 400
          description: 'Nur in der Antwort des Tenantwechsels: serverseitig signierte Kontextbindung (Mandant und optional Dienst, an Konto und
            Sitzung gebunden). Der Client sendet sie als Header X-Taktovia-Context, je Tab/Client ein eigener Wert. Sie verleiht keine Rechte; die
            Mitgliedschaft wird bei jeder Anfrage erneut geprüft.'
        context_expires_at:
          type: string
          format: date-time
          description: Ablauf von context_token.
      required:
      - subject
      - issuer
      - tenant_id
      - tenant_name
      - roles
      - service_scope
      - session_id
      - mfa
      - tenants
      description: Serverseitig aufgelöster Sitzungskontext. Mandant, Rollen und Dienstumfang stammen aus der geprüften Mitgliedschaft,
        nie aus Request-Feldern.
      examples:
      - subject: user-4711
        issuer: https://identity.taktovia.example/realms/taktovia
        tenant_id: 00000000-0000-4000-8000-000000000001
        tenant_name: Stadtwerke Beispiel
        roles:
        - dispatcher
        service_scope: null
        session_id: 00000000-0000-4000-8000-000000000002
        mfa: true
        tenants:
        - tenant_id: 00000000-0000-4000-8000-000000000001
          name: Stadtwerke Beispiel
    TenantSwitchRequest:
      type: object
      additionalProperties: false
      properties:
        tenant_id:
          $ref: common.yaml#/components/schemas/UUID
        service_id:
          $ref: common.yaml#/components/schemas/UUID
      required:
      - tenant_id
      description: Wechsel in einen Mandanten, in dem eine aktuelle Mitgliedschaft besteht, optional mit einem für diese Mitgliedschaft freigegebenen
        Dienst (service_scope); sonst einheitlich 403. tenant_id ist die gewünschte Auswahl, kein Nachweis.
      examples:
      - tenant_id: 00000000-0000-4000-8000-000000000001
    Membership:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        issuer:
          type: string
          minLength: 1
          maxLength: 512
        subject:
          type: string
          minLength: 1
          maxLength: 200
        role_code:
          type: string
          minLength: 1
          maxLength: 64
        service_scope:
          oneOf:
          - type: array
            items:
              $ref: common.yaml#/components/schemas/UUID
            maxItems: 500
          - type: 'null'
        valid_from:
          type: string
          format: date-time
          description: Beginn der Gültigkeit (zeitlich begrenzte Mitgliedschaft, OP-04).
        valid_to:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Ende der Gültigkeit; null = unbefristet.
        revoked_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - issuer
      - subject
      - role_code
      - service_scope
      - revoked_at
      - revision
    MembershipCreate:
      type: object
      additionalProperties: false
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 512
        subject:
          type: string
          minLength: 1
          maxLength: 200
        role_code:
          type: string
          minLength: 2
          maxLength: 64
          enum:
          - passenger
          - driver
          - callcenter
          - support
          - dispatcher
          - planner
          - tenant_admin
          - finance
          - staff_planning
          - workshop
          description: Rollencode des Rollenkatalogs (WP-M1-07, IAM-004); die Pflichtrollen sind Fahrgast, Fahrer, Callcenter, Support, Disponent, Verkehrsplaner
            und Administrator, finance, staff_planning und workshop sind Platzhalter für M3/M4 (OP-10).
        service_scope:
          oneOf:
          - type: array
            items:
              $ref: common.yaml#/components/schemas/UUID
            maxItems: 500
          - type: 'null'
        valid_from:
          type: string
          format: date-time
          description: Beginn der Gültigkeit; Standard jetzt.
        valid_to:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Ende der Gültigkeit; null oder fehlend = unbefristet. Muss nach valid_from liegen.
      required:
      - issuer
      - subject
      - role_code
      examples:
      - issuer: https://identity.taktovia.example/realms/taktovia
        subject: user-4712
        role_code: dispatcher
    LegalEntity:
