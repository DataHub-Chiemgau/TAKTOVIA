    OrganizationRole:
      type: string
      enum:
      - PLATFORM_OPERATOR
      - TRANSPORT_COMPANY
      - TASK_AUTHORITY
      - CLIENT
      - BROKER
      - ACTUAL_CARRIER
      description: Vertragliche Rolle einer Organisation (LH-I.4-MUL-003; Werteliste Planungsannahme, OP-05). PLATFORM_OPERATOR = Plattformbetreiber,
        TRANSPORT_COMPANY = Verkehrsunternehmen, TASK_AUTHORITY = Aufgabenträger, CLIENT = Auftraggeber, BROKER = Vermittler, ACTUAL_CARRIER = tatsächlicher
        Beförderer. Getrennte Werte; keine Rolle wird aus einer anderen abgeleitet.
    Organization:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        legal_entity_id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        federation_ref:
          type: string
          minLength: 1
          maxLength: 200
        roles:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationRole'
          minItems: 1
          maxItems: 6
          uniqueItems: true
        roles_valid_from:
          type: string
          format: date-time
        roles_valid_to:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - legal_entity_id
      - name
      - federation_ref
      - roles
      - roles_valid_from
      - roles_valid_to
      - revision
