components:
  schemas:
    Me:
      type: object
      additionalProperties: false
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        issuer:
          type: string
          minLength: 1
          maxLength: 512
        tenant_id:
          $ref: common.yaml#/components/schemas/UUID
        tenant_name:
          type: string
          minLength: 1
          maxLength: 200
        roles:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          maxItems: 50
        service_scope:
          oneOf:
          - type: array
            items:
              $ref: common.yaml#/components/schemas/UUID
            maxItems: 500
          - type: 'null'
        session_id:
          $ref: common.yaml#/components/schemas/UUID
        mfa:
          type: boolean
        tenants:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              tenant_id:
                $ref: common.yaml#/components/schemas/UUID
              name:
                type: string
                minLength: 1
                maxLength: 200
            required:
            - tenant_id
            - name
          maxItems: 100
      required:
      - subject
      - issuer
      - tenant_id
      - tenant_name
      - roles
      - service_scope
      - session_id
      - mfa
      - tenants
      description: Serverseitig aufgelöster Sitzungskontext. Mandant, Rollen und Dienstumfang stammen aus der geprüften Mitgliedschaft,
        nie aus Request-Feldern.
      examples:
      - subject: user-4711
        issuer: https://identity.taktovia.example/realms/taktovia
        tenant_id: 00000000-0000-4000-8000-000000000001
        tenant_name: Stadtwerke Beispiel
        roles:
        - DISPATCHER
        service_scope: null
        session_id: 00000000-0000-4000-8000-000000000002
        mfa: true
        tenants:
        - tenant_id: 00000000-0000-4000-8000-000000000001
          name: Stadtwerke Beispiel
    TenantSwitchRequest:
      type: object
      additionalProperties: false
      properties:
        tenant_id:
          $ref: common.yaml#/components/schemas/UUID
      required:
      - tenant_id
      description: Wechsel in einen Mandanten, in dem eine gültige Mitgliedschaft besteht; sonst 404.
      examples:
      - tenant_id: 00000000-0000-4000-8000-000000000001
    Membership:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        issuer:
          type: string
          minLength: 1
          maxLength: 512
        subject:
          type: string
          minLength: 1
          maxLength: 200
        role_code:
          type: string
          minLength: 1
          maxLength: 64
        service_scope:
          oneOf:
          - type: array
            items:
              $ref: common.yaml#/components/schemas/UUID
            maxItems: 500
          - type: 'null'
        revoked_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - issuer
      - subject
      - role_code
      - service_scope
      - revoked_at
      - revision
    MembershipCreate:
      type: object
      additionalProperties: false
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 512
        subject:
          type: string
          minLength: 1
          maxLength: 200
        role_code:
          type: string
          minLength: 1
          maxLength: 64
        service_scope:
          oneOf:
          - type: array
            items:
              $ref: common.yaml#/components/schemas/UUID
            maxItems: 500
          - type: 'null'
      required:
      - issuer
      - subject
      - role_code
      examples:
      - issuer: https://identity.taktovia.example/realms/taktovia
        subject: user-4712
        role_code: DISPATCHER
    LegalEntity:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          pattern: ^[A-Z]{2}$
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - name
      - country
      - revision
    LegalEntityCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          pattern: ^[A-Z]{2}$
        tax_reference_token:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
      - country
      examples:
      - name: Stadtwerke Beispiel GmbH
        country: DE
    LegalEntityUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        country:
          type: string
          pattern: ^[A-Z]{2}$
      required:
      - name
      - country
      examples:
      - name: Stadtwerke Beispiel AG
        country: DE
    Region:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - name
      - revision
    RegionCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - name
      examples:
      - name: Region Nord
    Depot:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        region_id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - region_id
      - name
