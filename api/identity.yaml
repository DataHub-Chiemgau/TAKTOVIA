      additionalProperties: false
      properties:
        legal_entity_id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        federation_ref:
          type: string
          minLength: 1
          maxLength: 200
          description: Schlüssel der Organisation gegenüber Partnern; im Mandanten eindeutig (409), nach dem Anlegen unveränderlich.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationRole'
          minItems: 1
          maxItems: 6
          uniqueItems: true
        roles_valid_from:
          type: string
          format: date-time
          description: Beginn der Gültigkeit der Rollenmenge; Standard jetzt.
        roles_valid_to:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Ende der Gültigkeit (exklusiv); null oder fehlend = unbefristet.
      required:
      - legal_entity_id
      - name
      - federation_ref
      - roles
      examples:
      - legal_entity_id: 00000000-0000-4000-8000-000000000010
        name: Verkehrsbetriebe Beispiel
        federation_ref: fed-vb-beispiel
        roles:
        - TRANSPORT_COMPANY
        - ACTUAL_CARRIER
    OrganizationUpdate:
      type: object
      additionalProperties: false
      properties:
        legal_entity_id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        roles:
          type: array
          items:
