      - as_of
    TenantCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        legal_entity:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 200
            country:
              type: string
              pattern: ^[A-Z]{2}$
            tax_reference_token:
              type: string
              minLength: 1
              maxLength: 200
          required:
          - name
          - country
        first_admin:
          type: object
          additionalProperties: false
          properties:
            issuer:
              type: string
              minLength: 1
              maxLength: 512
            subject:
              type: string
              minLength: 1
              maxLength: 200
          required:
          - issuer
          - subject
        contact_email:
          type: string
          minLength: 3
          maxLength: 254
          description: Pflichtfeld des Unternehmensprofils (PA-11); die Anlage legt die erste Profilrevision an.
        default_currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: Standardwährung aus dem Währungskatalog; Standard EUR.
      required:
      - name
      - legal_entity
      - first_admin
      - contact_email
      description: Mandantenanlage durch die Plattformbetreiberrolle (OP-36, Planungsannahme). Legt Mandant, Rechtsträger, erste Administrator-Mitgliedschaft
        und die erste Profilrevision in einer Transaktion an. Die Plattformbetreiberrolle erhält dadurch keine Fachdatensicht.
      examples:
      - name: Stadtwerke Beispiel
        legal_entity:
          name: Stadtwerke Beispiel GmbH
          country: DE
        first_admin:
          issuer: https://identity.taktovia.example/realms/taktovia
          subject: user-4711
        contact_email: info@example.org
    TenantCreated:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        status:
          $ref: '#/components/schemas/TenantStatus'
        legal_entity_id:
          $ref: common.yaml#/components/schemas/UUID
        admin_membership_id:
          $ref: common.yaml#/components/schemas/UUID
      required:
      - id
      - name
      - status
      - legal_entity_id
      - admin_membership_id
    TenantStatus:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
      - CLOSED
    TenantStatusChange:
      type: object
      additionalProperties: false
      properties:
        managed_tenant_id:
          $ref: common.yaml#/components/schemas/UUID
        status:
          $ref: '#/components/schemas/TenantStatus'
      required:
      - managed_tenant_id
      - status
      description: Statuswechsel nach dem Automaten Mandant (ACTIVE und SUSPENDED wechselseitig, beide nach CLOSED, CLOSED endgültig); unzulässig ergibt 409.
        In SUSPENDED und CLOSED schlägt jeder Fachzugriff des Mandanten fehl.
      examples:
      - managed_tenant_id: 00000000-0000-4000-8000-000000000001
        status: SUSPENDED
    TenantStatusChanged:
      type: object
      additionalProperties: false
      properties:
        managed_tenant_id:
          $ref: common.yaml#/components/schemas/UUID
        from:
          $ref: '#/components/schemas/TenantStatus'
        status:
          $ref: '#/components/schemas/TenantStatus'
      required:
      - managed_tenant_id
      - from
      - status
