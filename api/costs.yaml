      - cost_behavior
      - attribution
      - reason
    CostEventReclassification:
      type: object
      additionalProperties: false
      properties:
        reversal:
          $ref: finance.yaml#/components/schemas/CostEvent
        rebooking:
          $ref: finance.yaml#/components/schemas/CostEvent
        reversal_journal_id:
          $ref: common.yaml#/components/schemas/UUID
        rebooking_journal_id:
          $ref: common.yaml#/components/schemas/UUID
        period_id:
          $ref: common.yaml#/components/schemas/UUID
        accounting_date:
          type: string
          format: date
      required:
      - reversal
      - rebooking
      - reversal_journal_id
      - rebooking_journal_id
      - period_id
      - accounting_date
    VehicleCostItem:
      type: object
      additionalProperties: false
      properties:
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
        category:
