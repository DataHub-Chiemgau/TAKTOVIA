        cost_group:
          oneOf:
          - type: string
            enum:
            - ACQUISITION_LEASE
            - INSURANCE
            - VEHICLE_TAX
            - ENERGY
            - MAINTENANCE
            - REPAIR
          - type: 'null'
        label:
          oneOf:
          - type: string
          - type: 'null'
        amount_minor:
          type: integer
          format: int64
        event_count:
          type: integer
          format: int64
        by_service_period_events:
          type: integer
          format: int64
        by_accounting_date_events:
          type: integer
          format: int64
      required:
      - month
      - category
      - cost_group
      - label
      - amount_minor
      - event_count
      - by_service_period_events
      - by_accounting_date_events
    VehicleTotalCost:
      type: object
      additionalProperties: false
      description: Fahrzeugkosten je Monat und Kostenart (WP-M4-40); `assignment_rule` nennt die Monatszuordnung.
      properties:
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        valuation:
          type: string
          enum:
          - ACTUAL
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        month_from:
          type: string
        month_to:
          type: string
        assignment_rule:
          type: string
        as_of:
          type: string
          format: date-time
        total_minor:
          type: integer
          format: int64
        items:
          type: array
          items:
