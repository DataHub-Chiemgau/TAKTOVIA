paths:
  /v1/payments/provider-events/{provider}:
    post:
      summary: Signierte PSP-Benachrichtigung zustellen
      operationId: receiveProviderEvent
      description: 'Eigene PSP-Signatur (nicht der Partner-HMAC, Kap. 05 §5.7): `X-Provider-Signature: t=<Unix-Sekunden>,v1=<hex HMAC-SHA256(secret,
        t + "." + roher Body)>`. Zeitfenster ±300 s, konstantzeitlicher Vergleich, Inbox-Deduplikation je (provider, event_id) mit Payloadhash;
        identisches Duplikat 200 `ALREADY_RECEIVED`, gleiche ID mit anderem Payload 409. Kein Idempotency-Key: die Inbox dedupliziert.
        Ein PSP-Ereignis löst Zahlungsübergänge nur nach Statusprüfung aus (Leitlinie 6).'
      security:
      - providerSignature: []
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_-]+$
        description: Provider-Kennung des Zahlungsdienstleisters.
      - name: X-Provider-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
        description: Unix-Sekunden, Teil der signierten Nachricht.
      - $ref: common.yaml#/components/parameters/Traceparent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderEvent'
      responses:
        '202':
          description: Neu in dauerhafte Inbox aufgenommen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderEventReceipt'
        '200':
          description: Identisches Ereignis bereits gespeichert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderEventReceipt'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '413':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/bookings/{booking_id}/payment:
    post:
      summary: Zahlungsmittel für die Buchung wählen und Zahlung beginnen
      operationId: startBookingPayment
      description: 'Zahlungsauswahl im Checkout (WP-M2-30, LH-6.10-PAY-004). Autorisiert wird **exakt** der Preis der Quote der Buchung (`pay_at_platform_minor`); ein abweichender
        Betrag ist 409 `REQUOTE_REQUIRED`. Die Buchung muss `CONFIRMING` sein und die Zahlungsfrist (Hold-Dauer) darf nicht abgelaufen sein (409 `HOLD_EXPIRED`); für eine
        Buchung gibt es höchstens eine wirksame Zahlung (eine Wiederholung liefert die laufende Operation). 202: die Autorisierung läuft als Operation (`GET /v1/operations/{operation_id}`),
        den Zahlstatus liefert `payment` in `GET /v1/bookings/{id}`. `payment_method_ref` ist ein vom PSP gelieferter Verweis, nie Kartendaten (SEC-008).'
      security:
      - oidc:
        - rides:write
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Buchungs-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPaymentRequest'
      responses:
        '202':
          $ref: common.yaml#/components/responses/OperationAccepted
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/bookings/{booking_id}/payment/return:
    post:
      summary: Rückkehr aus der Kundenauthentifizierung (SCA) melden
      operationId: returnBookingPayment
      description: 'Der Kunde kehrt aus SCA/3-D-Secure zurück (WP-M2-30). Die Rückkehr ändert den Zahlstatus **nicht**: sie stellt einen Abgleich ein (Statusabfrage beim PSP), erst der
        verifizierte PSP-Status löst den Übergang aus (Leitlinie 6). Idempotent und mehrfach zulässig (doppelte Rückkehr: höchstens ein noch nicht begonnener Abgleich). Eine
        nachträglich erfolgreiche Autorisierung nach Ablauf der Zahlungsfrist wird aufgehoben, die Buchung nicht bestätigt.'
      security:
      - oidc:
        - rides:write
      parameters:
      - name: booking_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Buchungs-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '202':
          $ref: common.yaml#/components/responses/OperationAccepted
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    StartPaymentRequest:
      type: object
      additionalProperties: false
      properties:
        payment_method_ref:
          type: string
          minLength: 1
          maxLength: 128
          description: Vom Zahlungsdienstleister gelieferter Verweis auf das Zahlungsmittel (Token), nie Kartendaten.
        amount:
          $ref: common.yaml#/components/schemas/Money
      required:
      - payment_method_ref
      - amount
      examples:
      - payment_method_ref: pm_ok
        amount:
          amount_minor: 950
          currency: EUR
          exponent: 2
    ProviderEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 128
        provider:
          type: string
          minLength: 2
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_-]+$
          description: Provider-Kennung; falls angegeben, muss sie der Pfadkennung entsprechen (die Zuordnung zu Mandant und Schlüssel folgt nie aus dem Payload).
        sequence:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^payment\.[a-z_.]+$
        created_at:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
          description: Providerspezifische Nutzdaten (PSP-Referenzwerte, Beträge in kleinster Einheit); keine rohen Zahlungsdaten.
      required:
      - event_id
      - type
      - created_at
      - data
      examples:
      - event_id: evt_0123456789abcdef
        sequence: 1
        type: payment.authorized
        created_at: '2026-11-01T10:00:00Z'
        data:
          provider_ref: pi_1
          state: AUTHORIZED
    ProviderEventReceipt:
      type: object
      additionalProperties: false
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum:
          - ACCEPTED
          - ALREADY_RECEIVED
      required:
      - event_id
      - status
