    ExpenseRevisionList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseRevision'
      required:
      - items
    DecimalQuantity:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
      description: Exakte Dezimalzeichenfolge, maximal sechs Nachkommastellen; nicht als Binary Float verarbeiten.
    DecimalPercent:
      type: string
      pattern: ^(100(\.0{1,8})?|[0-9]{1,2}(\.[0-9]{1,8})?)$
      description: Prozentwert von 0 bis 100 als exakte Dezimalzeichenfolge, höchstens acht Nachkommastellen; nicht als Binary Float verarbeiten.
    CostAllocationLine:
      type: object
      additionalProperties: false
      description: Ergebniszeile einer Aufteilung; `percent` ist der Anteil an der Kostenbasis (acht Nachkommastellen, nur Anzeige, die Beträge sind maßgeblich). `cost_center_id` ist die Kennung des Kostenobjekts, wenn es eine Kostenstelle ist, sonst null.
      properties:
        percent:
          $ref: '#/components/schemas/DecimalPercent'
        cost_center_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        cost_object_type:
          type: string
          enum:
          - VEHICLE
          - SERVICE
          - RUN
          - LEG
          - PROJECT
          - COST_CENTER
          - UNALLOCATED
        cost_object_id:
          $ref: common.yaml#/components/schemas/UUID
        amount:
          $ref: common.yaml#/components/schemas/SignedMoney
        quantity:
          oneOf:
          - $ref: '#/components/schemas/DecimalQuantity'
          - type: 'null'
        unit:
          oneOf:
          - type: string
            enum:
            - KM
            - MIN
            - KWH
            - L
            - ITEM
          - type: 'null'
      required:
      - cost_center_id
      - cost_object_type
      - cost_object_id
      - amount
      - quantity
      - unit
    AllocationRequestLine:
      type: object
      additionalProperties: false
      description: 'Eine Zeile der Aufteilung (WP-M4-35). Genau eine Vorgabeart je Aufteilung: `amount` (Betrag, Summe = Kostenbasis), `percent` (Summe 100) oder nur `quantity` (Schlüsselmenge, Beträge nach Largest Remainder: abrunden je Empfänger, Restcent nach größtem Dezimalrest, Gleichstand nach kleinerer Kostenobjekt-ID). Eine Mischung von Betrags- und Prozentzeilen ist 422. `quantity` und `unit` dürfen `amount` bzw. `percent` als Schlüsselangabe ergänzen. `cost_center_id` ist optional (informativ, muss ggf. zum Kostenobjekt passen).'
      properties:
        cost_center_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        cost_object_type:
          type: string
          enum:
          - VEHICLE
          - COST_CENTER
          - PROJECT
        cost_object_id:
          $ref: common.yaml#/components/schemas/UUID
        amount:
          oneOf:
          - $ref: common.yaml#/components/schemas/SignedMoney
          - type: 'null'
        percent:
          oneOf:
          - $ref: '#/components/schemas/DecimalPercent'
          - type: 'null'
        quantity:
          oneOf:
          - $ref: '#/components/schemas/DecimalQuantity'
          - type: 'null'
        unit:
          oneOf:
          - type: string
            enum:
            - KM
            - MIN
            - KWH
            - L
            - ITEM
          - type: 'null'
      required:
      - cost_object_type
      - cost_object_id
    AllocationRequest:
      type: object
      additionalProperties: false
      properties:
        allocation_policy_revision:
          type: string
          minLength: 1
          maxLength: 256
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        lines:
          type: array
          items:
            $ref: '#/components/schemas/AllocationRequestLine'
          minItems: 1
          maxItems: 1000
      required:
      - allocation_policy_revision
      - reason
      - lines
      description: Summe amount = allokierbare Kostenbasis des Quellereignisses (centgenau; sonst 422 ALLOCATION_SUM_MISMATCH); gleiche Währung/Exponent.
        Alternativ Prozentzeilen (Summe 100) oder Schlüsselmengen (Largest Remainder). Keine Fremdmandanten-Kostenstelle. Umlage über Rechtsträgergrenzen erzeugt
        separaten vertraglichen Intercompany-Vorgang.
      examples:
      - allocation_policy_revision: vehicle-km-v1
        reason: Tageskosten nach belegten Fahrzeugkilometern
        lines:
        - cost_center_id: 00000000-0000-4000-8000-000000000080
          cost_object_type: COST_CENTER
          cost_object_id: 00000000-0000-4000-8000-000000000081
          amount:
            amount_minor: 6000
            currency: EUR
            exponent: 2
          quantity: '60.000000'
          unit: KM
        - cost_center_id: 00000000-0000-4000-8000-000000000082
          cost_object_type: COST_CENTER
          cost_object_id: 00000000-0000-4000-8000-000000000083
          amount:
            amount_minor: 4000
            currency: EUR
            exponent: 2
          quantity: '40.000000'
          unit: KM
    AllocationResult:
