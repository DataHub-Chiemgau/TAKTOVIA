          enum:
          - VEHICLE
          - SHIFT
        id:
          $ref: common.yaml#/components/schemas/UUID
      required:
      - kind
      - id
    Expense:
      type: object
      additionalProperties: false
      properties:
        document_id:
          $ref: common.yaml#/components/schemas/UUID
        legal_entity_id:
          $ref: common.yaml#/components/schemas/UUID
        state:
          type: string
          description: Belegzustand; QUARANTINED, STORED (Erfassung) oder QUARANTINE_REJECTED, danach IN_REVIEW, REVIEWED, WAITING_SECOND_APPROVAL und POSTED (Freigabe-Workflow, WP-M4-34).
        source_channel:
          type: string
          enum:
          - DRIVER_APP
          - DISPATCH_WEB
          - EMAIL_INBOUND
          - INVOICE_IMPORT
        document_kind:
          type: string
          enum:
          - RECEIPT
          - FUEL_RECEIPT
          - INVOICE
          - OTHER
        case_ref:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ExpenseCaseRef'
        mime:
          type: string
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          maximum: 1073741824
        sha256:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Serverseitig berechneter SHA-256 des Originals, base64url.
        received_at:
          type: string
          format: date-time
          description: Eingangszeit des Originals (Server).
        scanned_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        sender_verified:
          oneOf:
          - type: boolean
          - type: 'null'
          description: Nur E-Mail-Eingang; false = Absenderdomäne nicht verifiziert, der Beleg ist nicht freigabefähig.
        integrity:
          type: string
          enum:
          - UNCHECKED
          - VERIFIED
          - VIOLATED
        approvable:
          type: boolean
          description: Freigabefähigkeit aus Dokument und Kostenzuordnung (keine Blocker); weitere Voraussetzungen kommen mit späteren Paketen.
        blockers:
          type: array
          items:
            type: string
            enum:
            - NOT_STORED
            - UNVERIFIED_SENDER
            - INTEGRITY_VIOLATION
            - UNCONFIRMED_FIELDS
            - SUM_MISMATCH
            - COST_ASSIGNMENT_MISSING
            - COST_OBJECT_INACTIVE
            - FUEL_FIELDS_MISSING
            - HINT_UNACKNOWLEDGED
            - DUPLICATE_REVIEW_OPEN
            - DUPLICATE_EVIDENCE
            - SPLIT_INCOMPLETE
        unconfirmed_fields:
          type: array
          description: Pflichtfelder (`receipt_mandatory_fields`) ohne menschliche Bestätigung oder Korrektur sowie markierte OCR-Vorschläge ohne Entscheidung. Ein OCR-Vorschlag ist nie Belegstand.
          items:
            $ref: '#/components/schemas/ExpenseFieldName'
        sum_mismatch:
          type: boolean
          description: Die bestätigten Werte erfüllen Netto + Steuer = Brutto nicht.
        cost_objects:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CostObject'
          description: Zugeordnete Kostenobjekte (WP-M4-29).
        fuel:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/FuelData'
          description: Tankwerte (WP-M4-30), nur bei Belegen der Art FUEL_RECEIPT; `missing` nennt die fehlenden Pflichtwerte einzeln.
        hints:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ExpenseHint'
          description: Plausibilitätshinweise der aktuellen Belegrevision (WP-M4-31), offen und quittiert.
        plausibility_notes:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/ExpensePlausibilityNote'
        duplicates:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ExpenseDuplicate'
          description: Dublettentreffer, an denen der Beleg beteiligt ist (WP-M4-32).
        split:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ExpenseSplitView'
          description: Aufteilungsplan des Belegs (WP-M4-35), null solange keiner gesetzt ist.
        cost_event_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Das Kostenereignis des gebuchten Belegs (Grundlage des Gegenbelegs, `createCostEventReversal`), sonst null.
        split_problem:
          oneOf:
          - type: string
          - type: 'null'
          description: Grund, warum die Aufteilung unvollständig ist (Lücke, Differenz zur Kostenbasis); null, wenn keine Aufteilung nötig oder sie vollständig ist.
        approval_steps:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ExpenseApprovalStep'
          description: Freigabeschritte in zeitlicher Folge (WP-M4-34).
        export_state:
          type: string
          enum:
          - NOT_EXPORTED
          - EXPORTED
          - CONFIRMED
          description: Exportstatus, ein eigenes Statusfeld; gesetzt nur vom Exportjob unter eigener Berechtigung und nur für gebuchte Belege. `EXPORTED` = bereitgestellt (in einem Exportbatch), `CONFIRMED` = Import im Zielsystem bestätigt (WP-M4-37).
        fields:
          $ref: '#/components/schemas/ExpenseFieldValues'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - document_id
      - legal_entity_id
      - state
      - source_channel
      - document_kind
      - case_ref
      - mime
      - size_bytes
      - sha256
      - received_at
      - scanned_at
      - sender_verified
      - integrity
      - approvable
      - blockers
      - unconfirmed_fields
      - sum_mismatch
      - cost_objects
      - fields
      - revision
    ExpenseFieldChange:
