      - oidc:
        - receipts:read
      description: 'Liefert das Original byteweise unverändert, nur wenn die Quarantäneprüfung bestanden ist (sonst 404). Vor der Auslieferung wird der Hash geprüft: eine Abweichung oder ein fehlendes Objekt ergibt 409 `DOCUMENT_INTEGRITY_VIOLATION` und einen Integritätsvorfall. Die Auslieferung über eine signierte, kurzlebige URL des Objektspeichers ist nicht ausgeführt (kein Objektspeicher-Adapter); die Antwort enthält die Bytes direkt.'
      parameters:
      - $ref: common.yaml#/components/parameters/expense_id
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    ExpenseVatAmount:
      type: object
      additionalProperties: false
      properties:
        vat_rate_pct:
          type: string
          pattern: ^[0-9]{1,2}(\.[0-9]{1,2})?$
          description: Mehrwertsteuersatz in Prozent als Dezimalstring.
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Mehrwertsteuerbetrag in kleinster Einheit.
      required:
      - vat_rate_pct
      - amount_minor
    ExpenseFieldValues:
      type: object
      additionalProperties: false
      description: Belegfelder in Normalform. Nicht erfasste Felder fehlen.
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Bruttobetrag in kleinster Einheit.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        document_date:
          type: string
          format: date
        merchant:
          type: string
          minLength: 1
          maxLength: 200
        document_number:
          type: string
          minLength: 1
          maxLength: 100
        vat_amounts:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ExpenseVatAmount'
        net_amount_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Nettobetrag in kleinster Einheit; Netto + Mehrwertsteuer muss dem Brutto entsprechen, sonst ist der Beleg nicht freigabefähig (`SUM_MISMATCH`).
    ExpenseFieldName:
      type: string
      enum:
      - amount_minor
      - currency
      - document_date
      - merchant
      - document_number
      - vat_amounts
      - net_amount_minor
    ExpenseCorrection:
      type: object
      additionalProperties: false
      description: Entweder `fields`/`confirm` (mindestens eines, dann ist `reason` Pflicht), `cost_assignment`, `fuel` (Tankwerte, WP-M4-30) oder `split` (Aufteilungsplan, WP-M4-35); diese Arten sind nicht kombinierbar. Ein Feld in `fields` muss vom aktuellen Stand abweichen; `confirm` bestätigt den OCR-Vorschlag unverändert.
      properties:
        cost_assignment:
          $ref: '#/components/schemas/ExpenseCostAssignment'
        fuel:
          $ref: '#/components/schemas/FuelCapture'
        split:
          $ref: '#/components/schemas/ExpenseSplit'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        fields:
          $ref: '#/components/schemas/ExpenseFieldValues'
        confirm:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExpenseFieldName'
    DuplicateDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - GLEICHE_EVIDENZ
          - EIGENER_VORGANG
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      required:
      - decision
      - reason
    ExpenseDuplicate:
      type: object
      additionalProperties: false
      description: 'Dublettentreffer (WP-M4-32). `role` = Sicht des Belegs (NEWER: er wird Evidenz oder blockiert, OLDER: Gegenüber). `other_document_id`, `basis` und `other` (Gegenüberstellung) sieht nur die Finanzrolle.'
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        role:
          type: string
          enum:
          - NEWER
          - OLDER
        other_document_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        match:
          type: string
          enum:
          - HASH
          - FACTS
        certainty:
          type: string
          enum:
          - SAFE
          - POSSIBLE
        score:
          type: integer
          minimum: 0
          maximum: 100
        basis:
          oneOf:
          - type: object
            description: Trefferregel, Schwelle, übereinstimmende und abweichende Felder.
          - type: 'null'
        state:
          type: string
          enum:
          - OFFEN
          - GLEICHE_EVIDENZ
          - EIGENER_VORGANG
        detected_at:
          type: string
          format: date-time
        decided_by:
          oneOf:
          - type: string
          - type: 'null'
        decided_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        reason:
          oneOf:
          - type: string
          - type: 'null'
        other:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ExpenseDuplicateFacts'
      required:
      - id
      - role
      - other_document_id
      - match
      - certainty
      - score
      - basis
      - state
      - detected_at
      - decided_by
      - decided_at
      - reason
      - other
    ExpenseDuplicateFacts:
      type: object
      additionalProperties: false
      properties:
        merchant:
          oneOf:
          - type: string
          - type: 'null'
        document_date:
          oneOf:
          - type: string
          - type: 'null'
        currency:
          oneOf:
          - type: string
          - type: 'null'
        amount_minor:
          oneOf:
          - type: integer
            format: int64
          - type: 'null'
        document_number:
          oneOf:
          - type: string
          - type: 'null'
        source_channel:
          type: string
        received_at:
          type: string
          format: date-time
      required:
      - merchant
      - document_date
      - currency
      - amount_minor
      - document_number
      - source_channel
      - received_at
    ExpenseReviewRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      required:
      - decision
      - reason
    ExpenseApprovalStep:
      type: object
      additionalProperties: false
      description: Freigabeschritt (`approval_step`, append-only) mit Akteur, Dokumentrevision, Entscheidung, Begründung und Zeit.
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        step:
          type: string
          enum:
          - CAPTURE
          - REVIEW
          - BUDGET
          - SECOND_APPROVAL
        document_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        decided_by:
          type: string
        reason:
          type: string
        decided_at:
          type: string
          format: date-time
      required:
      - id
      - step
      - document_revision
      - decision
      - decided_by
      - reason
      - decided_at
    HintAcknowledgementRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      required:
      - reason
    ExpenseHint:
      type: object
      additionalProperties: false
      description: 'Plausibilitätshinweis (WP-M4-31): Regel, Schwelle, Istwert und Berechnungsbasis. Er ändert keinen erfassten Wert; `acknowledgement` = null heißt offen.'
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        rule:
          type: string
          enum:
          - FUEL_VOLUME
          - FUEL_PRICE
          - FUEL_ODOMETER_GAP
          - FUEL_CARD_MISMATCH
        document_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        threshold:
          type: string
        actual_value:
          type: string
        basis:
          type: object
          description: Berechnungsbasis (Vergleichswert, Schwelle, Quelle; je Regel weitere Angaben wie Abweichung in Prozent oder Stichprobengröße).
        raised_at:
          type: string
          format: date-time
        acknowledgement:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ExpenseHintAcknowledgement'
      required:
      - id
      - rule
      - document_revision
      - threshold
      - actual_value
      - basis
      - raised_at
      - acknowledgement
    ExpenseHintAcknowledgement:
      type: object
      additionalProperties: false
      properties:
        acknowledged_by:
          type: string
        reason:
          type: string
        acknowledged_at:
          type: string
          format: date-time
      required:
      - acknowledged_by
      - reason
      - acknowledged_at
    ExpensePlausibilityNote:
      type: object
      additionalProperties: false
      description: Vermerk zu einer nicht prüfbaren Regel. `PARAMETER_MISSING` = der Parameter ist nicht konfiguriert (die Regel gilt nie stillschweigend als bestanden), `NO_COMPARISON_BASIS` = kein Vergleichswert (z. B. kein Vorgänger-Kilometerstand).
      properties:
        rule:
          type: string
          enum:
          - FUEL_VOLUME
          - FUEL_PRICE
          - FUEL_ODOMETER_GAP
          - FUEL_CARD_MISMATCH
        code:
          type: string
          enum:
          - PARAMETER_MISSING
          - NO_COMPARISON_BASIS
        text:
          type: string
      required:
      - rule
      - code
      - text
    FuelCapture:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Tankwerte eines Belegs der Art FUEL_RECEIPT. Gesetzt wird, was angegeben ist; die übrigen Werte bleiben. Menge und Preis sind Dezimalstrings (nie JSON-Zahlen, nie Gleitkomma), positiv, höchstens 8 Nachkommastellen. Der Bruttobetrag ist das Belegfeld `amount_minor`. Die Einheit folgt der Kraftstoffart (ELECTRIC = kWh, sonst Liter).
      properties:
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        fuel_type:
          type: string
          enum:
          - PETROL
          - DIESEL
          - LPG
          - ELECTRIC
        quantity:
          type: string
          pattern: ^[0-9]{1,12}(\.[0-9]{1,8})?$
        unit_price:
          type: string
          pattern: ^[0-9]{1,12}(\.[0-9]{1,8})?$
        odometer_km:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
        fueled_at:
          type: string
          format: date-time
        card_id:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
    FuelData:
      type: object
      additionalProperties: false
      properties:
        vehicle_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        fuel_type:
          oneOf:
          - type: string
            enum:
            - PETROL
            - DIESEL
            - LPG
            - ELECTRIC
          - type: 'null'
        quantity:
          oneOf:
          - type: string
            pattern: ^[0-9]{1,12}(\.[0-9]{1,8})?$
          - type: 'null'
        unit:
          oneOf:
          - type: string
            enum:
            - LITER
            - KWH
          - type: 'null'
        unit_price:
          oneOf:
          - type: string
            pattern: ^[0-9]{1,12}(\.[0-9]{1,8})?$
          - type: 'null'
        gross_minor:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
          description: Spiegel des Belegfelds `amount_minor`.
        currency:
          oneOf:
          - type: string
            pattern: ^[A-Z]{3}$
          - type: 'null'
        odometer_km:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
            maximum: 10000000
          - type: 'null'
        fueled_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        card_id:
          oneOf:
          - type: string
          - type: 'null'
        missing:
          type: array
          description: Fehlende Pflichtwerte einzeln (Kraftstoffart, Menge, Preis je Einheit, Kilometerstand, Fahrzeug); solange `fuel_receipt_required` gilt, ist der Beleg dann nicht freigabefähig.
          items:
            type: string
            enum:
            - vehicle_id
            - fuel_type
            - quantity
            - unit_price
            - odometer_km
        complete:
          type: boolean
      required:
      - vehicle_id
      - fuel_type
      - quantity
      - unit
      - unit_price
      - gross_minor
      - currency
      - odometer_km
      - fueled_at
      - card_id
      - missing
      - complete
    ExpenseSplit:
      type: object
      additionalProperties: false
      description: 'Aufteilungsplan eines Belegs mit mehreren zugeordneten Kostenobjekten (WP-M4-35, Offener Punkt 18): ersetzt den bisherigen Plan, nur im Belegzustand STORED, `If-Match` Pflicht. Die Zeilen müssen zu den zugeordneten Kostenobjekten gehören; Freigabe und Posting verlangen einen vollständigen, centgenauen Plan (422 SPLIT_INCOMPLETE). Beim Posting wird er atomar die erste Umlagerevision des Kostenereignisses. Eine geänderte Kostenzuordnung verwirft den Plan.'
      properties:
        allocation_policy_revision:
          type: string
          minLength: 1
          maxLength: 256
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        lines:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/AllocationRequestLine'
      required:
      - allocation_policy_revision
      - reason
      - lines
    ExpenseSplitLine:
      type: object
      additionalProperties: false
      properties:
        cost_object_id:
          $ref: common.yaml#/components/schemas/UUID
        percent:
          oneOf:
          - $ref: '#/components/schemas/DecimalPercent'
          - type: 'null'
        amount_minor:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
        quantity:
          oneOf:
          - $ref: '#/components/schemas/DecimalQuantity'
          - type: 'null'
        unit:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - cost_object_id
      - percent
      - amount_minor
      - quantity
      - unit
    ExpenseSplitView:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - AMOUNT
          - PERCENT
          - WEIGHT
        allocation_policy_revision:
          type: string
        reason:
          type: string
        lines:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ExpenseSplitLine'
        set_by:
          type: string
        set_at:
          type: string
          format: date-time
      required:
      - mode
      - allocation_policy_revision
      - reason
      - lines
      - set_by
      - set_at
    ExpenseCostAssignment:
      type: object
      additionalProperties: false
      description: Ersetzt die Kostenzuordnung; mindestens ein Eintrag in `cost_object_ids` oder `vehicle_ids`, zusammen höchstens 20.
      properties:
        cost_object_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: common.yaml#/components/schemas/UUID
        vehicle_ids:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: common.yaml#/components/schemas/UUID
    CostObject:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        kind:
          type: string
          enum:
          - VEHICLE
          - COST_CENTER
        reference:
          type: string
          description: Kennung der Kostenstelle bzw. Fahrzeugkennung/Rechtsträger-Schlüssel des Fahrzeug-Kostenobjekts.
        name:
          oneOf:
          - type: string
          - type: 'null'
        legal_entity_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        active:
          type: boolean
      required:
      - id
      - kind
      - reference
      - name
      - legal_entity_id
      - vehicle_id
      - active
    CostObjectPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CostObject'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
    CostEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        legal_entity_id:
          $ref: common.yaml#/components/schemas/UUID
        source_system:
          type: string
        source_ref:
          type: string
        event_type:
          type: string
        scenario:
          type: string
          enum:
          - ACTUAL
        category:
          type: string
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        net_minor:
          type: integer
          format: int64
        tax_minor:
          type: integer
          format: int64
        gross_minor:
          type: integer
          format: int64
        recoverable_tax_minor:
          type: integer
          format: int64
        cost_basis_minor:
          type: integer
          format: int64
          description: Brutto minus abziehbare Steuer.
        tax_rule_revision:
          type: string
        occurred_at:
          type: string
          format: date-time
        booked_at:
          type: string
          format: date-time
        document_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        reverses_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        cost_behavior:
          oneOf:
          - type: string
            enum:
            - FIXED
            - VARIABLE
            - MIXED
          - type: 'null'
          description: Kostenverhalten (WP-M4-39), beim Posting aus dem Kostenartenkatalog gesetzt und unveränderlich; `null` zusammen mit `attribution` = nicht klassifiziert.
        attribution:
          oneOf:
          - type: string
            enum:
            - DIRECT
            - ALLOCATED
          - type: 'null'
          description: Zurechnung (WP-M4-39) direkt oder umgelegt; unabhängig von `cost_behavior` (zwei Achsen, nie addiert).
        reclassified_from_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Ursprung, wenn dieses Ereignis die Neubuchung nach einer Umklassifikation ist (WP-M4-39).
      required:
      - id
      - legal_entity_id
      - source_system
      - source_ref
      - event_type
      - scenario
      - category
      - currency
      - net_minor
      - tax_minor
      - gross_minor
      - recoverable_tax_minor
      - cost_basis_minor
      - tax_rule_revision
      - occurred_at
      - booked_at
      - document_id
      - reverses_id
    FiscalPeriod:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        legal_entity_id:
          $ref: common.yaml#/components/schemas/UUID
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
          description: Erster Tag nach der Periode (halboffenes Intervall).
        state:
          type: string
          enum:
          - OPEN
          - CLOSED
        closed_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        closed_by:
          oneOf:
          - type: string
          - type: 'null'
        created_by:
          oneOf:
          - type: string
          - type: 'null'
      required:
      - id
      - legal_entity_id
      - starts_on
      - ends_on
      - state
      - closed_at
      - closed_by
      - created_by
    FiscalPeriodPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FiscalPeriod'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
    CreateFiscalPeriodRequest:
      type: object
      additionalProperties: false
      properties:
        legal_entity_id:
          $ref: common.yaml#/components/schemas/UUID
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
          description: Erster Tag nach der Periode; höchstens 400 Tage nach `starts_on`.
      required:
      - legal_entity_id
      - starts_on
      - ends_on
    CostEventReversalRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
        credit_gross_minor:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
          description: Bruttobetrag der Korrektur in kleinster Einheit; null = der noch nicht korrigierte Rest.
        accounting_date:
          oneOf:
          - type: string
            format: date
          - type: 'null'
          description: Gewünschtes Buchungsdatum (Vorgabe heute, UTC); liegt es in einer geschlossenen Periode, gilt die nächste offene Periode.
      required:
      - reason
    JournalLine:
      type: object
      additionalProperties: false
      properties:
        account:
          type: string
        side:
          type: string
          enum:
          - D
          - C
        amount_minor:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - account
      - side
      - amount_minor
    Journal:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        event_id:
          $ref: common.yaml#/components/schemas/UUID
        state:
          type: string
          enum:
          - POSTED
        accounting_date:
          type: string
          format: date
        period_id:
          $ref: common.yaml#/components/schemas/UUID
        posted_by:
          oneOf:
          - type: string
          - type: 'null'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
          minItems: 2
      required:
      - id
      - event_id
      - state
      - accounting_date
      - period_id
      - posted_by
      - lines
    CostEventReversal:
      type: object
