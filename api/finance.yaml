paths:
  /v1/cost-events:
    get:
      summary: Kostenereignisse des Ist-Berichts lesen
      operationId: listCostEvents
      security:
      - oidc:
        - costs:read
      description: 'Unveränderliche Kostenereignisse des Szenarios `ACTUAL` **mit gebuchtem Journal** (nur `POSTED` zählt im Ist-Bericht, WP-M4-33), aufsteigend nach Buchungszeit und Kennung, Cursor-Seiten. `as_of` begrenzt auf Ereignisse, die zu diesem Zeitpunkt schon gebucht waren; `legal_entity_id` filtert auf einen Rechtsträger. Beträge in kleinster Einheit als Ganzzahlen.'
      parameters:
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: legal_entity_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostEventPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Manuelles Fahrzeugkostenereignis anlegen (freigabepflichtig)
      operationId: createManualCostEvent
      security:
      - oidc:
        - costs:write
      description: 'WP-M4-40 (FCO-002): legt ein manuelles Kostenereignis zu einem Fahrzeug an (z. B. Versicherung, Kfz-Steuer, Leasingrate ohne Beleg). Es ist **freigabepflichtig** und durchläuft denselben Automaten wie ein Beleg (Prüfung `…/review`, Budgetfreigabe `…/approve`, bei Überschreiten der Vier-Augen-Schwelle zweite Freigabe durch eine dritte Person, kein Selbstfreigeben); erst die endgültige Freigabe bucht das Kostenereignis. Der fachliche Ursprungsschlüssel `origin_key` macht Anlegen und Buchen einmalig: dasselbe Ereignis erneut (auch parallel) liefert den vorhandenen Vorgang mit 200, derselbe Schlüssel mit anderem Inhalt 409. Unbekannte Kostenart 422, Fahrzeug oder Rechtsträger eines anderen Mandanten 404, fehlende Kontierungsregel 409. Anschaffung wird in P1 weder abgeschrieben noch verteilt.'
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: costs.yaml#/components/schemas/ManualCostEventCreate
      responses:
        '201':
          description: Neuer Vorgang.
          content:
            application/json:
              schema:
                $ref: costs.yaml#/components/schemas/ManualCostEvent
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '200':
          description: Vorhandener Vorgang zum selben Ursprungsschlüssel.
          content:
            application/json:
              schema:
                $ref: costs.yaml#/components/schemas/ManualCostEvent
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/cost-events/{cost_event_id}/allocations:
    post:
      summary: Kostenbasis auf Kostenträger verteilen
      operationId: allocateCost
      security:
      - oidc:
        - costs:allocate
      parameters:
      - $ref: common.yaml#/components/parameters/cost_event_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationResult'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
      description: 'Atomare vollständige Allokationsrevision (WP-M4-35) eines gebuchten Ist-Kostenereignisses innerhalb des eigenen Rechtsträgers
        auf Kostenstellen, Fahrzeuge oder Projekte. `If-Match` = aktive Aufteilungsrevision (`"0"` = noch nicht aufgeteilt); eine neue Revision ersetzt die aktive
        atomar und genau eine Fassung ist aktiv (veraltet 412, fehlend 428). Exakte Summe: Summe der Teilbeträge = Kostenbasis des Ereignisses, sonst
        422 ALLOCATION_SUM_MISMATCH (auch um einen Cent; Prozent ungleich 100 ebenso). Geschlossene Periode: 409 PERIOD_CLOSED. 409 ALREADY_ALLOCATED, wenn
        das Ereignis schon aufgeteilt ist, der Aufruf aber `"0"` als Revision nennt. Kostenobjekt eines anderen Rechtsträgers, inaktives, doppeltes oder
        nicht zulässiges (nur COST_CENTER, VEHICLE, PROJECT): 422; Ereignis oder Kostenobjekt eines anderen Mandanten: 404. Scope `costs:allocate` und
        Finanzrolle. Keine neue Quellkostenwirkung (weder Journal noch Verbindlichkeit); Korrekturen erfolgen als neue Revision bzw. als Gegenereignis (WP-M4-36).
        Revision, Akteur, Regelrevision und Begründung stehen im Audit.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
  /v1/fiscal-periods:
    get:
      summary: Fiskalperioden lesen
      operationId: listFiscalPeriods
      security:
      - oidc:
        - periods:read
      description: 'Fiskalperioden des Mandanten (WP-M4-36), aufsteigend nach Beginn, Cursor-Seiten; `legal_entity_id` filtert auf einen Rechtsträger. Ein Zeitraum ist halboffen `[starts_on, ends_on)`; `closed_at` gesetzt = abgeschlossen. Scope `periods:read` und Finanzrolle.'
      parameters:
      - name: legal_entity_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalPeriodPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Fiskalperiode anlegen
      operationId: createFiscalPeriod
      security:
      - oidc:
        - periods:manage
      description: 'Legt eine offene Periode eines Rechtsträgers an (WP-M4-36). Perioden eines Rechtsträgers überlappen sich nie (409 CONFLICT, auch bei parallelem Anlegen genau eine); benachbarte Perioden sind erlaubt. Rechtsträger eines anderen Mandanten: 404. Scope `periods:manage`, Finanzrolle, Mensch.'
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFiscalPeriodRequest'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalPeriod'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/fiscal-periods/{period_id}/close:
    post:
      summary: Fiskalperiode abschließen
      operationId: closeFiscalPeriod
      security:
      - oidc:
        - periods:close
      description: 'Schließt die Periode endgültig (WP-M4-36). Eigenes Finanzrecht (Scope `periods:close`, Finanzrolle, Mensch); Akteur und Zeit stehen an der Periode und im Audit. Die Periodenzeile wird gesperrt: bei Konkurrenz mit Posting, Aufteilung oder einem zweiten Abschluss gewinnt genau eine Transaktion; wer danach schreiben will, erhält 409 PERIOD_CLOSED. Ein zweiter Abschluss derselben Periode ist 409 PERIOD_CLOSED. Es gibt keinen Pfad, der eine geschlossene Periode wieder öffnet. Spätere Korrekturen entstehen als Gegenereignis in der nächsten offenen Periode (`createCostEventReversal`). Die Periode hat keine Revision (kein If-Match): der Abschluss ist einmalig.'
      parameters:
      - $ref: common.yaml#/components/parameters/period_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalPeriod'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/cost-events/{cost_event_id}/reversals:
    post:
      summary: Gegenereignis zu einem Kostenereignis anlegen
      operationId: createCostEventReversal
      security:
      - oidc:
        - costs:reverse
      description: 'Korrigiert ein gebuchtes Ist-Kostenereignis als Gegenereignis (WP-M4-36, Leitlinie 5): das Ursprungsereignis und sein Journal bleiben unverändert (auch in einer geschlossenen Periode); das Gegenereignis (`reverses_id`, negative Beträge) bucht in der nächsten offenen Periode ab `accounting_date` (Vorgabe heute, UTC) eine Gegenbuchung mit getauschten Seiten auf denselben Konten und kehrt die gespeicherte Aufteilung des Ursprungs negativ um. `credit_gross_minor` = Bruttobetrag der Korrektur (leer = der noch nicht korrigierte Rest). Ein zweites Gegenereignis zum selben Ursprung und Betrag ist 409 ALREADY_REVERSED (einmalige Wirkung), mehr als der Rest 422, ein Gegenereignis eines Gegenereignisses oder ohne offene Periode 409 CONFLICT. Scope `costs:reverse`, Finanzrolle, Mensch. Das Ursprungsereignis ist unveränderlich und hat keine Revision (kein If-Match).'
      parameters:
      - $ref: common.yaml#/components/parameters/cost_event_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CostEventReversalRequest'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostEventReversal'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/ledger/exports:
    get:
      summary: Exportbatches des Hauptbuchs lesen
      operationId: listLedgerExports
      security:
      - oidc:
        - ledger:read
      description: 'Exportbatches (WP-M4-37) des Mandanten, aufsteigend nach Anlage und Kennung, Cursor-Seiten, `as_of` = Datenstand. Scope `ledger:read` und Finanzrolle (Dienstkonten genügt der Scope).'
      parameters:
      - name: legal_entity_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerExportPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Export des Hauptbuchs als Job anfordern
      operationId: createLedgerExport
      security:
      - oidc:
        - ledger:export
      description: 'Fordert den Export der gebuchten, vollständig freigegebenen Journale eines Rechtsträgers im Zeitraum `[period_from, period_to)` an (WP-M4-37). Der Export ist ein wiederholsicherer Job (`operation` `LEDGER_EXPORT` mit Lease und Fencing): 202 mit dem Auftrag (`state` REQUESTED, `operation_id`; Status über `getLedgerExport`). Dieselbe Anforderung (Rechtsträger, Zielsystem, Zeitraum) liefert 200 mit demselben offenen Auftrag bzw. dem vorhandenen Batch (gleiche Kennungen, gleicher Inhaltshash), solange nichts Neues exportierbar ist; neue Journale ergeben einen neuen Batch nur mit diesen, ein Journal erscheint in genau einem Batch. Leerer Zeitraum ohne Batch: 409. Eigene Exportberechtigung (Scope `ledger:export`), getrennt von der Freigabe; Rechtsträger eines anderen Mandanten: 404. Zielsystem bis D-06 nur `NEUTRAL` (neutrales Testformat). Der Auftrag hat keine Revision (kein If-Match).'
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedgerExportRequest'
      responses:
        '200':
          description: Der Umfang hat schon einen offenen Auftrag oder einen Batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerExport'
        '202':
          description: Auftrag eingestellt.
          headers:
            Location:
              schema:
                type: string
              description: /v1/operations/{operation_id}
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 1
                maximum: 300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerExport'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/ledger/exports/{export_id}:
    get:
      summary: Exportbatch lesen
      operationId: getLedgerExport
      security:
      - oidc:
        - ledger:read
      description: 'Stand eines Exportbatchs (WP-M4-37): Zustand, Auftrag, Kennung (`batch_ref`), Inhaltshash und Anzahl ab der Bereitstellung. Fremde Mandanten: 404.'
      parameters:
      - $ref: common.yaml#/components/parameters/export_id
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerExport'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/ledger/exports/{export_id}/lines:
    get:
      summary: Journale eines Exportbatchs lesen
      operationId: listLedgerExportLines
      security:
      - oidc:
        - ledger:read
      description: 'Die Journale des Batchs (eindeutige Journal-ID je Zeile, Beleg, Bestätigungs-ID, WP-M4-37), nach Journal-ID sortiert. Grundlage des Bestätigungsprotokolls.'
      parameters:
      - $ref: common.yaml#/components/parameters/export_id
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerExportLinePage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/ledger/exports/{export_id}/download:
    get:
      summary: Kurzlebige Downloadadresse eines Exportbatchs
      operationId: getLedgerExportDownload
      security:
      - oidc:
        - ledger:export
      description: 'Liefert eine kurzlebige (höchstens 60 s), mandantengebundene signierte Adresse für den Inhalt eines bereitgestellten Batchs (WP-M4-37). Nicht bereitgestellt: 409. Scope `ledger:export`.'
      parameters:
      - $ref: common.yaml#/components/parameters/export_id
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerExportDownloadLink'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/ledger/exports/{export_id}/content:
    get:
      summary: Inhalt eines Exportbatchs über signierte Adresse abrufen
      operationId: readLedgerExportContent
      security:
      - oidc:
        - ledger:export
      description: 'Liefert den Inhalt zur signierten Adresse aus `getLedgerExportDownload` (Parameter `exp`, `sig`; WP-M4-37). Signatur, Ablauf und Mandantenbindung werden geprüft: ungültige, abgelaufene oder mandantenfremde Adressen sind nicht von einem fehlenden Batch zu unterscheiden (404). Der Download steht im Audit.'
      parameters:
      - $ref: common.yaml#/components/parameters/export_id
      - name: exp
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        description: Ablauf (Unix-Sekunden).
      - name: sig
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
        description: Signatur (HMAC-SHA256, hexadezimal).
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Inhalt des Batchs im Zielformat (Medientyp aus `media_type` des Batchs).
          headers:
            X-Content-SHA256:
              schema:
                type: string
                pattern: ^[0-9a-f]{64}$
              description: SHA-256 des Inhalts (hexadezimal), gleich `content_sha256` des Batchs.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/ledger/exports/{export_id}/confirmation:
    post:
      summary: Import des Exportbatchs bestätigen
      operationId: confirmLedgerExport
      security:
      - oidc:
        - ledger:export
      description: 'Bestätigungsprotokoll (WP-M4-37): die Import-ID des Zielsystems je Journal des Batchs, alle Journale genau einmal (sonst 422), Import-IDs eindeutig. Setzt den Batch auf `CONFIRMED` und den Exportstatus der Belege auf bestätigt. Dieselbe Bestätigung wiederholt liefert den unveränderten Stand, eine abweichende 409; ein nicht bereitgestellter Batch 409. Der Batch hat keine Revision (kein If-Match).'
      parameters:
      - $ref: common.yaml#/components/parameters/export_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmLedgerExportRequest'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerExport'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
