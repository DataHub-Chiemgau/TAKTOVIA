paths:
  /v1/cost-events:
    get:
      summary: Kostenereignisse des Ist-Berichts lesen
      operationId: listCostEvents
      security:
      - oidc:
        - costs:read
      description: 'Unveränderliche Kostenereignisse des Szenarios `ACTUAL` **mit gebuchtem Journal** (nur `POSTED` zählt im Ist-Bericht, WP-M4-33), aufsteigend nach Buchungszeit und Kennung, Cursor-Seiten. `as_of` begrenzt auf Ereignisse, die zu diesem Zeitpunkt schon gebucht waren; `legal_entity_id` filtert auf einen Rechtsträger. Beträge in kleinster Einheit als Ganzzahlen.'
      parameters:
      - name: as_of
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: legal_entity_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostEventPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/cost-events/{cost_event_id}/allocations:
    post:
      summary: Kostenbasis auf Kostenträger verteilen
      operationId: allocateCost
      security:
      - oidc:
        - costs:allocate
      parameters:
      - $ref: common.yaml#/components/parameters/cost_event_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationResult'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
      description: Atomare vollständige Allokationsrevision innerhalb eigener Rechtseinheit. Exakte Summe und freigegebene
        offene Periode prüfen; 409 PERIOD_CLOSED oder ALREADY_ALLOCATED. Keine neue Quellkostenwirkung; Korrekturen erfolgen
        über gesonderte Gegenbuchung.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
  /v1/expenses/{expense_id}/approve:
    post:
      summary: Belegrevision fachlich freigeben
      operationId: approveExpense
      security:
      - oidc:
        - expenses:approve
      parameters:
      - $ref: common.yaml#/components/parameters/expense_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseApproval'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
      description: Vieraugenregel nach Betrag/Policy; Ersteller darf erforderliche Zweitfreigabe nicht selbst erfüllen. POSTED
        erst nach atomarem Journal+Outbox-Commit. Dublettenkandidat blockiert mit 409 DUPLICATE_REVIEW_REQUIRED. Solange ein Pflichtfeld nicht bestätigt oder korrigiert ist, ein markierter OCR-Vorschlag (niedrige Konfidenz, Summenabweichung) unentschieden bleibt oder Netto + Steuer ≠ Brutto gilt, weist die Freigabe mit 422 `UNCONFIRMED_FIELDS` ab (`violations[].pointer` = `/fields/<feld>`); die Prüfung läuft in der Freigabetransaktion auf der gesperrten Belegzeile, eine parallele Feldkorrektur auf der alten Revision ergibt 412.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
  /v1/expenses/{expense_id}:
    get:
      summary: Beleg mit Feldstand lesen
      operationId: getExpense
      security:
      - oidc:
        - receipts:read
      description: 'Liefert den Beleg (Herkunftskanal, Belegart, Eingangszeit, Original-Metadaten, Integritätszustand), den aktuellen Feldstand und die Freigabehindernisse (`blockers`). Sichtbar für den Erfasser und die Finanzrolle; fremde Mandanten und andere Akteure: 404. Die Revision steht als starker ETag (`If-Match` bei Änderungen).'
      parameters:
      - $ref: common.yaml#/components/parameters/expense_id
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    patch:
      summary: Belegfelder korrigieren oder OCR-Vorschläge bestätigen
      operationId: correctExpense
      security:
      - oidc:
        - receipts:write
      description: 'Setzt Belegfelder (`fields`) und/oder bestätigt OCR-Vorschläge unverändert (`confirm`); jede Änderung erzeugt genau eine neue, unveränderliche Revision mit Bearbeiter, Zeitpunkt, Grund sowie Alt- und Neuwert je Feld. Das Original wird nie verändert. `If-Match` ist Pflicht (428 ohne, 412 bei veralteter Revision; bei parallelen Korrekturen derselben Revision gewinnt genau eine). Ein Beleg in Quarantäne oder mit Integritätsverletzung ist nicht bearbeitbar (409), ein freigegebener oder gebuchter Beleg ist unveränderlich (409 `IMMUTABLE_RECORD`, Korrektur nur per Gegenereignis). Ein Wert, der dem aktuellen Stand entspricht, ist 422. Mit `cost_assignment` (statt `fields`/`confirm`, nicht kombinierbar: 422) wird die Kostenzuordnung des Belegs ersetzt (WP-M4-29): Kostenstellen und Fahrzeug-Kostenobjekte (`cost_object_ids`) bzw. Fahrzeuge (`vehicle_ids`) desselben Rechtsträgers wie der Beleg; die Finanzrolle ordnet Kostenstellen und Fahrzeuge zu, der Erfasser nur Fahrzeuge. Fremde, nicht sichtbare oder nicht erlaubte Kennungen ergeben 404 ohne Existenzhinweis, ein Kostenobjekt eines anderen Rechtsträgers oder ein inaktives 422. Eine geänderte Zuordnung erzeugt eine neue Revision; dieselbe Menge ändert nichts.'
      parameters:
      - $ref: common.yaml#/components/parameters/expense_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCorrection'
  /v1/cost-objects:
    get:
      summary: Zuordenbare Kostenobjekte lesen
      operationId: listCostObjects
      security:
      - oidc:
        - receipts:read
      description: 'Kostenstellen und Fahrzeug-Kostenobjekte des Mandanten, die der Benutzer einem Beleg zuordnen darf (WP-M4-29; Pfad abweichend vom Planungsvorschlag `/v1/cost-events/...`, weil `/v1/cost-events/{id}` für Kostenereignisse reserviert bleibt). Nur erlaubte Objekte sind sichtbar: Kostenstellen mit Dienstbezug nur im Dienstscope, ohne Finanzrolle nur Fahrzeuge. Sortiert nach Kennung, Cursor-Seiten.'
      parameters:
      - name: kind
        in: query
        required: false
        schema:
          type: string
          enum:
          - VEHICLE
          - COST_CENTER
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostObjectPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/expenses/{expense_id}/revisions:
    get:
      summary: Revisionen eines Belegs lesen
      operationId: listExpenseRevisions
      security:
      - oidc:
        - receipts:read
      description: 'Alle Revisionen ab 1 aufsteigend: je Feld Alt- und Neuwert, Bearbeiter, Zeitpunkt, Grund; bei OCR-Feldern der unveränderte Vorschlag. Revision 1 ist die Anlage ohne Feldwerte. Sichtbarkeit wie `getExpense`.'
      parameters:
      - $ref: common.yaml#/components/parameters/expense_id
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseRevisionList'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/expenses/{expense_id}/hints/{hint_id}/acknowledgement:
    post:
      summary: Plausibilitätshinweis quittieren
      operationId: acknowledgeExpenseHint
      security:
      - oidc:
        - expenses:review
      description: 'Quittiert einen offenen Plausibilitätshinweis (Tankvolumen, Literpreis, Kilometerabstand, Tankkarten-ID) der aktuellen Belegrevision mit Begründung (3 bis 1000 Zeichen, sonst 422). Die Quittierung ist ein eigener, unveränderlicher Eintrag mit Akteur und Zeit (Audit `finance.hint.acknowledged`); der Hinweis und die erfassten Werte des Belegs bleiben unverändert. `If-Match` trägt die Belegrevision (veraltet 412, fehlend 428); ein Hinweis einer früheren Revision ist 409 (er wird in der aktuellen Revision neu geprüft), ein bereits freigegebener oder gebuchter Beleg 409 `IMMUTABLE_RECORD`. Recht: Scope `expenses:review` und Finanzrolle (dasselbe Recht wie die Sachprüfung, Planungsannahme bis zur Rollenfestlegung in WP-M4-34); ohne Recht 403. Parallele Quittierungen desselben Hinweises ergeben genau einen Eintrag; die Wiederholung liefert den unveränderten Stand. Fremde Mandanten und unbekannte Hinweise: 404. Ein nicht quittierter Hinweis blockiert die Freigabe (422 `HINT_NOT_ACKNOWLEDGED`).'
      parameters:
      - $ref: common.yaml#/components/parameters/expense_id
      - name: hint_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Hinweis-ID (`hints[].id` des Belegs).
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HintAcknowledgementRequest'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/expenses/{expense_id}/duplicates/{candidate_id}/decision:
    post:
      summary: Dublettentreffer entscheiden
      operationId: decideExpenseDuplicate
      security:
      - oidc:
        - expenses:review
      description: 'Entscheidet einen offenen Dublettentreffer (WP-M4-32): `GLEICHE_EVIDENZ` = der neuere Beleg ist weitere Evidenz des Vorgangs des älteren (Verknüpfung zum Kostenereignis, sobald es besteht; der Beleg wird nie eigener Kostenfall), `EIGENER_VORGANG` = der neuere Beleg bleibt ein eigener Kostenfall. Kein Beleg wird gelöscht oder zusammengeführt. Sichere Treffer (identischer Dateihash oder vollständig gleiche Fachdaten) entstehen bereits als `GLEICHE_EVIDENZ` und sind nicht entscheidbar. Die Freigabe eines Belegs mit offenem Treffer ist 409 `DUPLICATE_REVIEW_REQUIRED`, die eines Belegs, der Evidenz eines anderen Vorgangs ist, 409 `DUPLICATE_EVIDENCE_LINKED`. `If-Match` trägt die Revision des Belegs aus dem Pfad (veraltet 412, fehlend 428). Recht: Scope `expenses:review` und Finanzrolle; ohne Recht 403; Begründung 3 bis 1000 Zeichen, sonst 422. Dieselbe Entscheidung wiederholt liefert den unveränderten Stand, eine andere Entscheidung auf einen entschiedenen Treffer 409. Fremde Mandanten und unbekannte Treffer: 404.'
      parameters:
      - $ref: common.yaml#/components/parameters/expense_id
      - name: candidate_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Treffer-ID (`duplicates[].id` des Belegs).
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateDecisionRequest'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/expenses/{expense_id}/original:
    get:
      summary: Belegoriginal abrufen
      operationId: getExpenseOriginal
      security:
      - oidc:
        - receipts:read
      description: 'Liefert das Original byteweise unverändert, nur wenn die Quarantäneprüfung bestanden ist (sonst 404). Vor der Auslieferung wird der Hash geprüft: eine Abweichung oder ein fehlendes Objekt ergibt 409 `DOCUMENT_INTEGRITY_VIOLATION` und einen Integritätsvorfall. Die Auslieferung über eine signierte, kurzlebige URL des Objektspeichers ist nicht ausgeführt (kein Objektspeicher-Adapter); die Antwort enthält die Bytes direkt.'
      parameters:
      - $ref: common.yaml#/components/parameters/expense_id
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    ExpenseVatAmount:
      type: object
      additionalProperties: false
      properties:
        vat_rate_pct:
          type: string
          pattern: ^[0-9]{1,2}(\.[0-9]{1,2})?$
          description: Mehrwertsteuersatz in Prozent als Dezimalstring.
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Mehrwertsteuerbetrag in kleinster Einheit.
      required:
      - vat_rate_pct
      - amount_minor
    ExpenseFieldValues:
      type: object
      additionalProperties: false
      description: Belegfelder in Normalform. Nicht erfasste Felder fehlen.
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Bruttobetrag in kleinster Einheit.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        document_date:
          type: string
          format: date
        merchant:
          type: string
          minLength: 1
          maxLength: 200
        document_number:
          type: string
          minLength: 1
          maxLength: 100
        vat_amounts:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/ExpenseVatAmount'
        net_amount_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Nettobetrag in kleinster Einheit; Netto + Mehrwertsteuer muss dem Brutto entsprechen, sonst ist der Beleg nicht freigabefähig (`SUM_MISMATCH`).
    ExpenseFieldName:
      type: string
      enum:
      - amount_minor
      - currency
      - document_date
      - merchant
      - document_number
      - vat_amounts
      - net_amount_minor
    ExpenseCorrection:
      type: object
      additionalProperties: false
      description: Entweder `fields`/`confirm` (mindestens eines, dann ist `reason` Pflicht), `cost_assignment` oder `fuel` (Tankwerte, WP-M4-30); die drei Arten sind nicht kombinierbar. Ein Feld in `fields` muss vom aktuellen Stand abweichen; `confirm` bestätigt den OCR-Vorschlag unverändert.
      properties:
        cost_assignment:
          $ref: '#/components/schemas/ExpenseCostAssignment'
        fuel:
          $ref: '#/components/schemas/FuelCapture'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        fields:
          $ref: '#/components/schemas/ExpenseFieldValues'
        confirm:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ExpenseFieldName'
    DuplicateDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        decision:
          type: string
          enum:
          - GLEICHE_EVIDENZ
          - EIGENER_VORGANG
        reason:
          type: string
          minLength: 3
          maxLength: 1000
      required:
      - decision
      - reason
    ExpenseDuplicate:
      type: object
      additionalProperties: false
      description: 'Dublettentreffer (WP-M4-32). `role` = Sicht des Belegs (NEWER: er wird Evidenz oder blockiert, OLDER: Gegenüber). `other_document_id`, `basis` und `other` (Gegenüberstellung) sieht nur die Finanzrolle.'
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        role:
          type: string
          enum:
          - NEWER
          - OLDER
        other_document_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        match:
          type: string
          enum:
          - HASH
          - FACTS
        certainty:
          type: string
          enum:
          - SAFE
          - POSSIBLE
        score:
          type: integer
          minimum: 0
          maximum: 100
        basis:
          oneOf:
          - type: object
            description: Trefferregel, Schwelle, übereinstimmende und abweichende Felder.
          - type: 'null'
        state:
          type: string
          enum:
          - OFFEN
          - GLEICHE_EVIDENZ
          - EIGENER_VORGANG
        detected_at:
          type: string
          format: date-time
        decided_by:
          oneOf:
          - type: string
          - type: 'null'
        decided_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        reason:
          oneOf:
          - type: string
          - type: 'null'
        other:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/ExpenseDuplicateFacts'
      required:
      - id
      - role
