    ExpensePlausibilityNote:
      type: object
      additionalProperties: false
      description: Vermerk zu einer nicht prüfbaren Regel. `PARAMETER_MISSING` = der Parameter ist nicht konfiguriert (die Regel gilt nie stillschweigend als bestanden), `NO_COMPARISON_BASIS` = kein Vergleichswert (z. B. kein Vorgänger-Kilometerstand).
      properties:
        rule:
          type: string
          enum:
          - FUEL_VOLUME
          - FUEL_PRICE
          - FUEL_ODOMETER_GAP
          - FUEL_CARD_MISMATCH
        code:
          type: string
          enum:
          - PARAMETER_MISSING
          - NO_COMPARISON_BASIS
        text:
          type: string
      required:
      - rule
      - code
      - text
    FuelCapture:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Tankwerte eines Belegs der Art FUEL_RECEIPT. Gesetzt wird, was angegeben ist; die übrigen Werte bleiben. Menge und Preis sind Dezimalstrings (nie JSON-Zahlen, nie Gleitkomma), positiv, höchstens 8 Nachkommastellen. Der Bruttobetrag ist das Belegfeld `amount_minor`. Die Einheit folgt der Kraftstoffart (ELECTRIC = kWh, sonst Liter).
      properties:
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        fuel_type:
          type: string
          enum:
          - PETROL
          - DIESEL
          - LPG
          - ELECTRIC
        quantity:
          type: string
          pattern: ^[0-9]{1,12}(\.[0-9]{1,8})?$
        unit_price:
          type: string
          pattern: ^[0-9]{1,12}(\.[0-9]{1,8})?$
        odometer_km:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
        fueled_at:
          type: string
          format: date-time
        card_id:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,64}$
    FuelData:
      type: object
      additionalProperties: false
      properties:
        vehicle_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        fuel_type:
          oneOf:
          - type: string
            enum:
            - PETROL
            - DIESEL
            - LPG
            - ELECTRIC
          - type: 'null'
        quantity:
          oneOf:
          - type: string
            pattern: ^[0-9]{1,12}(\.[0-9]{1,8})?$
          - type: 'null'
        unit:
          oneOf:
          - type: string
            enum:
            - LITER
            - KWH
          - type: 'null'
        unit_price:
          oneOf:
          - type: string
            pattern: ^[0-9]{1,12}(\.[0-9]{1,8})?$
          - type: 'null'
        gross_minor:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
          description: Spiegel des Belegfelds `amount_minor`.
        currency:
          oneOf:
          - type: string
            pattern: ^[A-Z]{3}$
          - type: 'null'
        odometer_km:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
            maximum: 10000000
          - type: 'null'
        fueled_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        card_id:
          oneOf:
          - type: string
          - type: 'null'
        missing:
          type: array
          description: Fehlende Pflichtwerte einzeln (Kraftstoffart, Menge, Preis je Einheit, Kilometerstand, Fahrzeug); solange `fuel_receipt_required` gilt, ist der Beleg dann nicht freigabefähig.
          items:
            type: string
            enum:
            - vehicle_id
            - fuel_type
            - quantity
            - unit_price
            - odometer_km
        complete:
          type: boolean
      required:
      - vehicle_id
      - fuel_type
      - quantity
      - unit
      - unit_price
      - gross_minor
      - currency
      - odometer_km
      - fueled_at
      - card_id
      - missing
      - complete
