      description: 'Endgültige Freigabe (WP-M4-34). Erste Freigabe (Budgetfreigabe) eines fachlich geprüften Belegs (`REVIEWED`): bei einem Betrag größer als die Schwelle `approval_stage_thresholds` wartet der Beleg auf die zweite Person (Antwort `WAITING_SECOND_APPROVAL`, `posting_id` null; ein Betrag exakt auf der Schwelle löst sie nicht aus), sonst entsteht das Kostenereignis (`POSTED`, `posting_id`). Zweite Freigabe: eine andere Person als Erfasser und Erstfreigeber (403), dann `POSTED`. Ohne Recht (Scope `expenses:approve`, Finanzrolle, Mensch) 403 ohne Schritteintrag. `validated_document_revision` = exakte Dokumentrevision, `If-Match` ebenso (veraltet 412, fehlend 428). Je Blockade ein eigener Code: 409 `DOCUMENT_INTEGRITY_VIOLATION`, `DUPLICATE_REVIEW_REQUIRED`, `DUPLICATE_EVIDENCE_LINKED`; 422 `UNCONFIRMED_FIELDS`, `COST_ASSIGNMENT_REQUIRED`, `FUEL_FIELDS_MISSING`, `SPLIT_INCOMPLETE`, `HINT_NOT_ACKNOWLEDGED`. Gleicher `Idempotency-Key` mit gleichem Inhalt liefert die gespeicherte Antwort und bucht nicht erneut, mit anderem Inhalt 409 `IDEMPOTENCY_CONFLICT`. Ein bereits freigegebener oder gebuchter Beleg: 409. POSTED
        erst nach atomarem Journal+Outbox-Commit. Dublettenkandidat blockiert mit 409 DUPLICATE_REVIEW_REQUIRED. Solange ein Pflichtfeld nicht bestätigt oder korrigiert ist, ein markierter OCR-Vorschlag (niedrige Konfidenz, Summenabweichung) unentschieden bleibt oder Netto + Steuer ≠ Brutto gilt, weist die Freigabe mit 422 `UNCONFIRMED_FIELDS` ab (`violations[].pointer` = `/fields/<feld>`); die Prüfung läuft in der Freigabetransaktion auf der gesperrten Belegzeile, eine parallele Feldkorrektur auf der alten Revision ergibt 412.'
