paths:
  /v1/rosters/{roster_id}/publish:
    post:
      summary: Geprüften Dienstplan veröffentlichen
      operationId: publishRoster
      security:
      - oidc:
        - rosters:publish
      parameters:
      - $ref: common.yaml#/components/parameters/roster_id
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: common.yaml#/components/schemas/PublishedRevision
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
      description: Ruhezeit, Qualifikation, Abwesenheit, Doppelbelegung und Fahrzeugfreigabe serverseitig prüfen. Publikation
        einer neuen Revision, kein Überschreiben der alten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common.yaml#/components/schemas/PublishRequest
