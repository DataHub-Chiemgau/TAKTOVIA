          $ref: common.yaml#/components/schemas/UUID
        description: Evidenz-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectEvidenceLink'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/objects/{tenant_id}/{object_name}:
    get:
      summary: Objekt über signierten Link abrufen
      operationId: readSignedObject
      security:
      - oidc:
        - defects:read
      description: 'Liefert das Objekt zu einem signierten Link (Parameter `exp`,
        `purpose`, `sig`). Ungültige, abgelaufene oder mandantenfremde Links sind
        nicht von einem fehlenden Objekt zu unterscheiden: 404.'
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Mandant im Objektschlüssel.
      - name: object_name
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,200}$
        description: Objektname ohne Mandantenpräfix.
      - name: exp
        in: query
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        description: Ablauf (Unix-Sekunden).
      - name: purpose
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,40}$
        description: Zweck der Signatur.
      - name: sig
        in: query
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
        description: Signatur (HMAC-SHA256, hexadezimal).
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/defects/{defect_id}/transitions:
    post:
      summary: Statusübergang der Schadenakte
      operationId: transitionDefect
      security:
      - oidc:
        - defects:state
      description: 'Führt einen Übergang nach der Tabelle in `zustaende/defect_case.md`
        aus (DMG-007). Nicht in der Tabelle, aus einem Endzustand ohne dokumentierte
        Wiedereröffnung oder Vorbedingung verletzt: 409 `INVALID_STATE_TRANSITION`,
        auch bei direktem API-Aufruf. `DISMISSED` und Wiedereröffnung verlangen `reason`
        (422 mit Feldverweis). Ohne Rolle für den Übergang: 403; fremde Akte: 404;
        ohne `If-Match`: 428; veraltet: 412. `CLOSED` und `DISMISSED` heben eine Sperre
        des Fahrzeugs nie auf (nur die Wiederfreigabe).'
      parameters:
      - name: defect_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Schadenakten-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defect'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefectTransition'
  /v1/defects/{defect_id}/status-history:
    get:
      summary: Statushistorie der Schadenakte
      operationId: listDefectStatusHistory
      security:
      - oidc:
        - defects:state
      description: 'Append-only Historie der Statusübergänge mit Akteur und Zeit (Disposition,
        Werkstatt, Betriebsleitung); Fahrer: 403, fremde Akte: 404.'
      parameters:
      - name: defect_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Schadenakten-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectStatusHistoryPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/defects/{defect_id}/amendments:
    post:
      summary: Nachtrag zur Schadenmeldung
      operationId: amendDefect
      security:
      - oidc:
        - defects:write
      description: 'Legt eine neue Version der Meldung an (DMG-008): Autor, Zeit und
        Änderungsgrund (`change_reason`, Pflicht) werden festgehalten, frühere Fassungen
        und Anhänge bleiben unverändert erhalten. Anhänge hinzufügen (`add_evidence_ids`)
        und ersetzen (`replace_evidence`, der ersetzte bleibt als frühere Version
        erhalten). Gleichzeitige Nachträge werden fortlaufend versioniert. Ohne Grund
        oder ohne Änderung: 422; fremde Akte: 404; Fahrer nur eigene Akten.'
      parameters:
      - name: defect_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Schadenakten-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Defect'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DefectAmendment'
  /v1/defects/{defect_id}/history:
    get:
      summary: Versionsverlauf der Schadenmeldung
      operationId: listDefectHistory
      security:
      - oidc:
        - defects:history
      description: 'Alle Fassungen der Meldung samt Anhängen, älteste zuerst, nur
        für berechtigte Prüfer (Werkstatt, Betriebsleitung); der Lesezugriff wird
        im Audit protokolliert. Ohne Prüferrolle: 403, fremde Akte: 404.'
      parameters:
      - name: defect_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Schadenakten-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectRevisionPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/defects/{defect_id}/as-of:
    get:
      summary: Stand der Schadenmeldung zu einem Zeitpunkt
      operationId: getDefectAsOf
      security:
      - oidc:
        - defects:history
      description: 'Gültige Fassung, damals sichtbare Anhänge und Status zum Zeitpunkt
        `at`; vor der Meldung: 404. Nur für berechtigte Prüfer, protokolliert im Audit.'
      parameters:
      - name: defect_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Schadenakten-ID.
      - name: at
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2026-12-01T10:00:00Z'
        description: Zeitpunkt (mit UTC-Offset), zu dem der Stand der Meldung gelesen
          wird.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefectAsOf'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    CommittedRide:
      type: object
      additionalProperties: false
      description: Zugesagte Fahrt, die nach dem Ende einer Dienstzuordnung liegt
        (Hinweis an die Leitstelle).
      properties:
        booking_id:
          $ref: common.yaml#/components/schemas/UUID
        state:
          type: string
          maxLength: 40
        pickup_earliest:
          type: string
          format: date-time
        pickup_latest:
          type: string
          format: date-time
      required:
      - booking_id
      - state
      - pickup_earliest
      - pickup_latest
    VehicleServiceAssignmentCreate:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        service_area_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Bediengebiet des Dienstes (eine Revision der Gebietskette);
            ohne Angabe gilt keine geografische Einschränkung.
        valid_from:
          type: string
          format: date-time
        valid_to:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Ende (exklusiv); ohne Angabe unbegrenzt.
      required:
      - service_id
      - valid_from
    VehicleServiceAssignmentEnd:
      type: object
      additionalProperties: false
      properties:
        valid_to:
          type: string
          format: date-time
          description: Ende der Zuordnung (exklusiv); nicht vor dem Beginn, nicht
            in der Vergangenheit.
      required:
      - valid_to
    VehicleServiceAssignment:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        service_area_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        valid_from:
          type: string
          format: date-time
        valid_to:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        revision:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        committed_rides_after_end:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/CommittedRide'
          description: Nur bei beendeten Zuordnungen; leer, wenn keine zugesagte Fahrt
            nach dem Ende liegt.
      required:
      - id
      - vehicle_id
      - service_id
      - service_area_id
      - valid_from
      - valid_to
      - revision
      - created_at
      - committed_rides_after_end
    VehicleServiceAssignmentPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VehicleServiceAssignment'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
    VehicleOperationalState:
      type: string
      description: Betriebszustand des Fahrzeugs aus Sicht der Leitstelle (Zustandsautomat
        fahrzeug_dienststatus.md, abgeleitet aus Sperren, Einsatzfreigabe und Dienststatus).
      enum:
      - NOT_READY
      - RELEASE_PENDING
      - AVAILABLE
      - EN_ROUTE
      - WAITING
      - BREAK
      - DISRUPTED
      - BLOCKED
      - RESTRICTED
      - ENDED
    MissingRequirement:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - NO_INSPECTION
          - INSPECTION_OPEN
          - INSPECTION_EXPIRED
          - DEFECT_BLOCK
          - OPERATIONAL_BLOCK
          - SAFETY_REVISION_CHANGED
          - QUALIFICATION_MISSING
          - VEHICLE_CHANGED
          - RELEASE_REVOKED
        inspection_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        step_codes:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 64
      required:
      - code
      description: Eine noch fehlende Voraussetzung der Einsatzfreigabe (LH-6.21-CHK-001);
        keine Diagnosetexte, nur Codes.
    VehicleBlock:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        source:
          type: string
          enum:
          - OPERATIONS
          - SAFETY
        reason_code:
          type: string
          enum:
          - OPERATIONAL_DISRUPTION
          - DEFECT_CRITICAL
          - INSPECTION_FAILED
          - MANUAL
          - OTHER
        set_at:
          type: string
          format: date-time
        set_by:
          type: string
          minLength: 1
          maxLength: 200
        lifted_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        lifted_by:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - vehicle_id
      - source
      - reason_code
      - set_at
      - set_by
      - lifted_at
      - lifted_by
      - revision
      description: Sperrgrund je Quelle (OP-01); eine operative Aufhebung ändert eine
        sicherheitskritische Sperre nie.
    OperatorVehicle:
      type: object
      additionalProperties: false
      properties:
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_label:
          type: string
          minLength: 1
          maxLength: 64
        operational_state:
          $ref: '#/components/schemas/VehicleOperationalState'
        safety_revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        release_valid_until:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        missing_requirements:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/MissingRequirement'
        active_blocks:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/VehicleBlock'
        position:
          oneOf:
          - $ref: common.yaml#/components/schemas/Point
          - type: 'null'
        position_measured_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        position_received_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Serverempfangszeit der letzten Position (Serveruhr), getrennt
            von der Gerätemesszeit `position_measured_at`.
        position_age_seconds:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        position_stale:
          type: boolean
        open_defect_count:
          type: integer
          minimum: 0
        current_run_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - vehicle_id
      - vehicle_label
      - operational_state
      - safety_revision
      - release_valid_until
      - missing_requirements
      - active_blocks
      - position
      - position_measured_at
      - position_age_seconds
      - position_stale
      - open_defect_count
      - current_run_id
      - revision
      description: Fahrzeug in der Leitstellenansicht (OPS-001, CHK-016). Das Standortalter
        berechnet der Server aus `measured_at` (Messzeit) und seiner Uhr; `position_stale`
        folgt dem Parameter `position_stale_after_sec` (OP-04, Annahme 30 s). Ohne
        bekannte Position ist `position` null und `position_stale` wahr; die letzte
        gemessene Position bleibt nach Überschreiten der Schwelle sichtbar und wird
        nie extrapoliert (AT-10). Bis WP-M3-08/-31/-36 tragen `release_valid_until`,
        `missing_requirements`, `active_blocks`, `open_defect_count` und `current_run_id`
        noch keine Werte und `operational_state` leitet sich nur aus der Sperrkennung
        ab.
    OperatorVehiclePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OperatorVehicle'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
    VehicleBlockCreate:
      type: object
      additionalProperties: false
      properties:
        reason_code:
          type: string
          enum:
          - OPERATIONAL_DISRUPTION
          - MANUAL
          - OTHER
        comment:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason_code
      description: Operative Sperre durch die Leitstelle (OPS-005). Sicherheitskritische
        Sperren setzt nur der Server (Mangel, Schaden), nie dieser Endpunkt; die Quelle
        `OPERATIONS` steht fest.
    VehicleBlockLift:
      type: object
      additionalProperties: false
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 500
      description: Aufhebung einer operativen Sperre; eine Sperre der Quelle SAFETY
        lässt sich hier nie aufheben (409).
    ChecklistTemplate:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        template_id:
          $ref: common.yaml#/components/schemas/UUID
        version:
          type: integer
          minimum: 1
        vehicle_class:
          type: string
          minLength: 1
          maxLength: 64
        service_mode:
          type: string
          minLength: 1
          maxLength: 64
        published_at:
          type: string
          format: date-time
        steps:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            properties:
              step_code:
                type: string
                minLength: 1
                maxLength: 64
              title:
                type: string
                minLength: 1
                maxLength: 200
              mandatory:
                type: boolean
              safety_critical:
                type: boolean
              answer_kind:
                type: string
                enum:
                - OK_DEFECT_NA
                - NUMBER
                - TEXT_SHORT
              photo_required_on_defect:
                type: boolean
              help_text:
                oneOf:
                - type: string
                - type: 'null'
              na_requires_reason:
                type: boolean
              number_min:
                oneOf:
                - type: number
                - type: 'null'
              number_max:
                oneOf:
                - type: number
                - type: 'null'
              number_unit:
                oneOf:
                - type: string
                - type: 'null'
              has_example_image:
                type: boolean
            required:
            - step_code
            - title
            - mandatory
            - safety_critical
            - answer_kind
            - photo_required_on_defect
      required:
      - id
      - template_id
      - version
      - vehicle_class
      - service_mode
      - published_at
      - steps
      description: Freigegebene, unveränderliche Vorlagenrevision (CHK-002).
    ChecklistTemplatePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistTemplate'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
    InspectionAnswer:
      type: object
      additionalProperties: false
      properties:
        step_code:
          type: string
          minLength: 1
          maxLength: 64
        answer:
          type: string
          enum:
          - OK
          - DEFECT
          - NOT_APPLICABLE
          - NOT_CHECKABLE
        number_value:
          oneOf:
          - type: number
          - type: 'null'
        note:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 500
          - type: 'null'
        evidence_ids:
          type: array
          maxItems: 10
          items:
            $ref: common.yaml#/components/schemas/UUID
        answered_at:
          type: string
          format: date-time
      required:
      - step_code
      - answer
      - answered_at
