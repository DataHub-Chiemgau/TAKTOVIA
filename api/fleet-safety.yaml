        reject_reason:
          oneOf:
          - type: string
            enum:
            - EXPIRED
            - OBJECT_MISSING
            - SIZE_MISMATCH
            - HASH_MISMATCH
            - MIME_MISMATCH
            - SIZE_LIMIT
            - MALWARE
            - MEDIA_INVALID
          - type: 'null'
        defect_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        confidentiality:
          type: string
          enum:
          - STANDARD
          - CONFIDENTIAL
          description: Vertraulichkeitsstufe des Dokuments (DMG-011). `CONFIDENTIAL`
            sehen nur Werkstatt, Betriebsleitung und der Urheber; für alle anderen
            ist das Dokument nicht vorhanden (404, kein Zähler). Fehlt das Feld, gilt
