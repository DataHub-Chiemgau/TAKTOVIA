          - type: string
            format: date-time
          - type: 'null'
        received_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        template:
          type: object
          additionalProperties: false
          description: Die feste Vorlagenrevision des Laufs mit allen Prüfschritten in
            Reihenfolge (Anzeige „Prüfung n / step_count“). Bleibt auch nach einer späteren
            Vorlagenfreigabe unverändert.
          properties:
            template_revision_id:
              $ref: common.yaml#/components/schemas/UUID
            template_id:
              $ref: common.yaml#/components/schemas/UUID
            version:
              type: integer
              minimum: 1
            vehicle_class:
              type: string
            service_mode:
              type: string
            step_count:
              type: integer
              minimum: 1
            steps:
              type: array
              maxItems: 200
              items:
                type: object
                additionalProperties: false
                properties:
                  step_code:
                    type: string
                  position:
                    type: integer
                    minimum: 1
                  title:
                    type: string
                  mandatory:
                    type: boolean
                  safety_critical:
                    type: boolean
                  answer_kind:
                    type: string
                    enum:
                    - OK_DEFECT_NA
                    - NUMBER
                    - TEXT_SHORT
                  photo_required_on_defect:
                    type: boolean
                  help_text:
                    oneOf:
                    - type: string
                    - type: 'null'
                  na_requires_reason:
                    type: boolean
                  number_min:
                    oneOf:
                    - type: number
                    - type: 'null'
                  number_max:
                    oneOf:
                    - type: number
                    - type: 'null'
                  number_unit:
                    oneOf:
                    - type: string
                    - type: 'null'
                  has_example_image:
                    type: boolean
                required:
                - step_code
                - position
                - title
                - mandatory
                - safety_critical
                - answer_kind
          required:
