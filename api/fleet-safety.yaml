paths:
  /v1/operator/vehicles:
    get:
      summary: Fahrzeuge der Leitstelle mit Zustand, Standortalter und Prüfstatus
      operationId: listOperatorVehicles
      security:
      - oidc:
        - operator:read
      description: Listenform {items,next_cursor,as_of} (Kap. 05 §5.1). Filter `state`,
        `depot_id` (in M3 nicht unterstützt, dann 422; kein Betriebshofbezug am Fahrzeug,
        OP-22). Fremdmandanten sind nie sichtbar. Der Standort trägt `measured_at`
        und `position_age_seconds`; ab `position_stale_after_sec` ist `position_stale`
        wahr (OP-04).
      parameters:
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/VehicleOperationalState'
        description: Nur Fahrzeuge in diesem Betriebszustand.
      - name: depot_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Nur Fahrzeuge dieses Betriebshofs (OP-22).
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorVehiclePage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/operator/vehicles/{vehicle_id}/blocks:
    post:
      summary: Operative Fahrzeugsperre setzen
      operationId: createVehicleBlock
      security:
      - oidc:
        - operator:write
      description: 'Setzt eine Sperre der Quelle OPERATIONS und erhöht `safety_revision`
        im selben Commit; das Fahrzeug ist danach nicht mehr Kandidat neuer Zuweisungen
        (OPS-005). If-Match: Revision des Fahrzeugs (`OperatorVehicle.revision`).
        Fremdes Fahrzeug: 404. Wiederholter Schlüssel mit anderem Inhalt: 409 IDEMPOTENCY_CONFLICT.'
      parameters:
      - name: vehicle_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Fahrzeug-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '201':
          description: Angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleBlock'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleBlockCreate'
  /v1/operator/vehicles/{vehicle_id}/blocks/{block_id}/lift:
    post:
      summary: Operative Fahrzeugsperre aufheben
      operationId: liftVehicleBlock
      security:
      - oidc:
        - operator:write
      description: 'Hebt nur eine Sperre der Quelle OPERATIONS auf; eine Sperre der
        Quelle SAFETY ergibt 409 INVALID_STATE_TRANSITION (Aufhebung nur über `createVehicleRelease`).
        If-Match: Revision der Sperre.'
      parameters:
      - name: vehicle_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Fahrzeug-ID.
      - name: block_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Sperr-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleBlock'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleBlockLift'
  /v1/checklist-templates:
    get:
      summary: Freigegebene Checklistenvorlagen lesen
      operationId: listChecklistTemplates
      security:
      - oidc:
        - inspections:read
      description: Nur freigegebene Revisionen, optional gefiltert nach Fahrzeugklasse
        und Bedienart (CHK-002, Ergänzungsvorschlag zu OP-14). Die App cached die
        Revision, die der Prüflauf verwendet.
      parameters:
      - name: vehicle_class
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: Fahrzeugklasse.
      - name: service_mode
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: Bedienart.
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTemplatePage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/operator/checklist-templates:
    get:
      summary: Checklistenvorlagen verwalten – Revisionen auflisten
      operationId: listChecklistTemplateRevisions
      security:
      - oidc:
        - checklists:read
      description: 'Alle Revisionen der Checklistenvorlagen des Mandanten (Entwurf,
        freigegeben, abgelöst), optional nach Zustand, Fahrzeugklasse und Bedienart
        gefiltert (WP-M3-10, LH-6.21-CHK-003; UI-11). Ungültiger Zustand: 422.'
      parameters:
      - name: state
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ChecklistTemplateState'
        description: Zustand der Revision.
      - name: vehicle_class
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: Fahrzeugklasse.
      - name: service_mode
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: Bedienart.
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTemplateRevisionPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Checklistenvorlage als Entwurf anlegen
      operationId: createChecklistTemplate
      security:
      - oidc:
        - checklists:write
      description: Legt eine neue Vorlage (Version 1) als Entwurf an. Jedes Prüfelement
        braucht Titel, Eingabetyp und Pflichtstatus; fehlt eines davon, ist der Wert
        ungültig oder der Schlüssel doppelt, ist die Vorlage nicht speicherbar (422
        mit Feldverweis `/steps/<n>/<feld>`, CHK-003). Der Hilfetext ist optional
        (OP, im Fachreview zu bestätigen). Der Mandant folgt aus der Sitzung.
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '201':
          description: Angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTemplateRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision der Vorlagenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistTemplateWrite'
  /v1/operator/checklist-templates/{checklist_revision_id}:
    get:
      summary: Vorlagenrevision lesen
      operationId: getChecklistTemplateRevision
      security:
      - oidc:
        - checklists:read
      description: 'Eine Vorlagenrevision mit allen Prüfelementen und starkem ETag.
        Fremde oder unbekannte Revision: 404.'
      parameters:
      - name: checklist_revision_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: ID der Vorlagenrevision.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTemplateRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision der Vorlagenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    put:
      summary: Entwurf einer Vorlagenrevision ändern
      operationId: updateChecklistTemplateDraft
      security:
      - oidc:
        - checklists:write
      description: 'Ersetzt Name, Fahrzeugklasse, Bedienart und Prüfelemente eines
        **Entwurfs**. Beispielbilder bleiben je Schlüssel erhalten. Eine freigegebene
        oder abgelöste Revision ist unveränderlich: 409 `IMMUTABLE_RECORD`; die Änderung
        erfolgt über eine neue Revision. If-Match: Revision der Vorlagenrevision;
        ohne 428, veraltet 412.'
      parameters:
      - name: checklist_revision_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: ID der Vorlagenrevision.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTemplateRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision der Vorlagenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistTemplateWrite'
  /v1/operator/checklist-templates/{checklist_revision_id}/revisions:
    post:
      summary: Neue Revision aus einer freigegebenen Revision anlegen
      operationId: createChecklistTemplateRevision
      security:
      - oidc:
        - checklists:write
      description: 'Legt aus einer freigegebenen oder abgelösten Revision einen neuen
        Entwurf (Version + 1, Prüfelemente und Beispielbilder kopiert) an. If-Match:
        Revision der Quelle; ohne 428, veraltet 412. Besteht für die Vorlage schon
        ein Entwurf, oder ist die Quelle selbst ein Entwurf: 409. Fremde Revision:
        404.'
      parameters:
      - name: checklist_revision_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: ID der Vorlagenrevision.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '201':
          description: Angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTemplateRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision der Vorlagenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/operator/checklist-templates/{checklist_revision_id}/publish:
    post:
      summary: Vorlagenrevision freigeben
      operationId: publishChecklistTemplateRevision
      security:
      - oidc:
        - checklists:write
      description: 'Gibt den Entwurf nach dem Vier-Augen-Prinzip frei: der Freigebende
        ist nie der Ersteller (403) und immer ein Mensch. Die bisher wirksame Revision
        der Vorlage wird abgelöst; es gibt je Vorlage genau eine wirksame Revision.
        Bei gleichzeitigen Freigaben derselben Revision gewinnt genau eine, die andere
        erhält 409. Ohne Prüfelement 422. If-Match: Revision der Vorlagenrevision;
        ohne 428, veraltet 412.'
      parameters:
      - name: checklist_revision_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: ID der Vorlagenrevision.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTemplateRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision der Vorlagenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/operator/checklist-templates/{checklist_revision_id}/steps/{step_code}/example-image:
    put:
      summary: Beispielbild eines Prüfelements setzen
      operationId: putChecklistStepExampleImage
      security:
      - oidc:
        - checklists:write
      description: 'Legt das Beispielbild (PNG, JPEG oder WebP, höchstens 512 KiB,
        Inhalt Base64) im mandantengetrennten Objektspeicher ab und verknüpft es mit
        dem Prüfelement eines Entwurfs. Andere Medientypen: 415; Inhalt passt nicht
        zum Typ oder zu groß: 422; nicht mehr Entwurf: 409. If-Match: Revision der
        Vorlagenrevision; ohne 428, veraltet 412.'
      parameters:
      - name: checklist_revision_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: ID der Vorlagenrevision.
      - name: step_code
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          minLength: 1
          maxLength: 64
        description: Schlüssel des Prüfelements.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistTemplateRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision der Vorlagenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '415':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistExampleImage'
    get:
      summary: Beispielbild eines Prüfelements lesen
      operationId: getChecklistStepExampleImage
      security:
      - oidc:
        - inspections:read
      description: 'Liefert das Beispielbild des Prüfelements aus dem Objektspeicher
        des eigenen Mandanten (Base64). Ohne Bild, fremde Revision oder fremder Mandant:
        404.'
      parameters:
      - name: checklist_revision_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: ID der Vorlagenrevision.
      - name: step_code
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
          minLength: 1
          maxLength: 64
        description: Schlüssel des Prüfelements.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistExampleImage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/inspections:
    post:
      summary: Prüflauf starten
      operationId: createInspection
      security:
      - oidc:
        - inspections:write
      description: 'Legt einen Prüflauf für genau die Kombination Fahrer (aus dem
        Token), Fahrzeug und Schicht an (WP-M3-13, LH-6.21-CHK-002). Die Vorlagenrevision
        bestimmt allein der Server aus Fahrzeugklasse und Bedienart des Fahrzeugs
        (genau eine freigegebene Revision); `template_revision_id` im Request ist
        wirkungslos. Fremde Schicht oder Schicht eines anderen Fahrers: 404; Schicht
        ohne Dienstanmeldung (nicht angetreten) oder beendet: 409 INVALID_STATE_TRANSITION;
        Fahrzeug nicht das der Schicht: 422. Gibt es keine oder mehrere passende freigegebene
        Vorlagen, entsteht kein Prüflauf, die Freigabe bleibt aus, die Leitstelle erhält
        das Hinweisereignis `inspection.template_unavailable` und die Antwort ist 409 CONFLICT,
        `detail` beginnt mit `TEMPLATE_UNAVAILABLE` (keine) bzw. `TEMPLATE_AMBIGUOUS` (mehrere).
        Ein bereits offener Prüflauf derselben Kombination (Schicht, Fahrzeug, Art; zweites
        Gerät oder anderer Schlüssel) wird unverändert mit 200 geliefert, mit seiner
        ursprünglichen Vorlagenrevision; derselbe `Idempotency-Key` liefert dieselbe Antwort.'
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Für diese Kombination bestand bereits ein offener Prüflauf (unverändert).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inspection'
          headers:
            ETag:
              schema:
                type: string
