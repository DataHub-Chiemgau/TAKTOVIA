paths:
  /v1/services:
    get:
      summary: Dienste auflisten
      operationId: listServices
      security:
      - oidc:
        - services:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Dienstkopf anlegen
      operationId: createService
      security:
      - oidc:
        - services:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
  /v1/services/{service_id}:
    put:
      summary: Dienstkopf ändern
      operationId: updateService
      security:
      - oidc:
        - services:write
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
  /v1/services/{service_id}/configuration:
    get:
      summary: Wirksame Dienstkonfiguration mit Angebotsmodell und Modellregeln lesen
      description: 'Liefert zum Zeitpunkt at (Standard: jetzt) das wirksame Angebotsmodell (Bestandteil der veröffentlichten Dienstrevision), die zugehörigen Modellregeln und die modellabhängigen Werte, aufgelöst über den Konfigurationsport (WP-M1-25). Ohne veröffentlichte Dienstkonfiguration ist offer_model null. Unbekannter oder fremder Dienst: 404. Die Modellregeln sind Planungsannahme PA-01 (OP-28).'
      operationId: getServiceConfiguration
      security:
      - oidc:
        - config:read
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: at
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/Timestamp
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConfiguration'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/service-offer-models:
    get:
      summary: Angebotsmodelle mit Modellregeln auflisten
      description: 'Regeltabelle der drei Angebotsmodelle: je Modell die Pflichtparameter, die unzulässigen und die optionalen Parameter der Dienstrevision (Planungsannahme PA-01, OP-28, nicht fachlich freigegeben). Grundlage der Oberfläche Dienst anlegen.'
      operationId: listServiceOfferModels
      security:
      - oidc:
        - services:read
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOfferModelList'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    OfferModel:
      type: string
      description: Angebotsmodell des Dienstes (Planungsannahme PA-01); entspricht traffic_type der Dienstkonfiguration.
      enum:
      - AREA_ON_DEMAND
      - LINE_ON_DEMAND
      - STATION_FEEDER
    ServiceOfferModelRules:
      type: object
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/OfferModel'
        label:
          type: string
          minLength: 1
          maxLength: 100
        required:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
        forbidden:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
        optional:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
      required:
      - model
      - label
      - required
      - forbidden
      - optional
    ServiceOfferModelList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ServiceOfferModelRules'
      required:
      - items
    ServiceConfiguration:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        as_of:
          type: string
          format: date-time
        offer_model:
          oneOf:
          - $ref: '#/components/schemas/OfferModel'
          - type: 'null'
        model_rules:
          oneOf:
          - $ref: '#/components/schemas/ServiceOfferModelRules'
          - type: 'null'
        parameters:
          type: object
          description: Wirksame Werte der modellabhängigen Parameter (pooling_allowed, max_detour_pct, stop_walk_max_m, advance_arrival_buffer_min); nur gesetzte Werte.
        revision_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        effective_from:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - service_id
      - as_of
      - offer_model
      - model_rules
      - parameters
      - revision_id
      - effective_from
    Service:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        operator_id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          $ref: common.yaml#/components/schemas/TimeZone
        region_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Optionale Zuordnung des Dienstes zu einer Region des Mandanten.
        config_revision_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - operator_id
      - name
      - timezone
      - config_revision_id
      - revision
    ServiceUpdate:
      type: object
      additionalProperties: false
      description: Der Betreiber ist nach dem Anlegen unveränderlich.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          $ref: common.yaml#/components/schemas/TimeZone
        region_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Optionale Zuordnung des Dienstes zu einer Region des Mandanten.
      required:
      - name
      - timezone
    ServiceCreate:
      type: object
      additionalProperties: false
      properties:
        operator_id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          $ref: common.yaml#/components/schemas/TimeZone
        region_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Optionale Zuordnung des Dienstes zu einer Region des Mandanten.
      required:
      - operator_id
      - name
      - timezone
      examples:
      - operator_id: 00000000-0000-4000-8000-000000000005
        name: Rufbus Nord
        timezone: Europe/Berlin
    ServicePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
