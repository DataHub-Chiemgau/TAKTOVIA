paths:
  /v1/services:
    get:
      summary: Dienste auflisten
      operationId: listServices
      security:
      - oidc:
        - services:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Dienstkopf anlegen
      operationId: createService
      security:
      - oidc:
        - services:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreate'
  /v1/services/{service_id}:
    put:
      summary: Dienstkopf ändern
      operationId: updateService
      security:
      - oidc:
        - services:write
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdate'
  /v1/services/{service_id}/configuration:
    get:
      summary: Wirksame Dienstkonfiguration mit Angebotsmodell und Modellregeln lesen
      description: 'Liefert zum Zeitpunkt at (Standard: jetzt) das wirksame Angebotsmodell (Bestandteil der veröffentlichten Dienstrevision), die zugehörigen Modellregeln und die modellabhängigen Werte, aufgelöst über den Konfigurationsport (WP-M1-25). Ohne veröffentlichte Dienstkonfiguration ist offer_model null. Unbekannter oder fremder Dienst: 404. Die Modellregeln sind Planungsannahme PA-01 (OP-28).'
      operationId: getServiceConfiguration
      security:
      - oidc:
        - config:read
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: at
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/Timestamp
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceConfiguration'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/service-offer-models:
    get:
      summary: Angebotsmodelle mit Modellregeln auflisten
      description: 'Regeltabelle der drei Angebotsmodelle: je Modell die Pflichtparameter, die unzulässigen und die optionalen Parameter der Dienstrevision (Planungsannahme PA-01, OP-28, nicht fachlich freigegeben). Grundlage der Oberfläche Dienst anlegen.'
      operationId: listServiceOfferModels
      security:
      - oidc:
        - services:read
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOfferModelList'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/services/{service_id}/operating-hours:
    get:
      summary: Betriebszeiten und Dienstversion lesen
      description: 'Jüngste Dienstversion (höchste Revision) mit Betriebszeiten, Ausnahmetagen und Verkehrsprodukt; ETag = Revision. Revision 0 heißt: keine Betriebszeit hinterlegt, der Dienst gilt als außer Betrieb (WP-M2-03). Fremder oder unbekannter Dienst: 404.'
      operationId: getServiceOperatingHours
      security:
      - oidc:
        - services:read
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOperatingHours'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    put:
      summary: Betriebszeiten als neue Dienstversion veröffentlichen
      description: 'Legt eine neue Dienstversion (Revision + 1) an; If-Match trägt die zuletzt gelesene Revision (0 = noch keine). Überlappender Gültigkeitszeitraum zu einer anderen Version: 409; veraltet 412; fehlend 428. Eine offene Vorgängerversion endet mit dem Beginn der neuen. Die Zeitzone folgt dem Dienst; `reason` wird auditiert.'
      operationId: putServiceOperatingHours
      security:
      - oidc:
        - services:write
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceOperatingHoursInput'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOperatingHours'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/services/{service_id}/operating-hours/revisions:
    get:
      summary: Dienstversionen auflisten
      description: 'Alle Dienstversionen, neueste zuerst; ältere Versionen bleiben für bestehende Zusagen unverändert lesbar.'
      operationId: listServiceOperatingHoursRevisions
      security:
      - oidc:
        - services:read
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 50
      - name: before_revision
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        description: Nur Revisionen unterhalb dieses Werts (Fortsetzung mit next_before_revision).
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceOperatingHoursRevisionPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/services/{service_id}/availability:
    get:
      summary: Betriebsstatus des Dienstes zu einem Zeitpunkt lesen
      description: 'Lesesicht für Fahrgäste: in Betrieb ja/nein zum Zeitpunkt und nächste Betriebszeit, ohne interne Felder. Ohne wirksame Dienstversion ist der Dienst außer Betrieb (kein stiller 24-h-Betrieb).'
      operationId: getServiceAvailability
      security:
      - oidc:
        - geo:read
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: at
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/Timestamp
        description: Zeitpunkt (Standard jetzt).
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAvailability'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    OfferModel:
      type: string
      description: Angebotsmodell des Dienstes (Planungsannahme PA-01); entspricht traffic_type der Dienstkonfiguration.
      enum:
      - AREA_ON_DEMAND
      - LINE_ON_DEMAND
      - STATION_FEEDER
    ServiceOfferModelRules:
      type: object
      additionalProperties: false
      properties:
        model:
          $ref: '#/components/schemas/OfferModel'
        label:
          type: string
          minLength: 1
          maxLength: 100
        required:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
        forbidden:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
        optional:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
      required:
      - model
      - label
      - required
      - forbidden
      - optional
    ServiceOfferModelList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ServiceOfferModelRules'
      required:
      - items
    ServiceConfiguration:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        as_of:
          type: string
          format: date-time
        offer_model:
          oneOf:
          - $ref: '#/components/schemas/OfferModel'
          - type: 'null'
        model_rules:
          oneOf:
          - $ref: '#/components/schemas/ServiceOfferModelRules'
          - type: 'null'
        parameters:
          type: object
          description: Wirksame Werte der modellabhängigen Parameter (pooling_allowed, max_detour_pct, stop_walk_max_m, advance_arrival_buffer_min); nur gesetzte Werte.
        revision_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        effective_from:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - service_id
      - as_of
      - offer_model
      - model_rules
      - parameters
      - revision_id
      - effective_from
    Service:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        operator_id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          $ref: common.yaml#/components/schemas/TimeZone
        region_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Optionale Zuordnung des Dienstes zu einer Region des Mandanten.
        config_revision_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - operator_id
      - name
      - timezone
      - config_revision_id
      - revision
    ServiceUpdate:
      type: object
      additionalProperties: false
      description: Der Betreiber ist nach dem Anlegen unveränderlich.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          $ref: common.yaml#/components/schemas/TimeZone
        region_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Optionale Zuordnung des Dienstes zu einer Region des Mandanten.
      required:
      - name
      - timezone
    ServiceCreate:
      type: object
      additionalProperties: false
      properties:
        operator_id:
          $ref: common.yaml#/components/schemas/UUID
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          $ref: common.yaml#/components/schemas/TimeZone
        region_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Optionale Zuordnung des Dienstes zu einer Region des Mandanten.
      required:
      - operator_id
      - name
      - timezone
      examples:
      - operator_id: 00000000-0000-4000-8000-000000000005
        name: Rufbus Nord
        timezone: Europe/Berlin
    ServicePage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
    HoursWindow:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: Beginn in Ortszeit des Dienstes (HH:MM), einschließlich.
        to:
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$
          description: Ende in Ortszeit (HH:MM, 24:00 nur als Ende), ausschließlich.
      required:
      - from
      - to
    WeeklyHours:
      type: object
      additionalProperties: false
      properties:
        weekdays:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items:
            type: string
            enum:
            - MON
            - TUE
            - WED
            - THU
            - FRI
            - SAT
            - SUN
        from:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        to:
          type: string
          pattern: ^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$
      required:
      - weekdays
      - from
      - to
    ExceptionDay:
      type: object
      additionalProperties: false
      description: Ausnahmetag; ersetzt das Wochenschema des Ortsdatums vollständig, ohne Fenster ist der Dienst an dem Tag außer Betrieb.
      properties:
        date:
          type: string
          format: date
          maxLength: 10
        windows:
          type: array
          maxItems: 24
          items:
            $ref: '#/components/schemas/HoursWindow'
        note:
          type: string
          maxLength: 200
      required:
      - date
      - windows
    ServiceOperatingHoursInput:
      type: object
      additionalProperties: false
      properties:
        traffic_product:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{1,39}$
          description: Verkehrsproduktkennung (z. B. AREA_ON_DEMAND).
        weekly_hours:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/WeeklyHours'
        exceptions:
          type: array
          maxItems: 366
          items:
            $ref: '#/components/schemas/ExceptionDay'
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Grund der Änderung (Audit).
      required:
      - traffic_product
      - weekly_hours
      - valid_from
      - reason
      examples:
      - traffic_product: AREA_ON_DEMAND
        weekly_hours:
        - weekdays:
          - MON
          - TUE
          from: '06:00'
          to: '22:00'
        exceptions:
        - date: '2026-12-24'
          windows: []
        valid_from: '2026-12-01T00:00:00+01:00'
        valid_to: null
        reason: Winterfahrplan
    ServiceOperatingHours:
      type: object
      additionalProperties: false
      description: Dienstversion; Revision 0 = keine Betriebszeit hinterlegt (alle übrigen Felder null), der Dienst gilt als außer Betrieb.
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        traffic_product:
          type:
          - string
          - 'null'
        timezone:
          type:
          - string
          - 'null'
          maxLength: 64
        weekly_hours:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WeeklyHours'
        exceptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ExceptionDay'
        valid_from:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
        reason:
          type:
          - string
          - 'null'
        created_by:
          type:
          - string
          - 'null'
        created_at:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - service_id
      - revision
      - traffic_product
      - timezone
      - weekly_hours
      - exceptions
      - valid_from
      - valid_to
    ServiceOperatingHoursRevisionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOperatingHours'
          maxItems: 100
        next_before_revision:
          type:
          - integer
          - 'null'
          format: int64
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_before_revision
      - as_of
    ServiceAvailability:
      type: object
      additionalProperties: false
      description: Betriebsstatus ohne interne Felder.
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        at:
          type: string
          format: date-time
        in_operation:
          type: boolean
        next_opening:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Beginn der nächsten Betriebszeit (bei laufender Betriebszeit gleich at); null, wenn keine absehbar.
        timezone:
          $ref: common.yaml#/components/schemas/TimeZone
        traffic_product:
          type:
          - string
          - 'null'
      required:
      - service_id
      - at
      - in_operation
      - next_opening
      - timezone
      - traffic_product
