paths:
  /v1/webhook-subscriptions:
    get:
      summary: Webhook-Abonnements auflisten
      operationId: listWebhookSubscriptions
      security:
      - oidc:
        - webhooks:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscriptionPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Webhook-Abonnement anlegen
      operationId: createWebhookSubscription
      security:
      - oidc:
        - webhooks:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionCreate'
components:
  schemas:
    WebhookSubscription:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        url:
          type: string
          format: uri
          maxLength: 2000
        event_types:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          maxItems: 50
        active:
          type: boolean
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - id
      - url
      - event_types
      - active
      - revision
    WebhookSubscriptionCreate:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2000
          pattern: ^https://
        event_types:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 128
          maxItems: 50
          minItems: 1
      required:
      - url
      - event_types
      description: Nur https; Ziele werden gegen SSRF geprüft (interne und Loopback-Adressen sind unzulässig).
      examples:
      - url: https://partner.example.org/hooks/taktovia
        event_types:
        - booking.confirmed
    WebhookSubscriptionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WebhookSubscription'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
