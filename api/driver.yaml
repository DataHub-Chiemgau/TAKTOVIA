paths:
  /v1/driver/events:
    post:
      summary: Ein-/Ausstieg oder No-Show übermitteln
      operationId: recordDriverEvent
      security:
      - oidc:
        - driver:events
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEventResult'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      description: 'Objektberechtigung auf aktuelle zugewiesene Schicht/Route. Ereignis-ID dedupliziert dauerhaft. Verspätete Offline-Ereignisse
        überschreiben keine neuere sicherheitsrelevante Freigabe. REVIEW_REQUIRED ist keine ausgeführte Beförderungsbuchung. Das Ereignis ist
        an das registrierte Gerät der Sitzung gebunden (`device_id`); eine gesperrte oder beendete Sitzung ergibt 401/403, der Client behält das
        Ereignis dann in der Outbox. Die Serverempfangszeit (`received_at`) setzt der Server; die Gerätezeit ersetzt sie nie. `tenant_id` im Body
        gibt kein Recht (fremder Wert: 404 mit Sicherheitsereignis, eigener Wert: 422 als unbekanntes Feld).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverEvent'
  /v1/driver/positions:
    post:
      summary: Positionen der Fahrer-App melden
      operationId: recordDriverPosition
      security:
      - oidc:
        - driver:positions
      description: 'Nimmt Messpunkte des eigenen, an die Sitzung gebundenen Geräts für die eigene, **angetretene** Schicht und ihr Fahrzeug entgegen (WP-M3-34, OP-04). Unbekannte oder fremde Schicht, fremdes Fahrzeug oder Schicht eines anderen Mandanten: einheitlich 404. Schicht nicht angetreten, entzogen: 409 `INVALID_STATE_TRANSITION`, nichts gespeichert (außerhalb eines angetretenen Dienstes werden keine Positionen angenommen). Messzeit (Gerätezeit) und Empfangszeit (Serveruhr) werden getrennt gespeichert; nachgelieferte Punkte behalten ihre Messzeit und gelten nie als aktuelle Position, eine verspätete ältere Meldung überschreibt die „letzte Position“ nicht (sie folgt der jüngsten Messzeit). `speed_mps` und `heading_deg` werden angenommen, aber nicht gespeichert (Datenminimierung). In Produktion ist die Erfassung nur mit einer freigegebenen Aufbewahrungsregel für Standortdaten (`LK_STANDORT`) aktiv, sonst 409 `CONFLICT` (D-10, D-11). Rohpositionen löscht der Löschlauf nach der dort hinterlegten Frist.'
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPositionResult'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverPositionBatch'
  /v1/driver/shifts/{shift_id}/run:
    get:
      summary: Dienst und Stoppliste lesen
      operationId: getDriverRun
      security:
      - oidc:
        - driver:run
      description: 'Nur für die eigene Schicht; fremde, unbekannte oder Schicht eines anderen Mandanten: einheitlich 404. Eine eigene Schicht, die abgelaufen, beendet, entzogen oder nicht angetreten ist, liefert 200 mit Leerzustand (`shift_valid` false, keine Stopps, DRV-001). ETag/`If-None-Match`: unverändert ergibt
        304. Aufträge nur bei gültiger, angetretener Schicht und bestehender Einsatzfreigabe (`release_state` RELEASED); vorher keine Aufträge, mit `missing_requirements`.'
      parameters:
      - name: shift_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Schicht-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRun'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
        '304':
          description: Nicht verändert (If-None-Match stimmt mit dem ETag überein).
  /v1/driver/shifts/{shift_id}/run/acknowledgements:
    post:
      summary: Planrevision bestätigen
      operationId: acknowledgeDriverRunRevision
      security:
      - oidc:
        - driver:run
      description: 'If-Match trägt die Planrevision, die bestätigt wird; veraltet: 412. Je Fahrer und Revision ein Eintrag, zwei Geräte ergeben
        einen Eintrag.'
      parameters:
      - name: shift_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Schicht-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRun'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRunAck'
  /v1/driver/devices:
    post:
      summary: Gerät an die Sitzung binden
      operationId: registerDriverDevice
      security:
      - oidc:
        - driver:devices
      description: 'Idempotent je `device_id` und Sitzung: wiederholtes Registrieren liefert dasselbe Gerät. Ein Gerät, das einer anderen Sitzung
        oder einem anderen Konto gehört, ergibt 409 CONFLICT.'
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '201':
          description: Angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverDevice'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverDeviceRegister'
  /v1/driver/devices/{device_id}:
    delete:
      summary: Gerätebindung beenden
      operationId: revokeDriverDevice
      security:
      - oidc:
        - driver:devices
      description: 'Beendet die Bindung des eigenen Geräts (Abmeldung); danach lehnt der Server Ereignisse dieses Geräts ab. If-Match: Revision
        der Bindung.'
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Geräte-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '204':
          description: Erfolgreich, kein Inhalt.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/driver/shifts:
    get:
      summary: Eigene Schichten lesen
      operationId: listDriverShifts
      security:
      - oidc:
        - driver:run
      description: Die eigenen, noch nicht beendeten und nicht entzogenen Schichten mit Ende in der Zukunft, nach Beginn (höchstens 10; UI-09 „Nächster Dienst
        06:00–14:00 · Fahrzeug A-12“). Eine fremde Schicht erscheint nie. Ohne Zuweisung ist die Liste leer (Leerzustand der App). `valid` ist wahr, wenn
        die Schicht angetreten ist und die Serverzeit in `[starts_at, ends_at)` liegt; `startable_from` ist `starts_at` minus Antrittstoleranz (Planungsdefault
        30 Minuten). Die Authentifizierung nutzt ausschließlich das Fahrerkonto (OIDC); ein Konto ohne Rolle `driver` bekommt 403.
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverShiftList'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/driver/shift-starts:
    post:
      summary: Dienst antreten
      operationId: startDriverShift
      security:
      - oidc:
        - driver:run
      description: 'Bestätigt die Zuordnung Fahrer, Schicht, Fahrzeug an einem registrierten Gerät (WP-M3-25, LH-6.6-DRV-001): `shift_id` ist die eigene Schicht
        (fremd, unbekannt oder anderer Mandant: einheitlich 404), `vehicle_id` das Fahrzeug der Schicht (abweichend: 422; bei bereits angetretener Schicht
        409), `device_id` ein Gerät des Kontos, an die aktuelle Sitzung gebunden (sonst 403; ein Gerät eines anderen Kontos: 404). Antritt nur im Zustand
        geplant/veröffentlicht, ab Beginn minus Antrittstoleranz bis vor Schichtende (sonst 409 `INVALID_STATE_TRANSITION`; auch nach Entzug oder Ende). Wiederholung
        und das gleichzeitige Antreten eines zweiten Geräts desselben Fahrers ergeben genau einen Antritt: die Antwort nennt den bestehenden Zustand mit `already_started`
        = true. Der Antritt ist weder Arbeitszeiterfassung noch Einsatzfreigabe; Gerät und Zeit stehen im `audit_event`. Ein `tenant_id` im Body gibt kein
        Recht (422 als unbekanntes Feld).'
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverShiftStartResult'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverShiftStart'
  /v1/driver/shift-ends:
    post:
      summary: Dienst beenden
      operationId: endDriverShift
      security:
      - oidc:
        - driver:run
      description: 'Beendet die eigene angetretene Schicht (Zustand beendet, Zeit und Gerät im `audit_event`); Wiederholung liefert den Stand. Eine nicht
        angetretene Schicht: 409 `INVALID_STATE_TRANSITION`; fremde Schicht: 404; Gerät wie beim Antritt. Die Arbeitszeiterfassung (M4) bleibt davon getrennt.'
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverShift'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverShiftEnd'
components:
  schemas:
    DriverEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: common.yaml#/components/schemas/UUID
        shift_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        plan_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        event_type:
          type: string
          enum:
          - ARRIVAL
          - CHECK_IN
          - CHECK_OUT
          - NO_SHOW
          - BREAK_START
          - BREAK_END
          - DISRUPTION
          - SHIFT_END
          description: 'Erweiterung nach OP-03: ARRIVAL (Ankunft am Stopp, startet die Wartefrist), BREAK_START/BREAK_END/DISRUPTION/SHIFT_END
            (Dienststatus). CHECK_IN, CHECK_OUT und NO_SHOW verlangen `booking_id` und `route_stop_id` (fachliche Prüfung des Servers, 422 mit
            Pflichtfeldverletzung); ARRIVAL und Statusereignisse nicht (Ankunft kann mehrere oder keine Buchung betreffen).'
        booking_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        route_stop_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        occurred_at:
          type: string
          format: date-time
        device_recorded_at:
          type: string
          format: date-time
        position:
          $ref: common.yaml#/components/schemas/Point
        accuracy_meters:
          type: number
          minimum: 0
          maximum: 100000
        offline_recorded:
          type: boolean
        device_id:
          $ref: common.yaml#/components/schemas/UUID
        no_show_wait_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Gewartete Zeit bei NO_SHOW (DRV-005).
        no_show_reason:
          type: string
          enum:
          - NOT_PRESENT
          - REFUSED_TO_BOARD
          - OTHER
      required:
      - event_id
      - shift_id
      - vehicle_id
      - plan_revision
      - event_type
      - occurred_at
      - device_recorded_at
      - offline_recorded
      description: Fahrerereignis; `event_id` ist die `device_event_id` der Outbox (Idempotenzschlüssel auf Ereignisebene), `plan_revision` die
        letzte dem Gerät bekannte Serverrevision, `device_recorded_at` die Gerätezeit. Die Serverempfangszeit steht nur in der Antwort.
    DriverEventResult:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: common.yaml#/components/schemas/UUID
        state:
          type: string
          enum:
          - APPLIED
          - DUPLICATE
          - REVIEW_REQUIRED
        received_at:
          type: string
          format: date-time
        current_plan_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        reason_code:
          oneOf:
          - type: string
            enum:
            - STALE_PLAN
            - OUTSIDE_STOP
            - CLOCK_SKEW
            - INVALID_ORDER
            - RELEASE_REQUIRED
            - SHIFT_ENDED
          - type: 'null'
        original_state:
          oneOf:
          - type: string
            enum:
            - APPLIED
            - REVIEW_REQUIRED
          - type: 'null'
          description: 'Nur bei DUPLICATE: Ergebnis der ersten Verarbeitung (REVIEW_REQUIRED bleibt bei Wiederholung erkennbar).'
      required:
      - event_id
      - state
      - received_at
      - current_plan_revision
      - reason_code
      description: 'Ergebnis: APPLIED (wirksam), DUPLICATE (gleiche event_id und gleicher Inhalt: keine zweite Wirkung), REVIEW_REQUIRED (nicht
        wirksam, Klärfall der Leitstelle). Gleiche event_id mit anderem Inhalt: 409 IDEMPOTENCY_CONFLICT.'
    DriverPositionSample:
      type: object
      additionalProperties: false
      properties:
        position:
          $ref: common.yaml#/components/schemas/Point
        accuracy_meters:
          type: number
          minimum: 0
          maximum: 100000
        measured_at:
          type: string
          format: date-time
        speed_mps:
          oneOf:
          - type: number
            minimum: 0
            maximum: 100
          - type: 'null'
        heading_deg:
          oneOf:
          - type: number
            minimum: 0
            maximum: 360
          - type: 'null'
      required:
      - position
      - accuracy_meters
      - measured_at
    DriverPositionBatch:
      type: object
      additionalProperties: false
      properties:
        shift_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        device_id:
          $ref: common.yaml#/components/schemas/UUID
        samples:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DriverPositionSample'
      required:
      - shift_id
      - vehicle_id
      - device_id
      - samples
      description: 'Positionsmeldung (OP-04, Ergänzungsvorschlag): `measured_at` ist die Gerätemesszeit, der Server hält Empfangszeit getrennt
        und berechnet das Standortalter aus beiden.'
    DriverPositionResult:
      type: object
      additionalProperties: false
      properties:
        accepted:
          type: integer
          minimum: 0
          description: Neu gespeicherte und bereits gespeicherte Messpunkte (erneute Sendung derselben Messzeit ist idempotent).
        rejected:
          type: integer
          minimum: 0
        received_at:
          type: string
          format: date-time
          description: Serverempfangszeit der Meldung (Serveruhr); die Gerätemesszeit steht getrennt in `measured_at` je Messpunkt.
        rejections:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              index:
                type: integer
                minimum: 0
              reason:
                type: string
                enum:
                - FUTURE_TIME
                - OUTSIDE_SERVICE
            required:
            - index
            - reason
          description: Einzeln abgewiesene Messpunkte. FUTURE_TIME = Messzeit mehr als die Toleranz (Planungsdefault 5 s) nach der Serverzeit; OUTSIDE_SERVICE = Messzeit vor dem Dienstantritt oder nach dem Dienstende.
      required:
      - accepted
      - rejected
      - received_at
    DriverRunStop:
      type: object
      additionalProperties: false
      properties:
        route_stop_id:
          $ref: common.yaml#/components/schemas/UUID
        sequence:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
          - PICKUP
          - DROPOFF
          - WAYPOINT
        planned_at:
          type: string
          format: date-time
        forecast_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        stop_name:
          type: string
          minLength: 1
          maxLength: 200
        position:
          $ref: common.yaml#/components/schemas/Point
        passenger_count:
          type: integer
          minimum: 0
          maximum: 100
        booking_ids:
          type: array
          maxItems: 20
          items:
            $ref: common.yaml#/components/schemas/UUID
        change:
          oneOf:
          - type: string
            enum:
            - NEW
            - REMOVED
            - MOVED
            - TIME_CHANGED
          - type: 'null'
        support_hints:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 64
      required:
      - route_stop_id
      - sequence
      - kind
      - planned_at
      - forecast_at
      - stop_name
      - position
      - passenger_count
      - booking_ids
      - change
      - support_hints
      description: Stopp der Fahrerprojektion. Keine Fahrgastkontakte, keine Zahlungsdaten; `support_hints` sind Codes nach Rolle und Zuordnung
        (DRV-008).
    DriverRun:
      type: object
      additionalProperties: false
      properties:
        shift_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        shift_state:
          type: string
          minLength: 1
          maxLength: 32
          description: Zustand der eigenen Schicht (PLANNED, STARTED, ENDED, CANCELLED oder PUBLISHED).
        shift_valid:
          type: boolean
          description: Angetreten, innerhalb der Schichtzeit und nicht entzogen. Nur dann liefert der Server Aufträge (DRV-001).
        release_state:
          type: string
          enum:
          - NOT_RELEASED
          - RELEASED
          - BLOCKED
          - RESTRICTED
        missing_requirements:
          type: array
          maxItems: 50
          items:
            $ref: fleet-safety.yaml#/components/schemas/MissingRequirement
        plan_revision:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
        plan_as_of:
          type: string
          format: date-time
        stops:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/DriverRunStop'
        acknowledged_revision:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
      required:
      - shift_id
      - vehicle_id
      - shift_state
      - shift_valid
      - release_state
      - missing_requirements
      - plan_revision
      - plan_as_of
      - stops
      - acknowledged_revision
      description: Dienst und Stoppliste des Fahrers. Vor der serverseitigen Einsatzfreigabe sind `stops` leer und nur Dienst, Fahrzeug und `missing_requirements`
        gefüllt (CHK-001).
    DriverRunAck:
      type: object
      additionalProperties: false
      properties:
        plan_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        acknowledged_at:
          type: string
          format: date-time
      required:
      - plan_revision
      - acknowledged_at
      description: Bestätigung einer Planrevision durch den Fahrer (DRV-004); je Fahrer genau ein Eintrag je Revision.
    DriverDeviceRegister:
      type: object
      additionalProperties: false
      properties:
        device_id:
          $ref: common.yaml#/components/schemas/UUID
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
        app_version:
          type: string
          minLength: 1
          maxLength: 32
        push_token_ref:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
      required:
      - device_id
      - platform
      - app_version
      description: Bindet ein Gerät an die aktuelle IdP-Sitzung (WP-M3-24). `device_id` erzeugt die App einmal je Installation (zufällig, kein
        Hardwarebezug).
    DriverDevice:
      type: object
      additionalProperties: false
      properties:
        device_id:
          $ref: common.yaml#/components/schemas/UUID
        session_id:
          $ref: common.yaml#/components/schemas/UUID
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
        app_version:
          type: string
          minLength: 1
          maxLength: 32
        registered_at:
          type: string
          format: date-time
        revoked_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - device_id
      - session_id
      - platform
      - app_version
      - registered_at
      - revoked_at
      - revision
    DriverShift:
      type: object
      additionalProperties: false
      properties:
        shift_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_label:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        state:
          type: string
          minLength: 1
          maxLength: 32
          description: PLANNED, STARTED, ENDED, CANCELLED (oder PUBLISHED aus dem Dienstplan).
        startable_from:
          type: string
          format: date-time
        started_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        ended_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        valid:
          type: boolean
      required:
      - shift_id
      - vehicle_id
      - vehicle_label
      - starts_at
      - ends_at
      - timezone
      - state
      - startable_from
      - started_at
      - ended_at
      - valid
      description: Die eigene Schicht des Fahrers. `valid` = angetreten und innerhalb der Schichtzeit (Serverzeit); nur dann kann der Server Aufträge liefern.
    DriverShiftList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DriverShift'
          maxItems: 10
        as_of:
          type: string
          format: date-time
      required:
      - items
      - as_of
    DriverShiftStart:
      type: object
      additionalProperties: false
      properties:
        shift_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        device_id:
          $ref: common.yaml#/components/schemas/UUID
      required:
      - shift_id
      - vehicle_id
      - device_id
      description: 'Dienstantritt (WP-M3-25): eigene Schicht, Fahrzeug der Schicht, registriertes Gerät der Sitzung. Der Mandant steht nie im Body.'
    DriverShiftEnd:
      type: object
      additionalProperties: false
      properties:
        shift_id:
          $ref: common.yaml#/components/schemas/UUID
        device_id:
          $ref: common.yaml#/components/schemas/UUID
      required:
      - shift_id
      - device_id
      description: Dienstende (WP-M3-25).
    DriverShiftStartResult:
      type: object
      additionalProperties: false
      properties:
        shift:
          $ref: '#/components/schemas/DriverShift'
        already_started:
          type: boolean
      required:
      - shift
      - already_started
      description: '`already_started` = die Schicht war schon angetreten (Wiederholung oder zweites Gerät): der Zustand bleibt unverändert.'
