paths:
  /v1/driver/events:
    post:
      summary: Ein-/Ausstieg oder No-Show übermitteln
      operationId: recordDriverEvent
      security:
      - oidc:
        - driver:events
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEventResult'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      description: 'Objektberechtigung auf aktuelle zugewiesene Schicht/Route. Ereignis-ID dedupliziert dauerhaft. Verspätete Offline-Ereignisse
        überschreiben keine neuere sicherheitsrelevante Freigabe. REVIEW_REQUIRED ist keine ausgeführte Beförderungsbuchung. Das Ereignis ist
        an das registrierte Gerät der Sitzung gebunden (`device_id`); eine gesperrte oder beendete Sitzung ergibt 401/403, der Client behält das
        Ereignis dann in der Outbox. Die Serverempfangszeit (`received_at`) setzt der Server; die Gerätezeit ersetzt sie nie. `tenant_id` im Body
        gibt kein Recht (fremder Wert: 404 mit Sicherheitsereignis, eigener Wert: 422 als unbekanntes Feld).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverEvent'
  /v1/driver/positions:
    post:
      summary: Positionen der Fahrer-App melden
      operationId: recordDriverPosition
      security:
      - oidc:
        - driver:positions
      description: 'Nimmt Messpunkte des eigenen, bestätigt zugeordneten Geräts entgegen; Rohpositionen unterliegen der Aufbewahrungsregel (OP-04).
        Unbekannte oder fremde Schicht: 404.'
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverPositionResult'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverPositionBatch'
  /v1/driver/shifts/{shift_id}/run:
    get:
      summary: Dienst und Stoppliste lesen
      operationId: getDriverRun
      security:
      - oidc:
        - driver:run
      description: 'Nur für die eigene, aktuell zugewiesene Schicht; fremde oder beendete Schicht: 404. ETag/`If-None-Match`: unverändert ergibt
        304. Vor der Einsatzfreigabe keine Aufträge.'
      parameters:
      - name: shift_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Schicht-ID.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRun'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
        '304':
          description: Nicht verändert (If-None-Match stimmt mit dem ETag überein).
  /v1/driver/shifts/{shift_id}/run/acknowledgements:
    post:
      summary: Planrevision bestätigen
      operationId: acknowledgeDriverRunRevision
      security:
      - oidc:
        - driver:run
      description: 'If-Match trägt die Planrevision, die bestätigt wird; veraltet: 412. Je Fahrer und Revision ein Eintrag, zwei Geräte ergeben
        einen Eintrag.'
      parameters:
      - name: shift_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Schicht-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverRun'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverRunAck'
  /v1/driver/devices:
    post:
      summary: Gerät an die Sitzung binden
      operationId: registerDriverDevice
      security:
      - oidc:
        - driver:devices
      description: 'Idempotent je `device_id` und Sitzung: wiederholtes Registrieren liefert dasselbe Gerät. Ein Gerät, das einer anderen Sitzung
        oder einem anderen Konto gehört, ergibt 409 CONFLICT.'
      parameters:
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '201':
          description: Angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverDevice'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverDeviceRegister'
  /v1/driver/devices/{device_id}:
    delete:
      summary: Gerätebindung beenden
      operationId: revokeDriverDevice
      security:
      - oidc:
        - driver:devices
      description: 'Beendet die Bindung des eigenen Geräts (Abmeldung); danach lehnt der Server Ereignisse dieses Geräts ab. If-Match: Revision
        der Bindung.'
      parameters:
      - name: device_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Geräte-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '204':
          description: Erfolgreich, kein Inhalt.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    DriverEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: common.yaml#/components/schemas/UUID
        shift_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        plan_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        event_type:
          type: string
          enum:
          - ARRIVAL
          - CHECK_IN
          - CHECK_OUT
          - NO_SHOW
          - BREAK_START
          - BREAK_END
          - DISRUPTION
          - SHIFT_END
          description: 'Erweiterung nach OP-03: ARRIVAL (Ankunft am Stopp, startet die Wartefrist), BREAK_START/BREAK_END/DISRUPTION/SHIFT_END
            (Dienststatus). CHECK_IN, CHECK_OUT und NO_SHOW verlangen `booking_id` und `route_stop_id` (fachliche Prüfung des Servers, 422 mit
            Pflichtfeldverletzung); ARRIVAL und Statusereignisse nicht (Ankunft kann mehrere oder keine Buchung betreffen).'
        booking_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        route_stop_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        occurred_at:
          type: string
          format: date-time
        device_recorded_at:
          type: string
          format: date-time
        position:
          $ref: common.yaml#/components/schemas/Point
        accuracy_meters:
          type: number
          minimum: 0
          maximum: 100000
        offline_recorded:
          type: boolean
        device_id:
          $ref: common.yaml#/components/schemas/UUID
        no_show_wait_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Gewartete Zeit bei NO_SHOW (DRV-005).
        no_show_reason:
          type: string
          enum:
          - NOT_PRESENT
          - REFUSED_TO_BOARD
          - OTHER
      required:
      - event_id
      - shift_id
      - vehicle_id
      - plan_revision
      - event_type
      - occurred_at
      - device_recorded_at
      - offline_recorded
      description: Fahrerereignis; `event_id` ist die `device_event_id` der Outbox (Idempotenzschlüssel auf Ereignisebene), `plan_revision` die
        letzte dem Gerät bekannte Serverrevision, `device_recorded_at` die Gerätezeit. Die Serverempfangszeit steht nur in der Antwort.
    DriverEventResult:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: common.yaml#/components/schemas/UUID
        state:
          type: string
          enum:
          - APPLIED
          - DUPLICATE
          - REVIEW_REQUIRED
        received_at:
          type: string
          format: date-time
        current_plan_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        reason_code:
          oneOf:
          - type: string
            enum:
            - STALE_PLAN
            - OUTSIDE_STOP
            - CLOCK_SKEW
            - INVALID_ORDER
            - RELEASE_REQUIRED
            - SHIFT_ENDED
          - type: 'null'
        original_state:
          oneOf:
          - type: string
            enum:
            - APPLIED
            - REVIEW_REQUIRED
          - type: 'null'
          description: 'Nur bei DUPLICATE: Ergebnis der ersten Verarbeitung (REVIEW_REQUIRED bleibt bei Wiederholung erkennbar).'
      required:
      - event_id
      - state
      - received_at
      - current_plan_revision
      - reason_code
      description: 'Ergebnis: APPLIED (wirksam), DUPLICATE (gleiche event_id und gleicher Inhalt: keine zweite Wirkung), REVIEW_REQUIRED (nicht
        wirksam, Klärfall der Leitstelle). Gleiche event_id mit anderem Inhalt: 409 IDEMPOTENCY_CONFLICT.'
    DriverPositionSample:
      type: object
      additionalProperties: false
      properties:
        position:
          $ref: common.yaml#/components/schemas/Point
        accuracy_meters:
          type: number
          minimum: 0
          maximum: 100000
        measured_at:
          type: string
          format: date-time
        speed_mps:
          oneOf:
          - type: number
            minimum: 0
            maximum: 100
          - type: 'null'
        heading_deg:
          oneOf:
          - type: number
            minimum: 0
            maximum: 360
          - type: 'null'
      required:
      - position
      - accuracy_meters
      - measured_at
    DriverPositionBatch:
      type: object
      additionalProperties: false
      properties:
        shift_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        device_id:
          $ref: common.yaml#/components/schemas/UUID
        samples:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DriverPositionSample'
      required:
      - shift_id
      - vehicle_id
      - device_id
      - samples
      description: 'Positionsmeldung (OP-04, Ergänzungsvorschlag): `measured_at` ist die Gerätemesszeit, der Server hält Empfangszeit getrennt
        und berechnet das Standortalter aus beiden.'
    DriverPositionResult:
      type: object
      additionalProperties: false
      properties:
        accepted:
          type: integer
          minimum: 0
        rejected:
          type: integer
          minimum: 0
        received_at:
          type: string
          format: date-time
      required:
      - accepted
      - rejected
      - received_at
    DriverRunStop:
      type: object
      additionalProperties: false
      properties:
        route_stop_id:
          $ref: common.yaml#/components/schemas/UUID
        sequence:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
          - PICKUP
          - DROPOFF
          - WAYPOINT
        planned_at:
          type: string
          format: date-time
        forecast_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        stop_name:
          type: string
          minLength: 1
          maxLength: 200
        position:
          $ref: common.yaml#/components/schemas/Point
        passenger_count:
          type: integer
          minimum: 0
          maximum: 100
        booking_ids:
          type: array
          maxItems: 20
          items:
            $ref: common.yaml#/components/schemas/UUID
        change:
          oneOf:
          - type: string
            enum:
            - NEW
            - REMOVED
            - MOVED
            - TIME_CHANGED
          - type: 'null'
        support_hints:
          type: array
          maxItems: 10
          items:
            type: string
            minLength: 1
            maxLength: 64
      required:
      - route_stop_id
      - sequence
      - kind
      - planned_at
      - forecast_at
      - stop_name
      - position
      - passenger_count
      - booking_ids
      - change
      - support_hints
      description: Stopp der Fahrerprojektion. Keine Fahrgastkontakte, keine Zahlungsdaten; `support_hints` sind Codes nach Rolle und Zuordnung
        (DRV-008).
    DriverRun:
      type: object
      additionalProperties: false
      properties:
        shift_id:
          $ref: common.yaml#/components/schemas/UUID
        vehicle_id:
          $ref: common.yaml#/components/schemas/UUID
        release_state:
          type: string
          enum:
          - NOT_RELEASED
          - RELEASED
          - BLOCKED
          - RESTRICTED
        missing_requirements:
          type: array
          maxItems: 50
          items:
            $ref: fleet-safety.yaml#/components/schemas/MissingRequirement
        plan_revision:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
        plan_as_of:
          type: string
          format: date-time
        stops:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/DriverRunStop'
        acknowledged_revision:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
      required:
      - shift_id
      - vehicle_id
      - release_state
      - missing_requirements
      - plan_revision
      - plan_as_of
      - stops
      - acknowledged_revision
      description: Dienst und Stoppliste des Fahrers. Vor der serverseitigen Einsatzfreigabe sind `stops` leer und nur Dienst, Fahrzeug und `missing_requirements`
        gefüllt (CHK-001).
    DriverRunAck:
      type: object
      additionalProperties: false
      properties:
        plan_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        acknowledged_at:
          type: string
          format: date-time
      required:
      - plan_revision
      - acknowledged_at
      description: Bestätigung einer Planrevision durch den Fahrer (DRV-004); je Fahrer genau ein Eintrag je Revision.
    DriverDeviceRegister:
      type: object
      additionalProperties: false
      properties:
        device_id:
          $ref: common.yaml#/components/schemas/UUID
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
        app_version:
          type: string
          minLength: 1
          maxLength: 32
        push_token_ref:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
      required:
      - device_id
      - platform
      - app_version
      description: Bindet ein Gerät an die aktuelle IdP-Sitzung (WP-M3-24). `device_id` erzeugt die App einmal je Installation (zufällig, kein
        Hardwarebezug).
    DriverDevice:
      type: object
      additionalProperties: false
      properties:
        device_id:
          $ref: common.yaml#/components/schemas/UUID
        session_id:
          $ref: common.yaml#/components/schemas/UUID
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
        app_version:
          type: string
          minLength: 1
          maxLength: 32
        registered_at:
          type: string
          format: date-time
        revoked_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
      required:
      - device_id
      - session_id
      - platform
      - app_version
      - registered_at
      - revoked_at
      - revision
