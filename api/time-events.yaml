paths:
  /v1/time-events:
    get:
      summary: Zeitereignisse lesen
      operationId: listTimeEvents
      security:
      - oidc:
        - time-events:read
      description: 'Liest die Zeitereignisse (Arbeitsbeginn, Arbeitsende, Pausenbeginn, Pausenende) der Ist-Arbeitszeit, sortiert nach Erfassungszeit. Ohne `person_ref` die eigenen; eine fremde Person sieht nur die Personalrolle (Planersicht), sonst 404. Filter `from`/`to` (Ereigniszeit, `to` exklusiv) und `shift_id`.'
      parameters:
      - name: person_ref
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Person, deren Ereignisse gelesen werden; ohne Angabe die eigene.
      - name: from
        in: query
        required: false
        schema:
          type: string
          maxLength: 40
        description: Nur Ereignisse ab dieser Ereigniszeit (RFC 3339 mit Offset).
      - name: to
        in: query
        required: false
        schema:
          type: string
          maxLength: 40
        description: Nur Ereignisse vor dieser Ereigniszeit (exklusiv).
      - name: shift_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          maxLength: 36
        description: Nur Ereignisse, die dieser geplanten Schicht zugeordnet sind.
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEventPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Eigenes Zeitereignis erfassen
      operationId: recordTimeEvent
      security:
      - oidc:
        - time-events:write
      description: 'Erfasst ein Ereignis der eigenen Ist-Arbeitszeit (Person = angemeldeter Akteur, nie aus dem Body). Die `event_id` ist die stabile Ereignis-ID und dedupliziert dauerhaft: eine Wiederholung mit demselben Inhalt liefert 200 mit dem gespeicherten Ereignis und erzeugt keine zweite Zeile, dieselbe ID mit anderem Inhalt ist 409. `occurred_at` ist die Ereigniszeit, `device_recorded_at` die Gerätezeit; die Serverempfangszeit (`received_at`) setzt der Server. Die Schicht (`shift_id`) ist optional und muss dem Akteur gehören (sonst 404). Ereignisse sind unveränderlich; ein Ende ohne Beginn wird nicht verworfen, sondern in der Intervallableitung gekennzeichnet. Stempeln hängt weder an Fahrzeugfreigabe noch an Check- oder Fahrtzustand (WP-M4-11). Die Person ist der Akteur; ein `person_ref` einer anderen Person im Body wird mit 403 abgewiesen. Doppeltes Einstempeln (Arbeitszeit läuft bereits) ist online ein 409 `INVALID_STATE_TRANSITION`. Offline erfasste Stempel (`origin` `OFFLINE`, WP-M4-12) werden genau einmal übernommen: Antwort mit `result` `APPLIED` (201), `DUPLICATE` (200, Wiederholung des Sync-Laufs) oder `REVIEW_REQUIRED` (201, übernommen und über `conflict_flag` als möglicher Konflikt markiert, nie still korrigiert oder verworfen).'
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEvent'
        '200':
          description: 'Wiederholung mit gleichem Inhalt: das gespeicherte Ereignis, keine zweite Zeile.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEvent'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEventCreate'
  /v1/time-events/backfills:
    post:
      summary: Zeitereignis nacherfassen (Personalrolle)
      operationId: createTimeEventBackfill
      security:
      - oidc:
        - time-events:manage
      description: 'Nacherfassung durch die berechtigte Personalrolle für eine andere Person: eigene Erfassungsquelle `BACKFILL`, Akteur (`recorded_by`) und Begründung sind Pflicht, die Nacherfassung steht im Audit und ersetzt oder ändert nie ein vorhandenes Ereignis. Gleiche Ereignis-ID: wie `recordTimeEvent` (gleicher Inhalt 200, anderer Inhalt 409).'
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEvent'
        '200':
          description: 'Wiederholung mit gleichem Inhalt: das gespeicherte Ereignis, keine zweite Zeile.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEvent'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEventBackfillCreate'
  /v1/time-events/intervals:
    get:
      summary: Arbeitszeitintervalle ableiten
      operationId: listTimeIntervals
      security:
      - oidc:
        - time-events:read
      description: 'Leitet Arbeitszeitintervalle aus den Zeitereignissen im Fenster `[from, to)` ab (Beginn bis Ende abzüglich Pausen); nichts davon wird gespeichert. Fehlendes Ende: das Intervall bleibt offen (`end` null, Kennzeichen `MISSING_END`), es wird nie automatisch abgeschlossen. Ende ohne Beginn: Intervall ohne `start` mit Kennzeichen `END_WITHOUT_START`. Höchstens 31 Tage je Abruf. Fremde Personen wie bei `listTimeEvents`.'
      parameters:
      - name: person_ref
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Person; ohne Angabe die eigene.
      - name: from
        in: query
        required: true
        schema:
          type: string
          maxLength: 40
        description: Beginn des Fensters (RFC 3339 mit Offset).
      - name: to
        in: query
        required: true
        schema:
          type: string
          maxLength: 40
        description: Ende des Fensters (exklusiv), höchstens 31 Tage nach `from`.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeIntervalList'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/time-events/target-actual:
    get:
      summary: Soll/Ist je Tag lesen
      operationId: listTimeTargetActual
      security:
      - oidc:
        - time-events:read
      description: 'Reine Leseprojektion je Person und Tag: Soll aus den geplanten Schichten (`staff_shift`), Ist aus den Zeitereignissen (`time_event`); beides bleibt getrennt gespeichert, die Sicht schreibt nichts und ersetzt nie einen Istwert durch einen Planwert. Ein Tag mit Soll ohne Ist-Buchung trägt das Kennzeichen `NO_ACTUAL_BOOKING` (`actual_net_seconds` null); Ist ohne Soll `ACTUAL_WITHOUT_PLAN`; offene oder beginnlose Intervalle `ACTUAL_INCOMPLETE`. Vorbereitungszeit vor der Fahrzeugprüfung zählt als erfasste Arbeitszeit, sobald sie gestempelt ist. Das Soll folgt dem Betriebstag der Schicht, das Ist dem lokalen Tag des Intervallbeginns in `timezone`. Entwürfe sind kein Soll. Fremde Personen wie bei `listTimeEvents`. Höchstens 31 Tage je Abruf.'
      parameters:
      - name: person_ref
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
        description: Person; ohne Angabe die eigene.
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
          maxLength: 10
        description: Erster Tag (lokales Datum, einschließlich).
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
          maxLength: 10
        description: Letzter Tag (lokales Datum, einschließlich), höchstens 31 Tage ab `from`.
      - name: timezone
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 64
        description: IANA-Zone für die Tageszuordnung; Vorgabe `Europe/Berlin` (bis zum Parameter `reporting_timezone`, WP-M4-10).
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeTargetActualList'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    TimeEventCreate:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: common.yaml#/components/schemas/UUID
        kind:
          $ref: '#/components/schemas/TimeEventKind'
        occurred_at:
          type: string
          format: date-time
          maxLength: 40
          description: Ereigniszeit (wann die Handlung stattfand), mit UTC-Offset.
        time_zone:
          type: string
          maxLength: 64
          description: 'IANA-Zone, in der die Ereigniszeit lokal gelesen wird (z. B. `Europe/Berlin`); ohne Angabe die Plattformzone. `occurred_at` mit Offset ist ein eindeutiger Zeitpunkt; eine geschriebene Ortszeit in der Frühjahrslücke (z. B. 2026-03-29T02:30 in Europe/Berlin) wird mit 422 abgelehnt, es gibt keine stille Auswahl oder Verschiebung.'
        device_recorded_at:
          type: string
          format: date-time
          maxLength: 40
          description: Gerätezeit der Erfassung; wird nie als Serverzeit übernommen.
        channel:
          type: string
          enum:
          - APP
          - WEB
          description: Erfassungskanal der Selbsterfassung. Nacherfassung ist ein eigener Endpunkt.
        origin:
          $ref: '#/components/schemas/TimeEventOrigin'
        person_ref:
          type: string
          minLength: 1
          maxLength: 200
          description: Optional, vom Client behauptete Person. Weicht sie vom angemeldeten Akteur ab, wird der Stempel mit 403 abgewiesen; Stempeln ist nur für die eigene Person möglich.
        shift_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
          description: Optionaler Bezug auf die eigene geplante Schicht.
        location:
          type: object
          additionalProperties: false
          description: 'Standort, den ein Client trotz deaktivierter Geozone (`clock_in_geofence_enabled`, in P1 immer aus) mitsendet. Der Server **verwirft** ihn: er wird nicht gespeichert, nicht in Antwort, Ereignis, Audit oder Logs übernommen (Datenminimierung, AT-59). Die App soll für das Stempeln keinen Standort erheben; der Block ist nur Toleranz gegenüber fehlerhaften Clients, damit ein Stempel (und seine Offline-Wiederholung) nicht an Koordinaten scheitert.'
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
            accuracy_m:
              type: number
              minimum: 0
              maximum: 100000
      required:
      - event_id
      - kind
      - occurred_at
      - device_recorded_at
      - channel
    TimeEventOrigin:
      type: string
      enum:
      - ONLINE
      - OFFLINE
      default: ONLINE
      description: 'Herkunft des Stempels. `OFFLINE` = in der lokalen Queue der Fahrer-App erfasst und nach Wiederverbindung übertragen (nur Kanal `APP`); `event_id` ist dann die `device_event_id` der Queue. Ein bereits bekannter Stempel (Wiederholung des Sync-Laufs) wird dauerhaft dedupliziert, auch nach Ablauf des 72-h-Response-Caches.'
    TimeEventConflict:
      type: string
      enum:
      - CLOCK_SKEW
      - INVALID_ORDER
      description: 'Möglicher Konflikt: `CLOCK_SKEW` = Gerätezeit unplausibel (Zukunft über Toleranz, offline zu alt oder Gerätezeit und Ereigniszeit weichen ab), `INVALID_ORDER` = Stempel passt nicht in die Ereignisfolge (nur offline; online ist doppeltes Einstempeln ein 409 `INVALID_STATE_TRANSITION`). Der Stempel bleibt unverändert; Klärung erst über den Korrekturantrag (M7).'
    TimeEventResultCode:
      type: string
      enum:
      - APPLIED
      - DUPLICATE
      - REVIEW_REQUIRED
      description: Ergebnis der Annahme (analog `/v1/driver/events`). `DUPLICATE` = bekannte Ereignis-ID, keine zweite Zeile (Status 200). `REVIEW_REQUIRED` = übernommen, aber als möglicher Konflikt markiert (Status 201).
    TimeEventBackfillCreate:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: common.yaml#/components/schemas/UUID
        person_ref:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/TimeEventKind'
        occurred_at:
          type: string
          format: date-time
          maxLength: 40
        time_zone:
          type: string
          maxLength: 64
          description: 'IANA-Zone, in der die Ereigniszeit lokal gelesen wird (z. B. `Europe/Berlin`); ohne Angabe die Plattformzone. `occurred_at` mit Offset ist ein eindeutiger Zeitpunkt; eine geschriebene Ortszeit in der Frühjahrslücke (z. B. 2026-03-29T02:30 in Europe/Berlin) wird mit 422 abgelehnt, es gibt keine stille Auswahl oder Verschiebung.'
        shift_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Begründung der Nacherfassung (kurzer Text, keine Gesundheitsangaben).
      required:
      - event_id
      - person_ref
      - kind
      - occurred_at
      - reason
    TimeEventKind:
      type: string
      enum:
      - WORK_START
      - WORK_END
      - BREAK_START
      - BREAK_END
      description: Arbeitsbeginn, Arbeitsende, Pausenbeginn, Pausenende.
    LocalTimePresentation:
      type: object
      additionalProperties: false
      description: Lokale Darstellung eines Zeitpunkts (TIM-005). `local` trägt immer den Offset der Zone; die beiden Herbst-02:30 unterscheiden sich in `+02:00` und `+01:00`.
      properties:
        local:
          type: string
          maxLength: 40
          description: Ortszeit als RFC 3339 mit dem in der Zone gültigen Offset.
        offset:
          type: string
          maxLength: 10
        operating_day:
          type: string
          format: date
          description: Bezugstag (lokales Datum des Zeitpunkts in der Zone).
        ambiguous:
          type: boolean
          description: Wahr, wenn die Ortszeit wegen der Herbstumstellung zweimal vorkommt (Offset anzeigen).
      required:
      - local
      - offset
      - operating_day
      - ambiguous
    TimeEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: common.yaml#/components/schemas/UUID
        person_ref:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/TimeEventKind'
        occurred_at:
          type: string
          format: date-time
        device_recorded_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        received_at:
          type: string
          format: date-time
          description: Serverempfangszeit.
        source:
          type: string
          enum:
          - APP
          - WEB
          - BACKFILL
          description: Erfassungsquelle; BACKFILL = Nacherfassung durch eine berechtigte Rolle.
        recorded_by:
          type: string
          maxLength: 200
          description: Urheber der Erfassung (Subject).
        shift_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        backfill_reason:
          oneOf:
          - type: string
            maxLength: 500
          - type: 'null'
        time_zone:
          type: string
          maxLength: 64
        occurred_at_local:
          $ref: '#/components/schemas/LocalTimePresentation'
        origin:
          $ref: '#/components/schemas/TimeEventOrigin'
        conflict_flag:
          oneOf:
          - $ref: '#/components/schemas/TimeEventConflict'
          - type: 'null'
          description: Möglicher Konflikt des Stempels, sonst `null`.
        result:
          $ref: '#/components/schemas/TimeEventResultCode'
      required:
      - time_zone
      - occurred_at_local
      - origin
      - conflict_flag
      - event_id
      - person_ref
      - kind
      - occurred_at
      - device_recorded_at
      - received_at
      - source
      - recorded_by
      - shift_id
      - backfill_reason
    TimeEventPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimeEvent'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
    TimeInterval:
      type: object
      additionalProperties: false
      properties:
        start:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Arbeitsbeginn; null bei Ende ohne Beginn.
        end:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Arbeitsende; null solange offen (fehlendes Ende, nie automatisch abgeschlossen).
        breaks:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              start:
                type: string
                format: date-time
              end:
                oneOf:
                - type: string
                  format: date-time
                - type: 'null'
            required:
            - start
            - end
        net_seconds:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
          description: Beginn bis Ende abzüglich Pausen in Sekunden; null, wenn Beginn oder Ende fehlt.
        flags:
          type: array
          maxItems: 10
          items:
            type: string
            enum:
            - MISSING_END
            - END_WITHOUT_START
            - BREAK_NOT_ENDED
        event_ids:
          type: array
          maxItems: 200
          items:
            $ref: common.yaml#/components/schemas/UUID
        time_zone:
          type: string
          maxLength: 64
        start_local:
          oneOf:
          - $ref: '#/components/schemas/LocalTimePresentation'
          - type: 'null'
        end_local:
          oneOf:
          - $ref: '#/components/schemas/LocalTimePresentation'
          - type: 'null'
        operating_day:
          oneOf:
          - type: string
            format: date
          - type: 'null'
          description: Bezugstag des Intervalls = lokales Datum des Beginns (Schicht über Mitternacht gehört zum Tag des Beginns).
      required:
      - start
      - end
      - breaks
      - net_seconds
      - flags
      - event_ids
      - time_zone
      - start_local
      - end_local
      - operating_day
    TimeIntervalList:
      type: object
      additionalProperties: false
      properties:
        person_ref:
          type: string
          maxLength: 200
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        intervals:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TimeInterval'
        anomalies:
          type: array
          maxItems: 1000
          description: Ereignisse, die zu keinem Arbeitsintervall passen (z. B. Pause außerhalb der Arbeit); sie bleiben erhalten und werden gekennzeichnet.
          items:
            type: object
            additionalProperties: false
            properties:
              event_id:
                $ref: common.yaml#/components/schemas/UUID
              code:
                type: string
                enum:
                - BREAK_OUTSIDE_WORK
                - BREAK_END_WITHOUT_START
                - BREAK_ALREADY_STARTED
            required:
            - event_id
            - code
      required:
      - person_ref
      - from
      - to
      - intervals
      - anomalies
    TimeTargetActualList:
      type: object
      additionalProperties: false
      properties:
        person_ref:
          type: string
          maxLength: 200
        timezone:
          type: string
          maxLength: 64
        days:
          type: array
          maxItems: 31
          items:
            $ref: '#/components/schemas/TimeTargetActualDay'
      required:
      - person_ref
      - timezone
      - days
    TimeTargetActualDay:
      type: object
      additionalProperties: false
      properties:
        day:
          type: string
          format: date
          maxLength: 10
        planned:
          type: array
          maxItems: 50
          description: 'Soll, geplante Schichten des Betriebstags (ohne Entwürfe).'
          items:
            type: object
            additionalProperties: false
            properties:
              shift_id:
                $ref: common.yaml#/components/schemas/UUID
              starts_at:
                type: string
                format: date-time
                maxLength: 40
              ends_at:
                type: string
                format: date-time
                maxLength: 40
              timezone:
                type: string
                maxLength: 64
              planned_seconds:
                type: integer
                format: int64
                minimum: 0
                maximum: 9007199254740991
              state:
                type: string
                maxLength: 40
            required:
            - shift_id
            - starts_at
            - ends_at
            - timezone
            - planned_seconds
            - state
        planned_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        actual:
          type: array
          maxItems: 100
          description: 'Ist, aus Zeitereignissen abgeleitete Intervalle (nie gespeichert).'
          items:
            $ref: '#/components/schemas/TimeInterval'
        actual_net_seconds:
          oneOf:
          - type: integer
            format: int64
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
          description: Summe der Nettodauern; null ohne vollständige Ist-Buchung (nie mit dem Soll gefüllt).
        flags:
          type: array
          maxItems: 3
          items:
            type: string
            enum:
            - NO_ACTUAL_BOOKING
            - ACTUAL_WITHOUT_PLAN
            - ACTUAL_INCOMPLETE
        hints:
          type: array
          maxItems: 100
          description: Regelhinweise (Ruhezeit, Tagesarbeitszeit, Pflichtpause; WP-M4-13) für den Tag aus Plan und Ist; nur in der Eigensicht der Person, sonst leer. Warnungen, keine Rechtsentscheidung.
          items:
            $ref: common.yaml#/components/schemas/RuleHint
      required:
      - day
      - planned
      - planned_seconds
      - actual
      - actual_net_seconds
      - flags
