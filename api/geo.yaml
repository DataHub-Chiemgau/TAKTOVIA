    GeoStopAccessibility:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          const: '1.0'
        step_free:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
        wheelchair_boarding:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
        tactile_guidance:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
        shelter:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
        verified_at:
          type: string
          format: date-time
          maxLength: 40
        note:
          type: string
          maxLength: 200
      required:
      - schema_version
      - step_free
      - wheelchair_boarding
      description: Schema `stop-accessibility.v1`; `UNVERIFIED` ist nicht `YES` (M2 OP-41).
    GeoStop:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        stop_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        name:
          type: string
          minLength: 1
          maxLength: 200
        point:
          $ref: common.yaml#/components/schemas/Point
        accessibility:
          $ref: '#/components/schemas/GeoStopAccessibility'
        traffic_products:
          $ref: '#/components/schemas/GeoTrafficProducts'
        active:
          type: boolean
          description: Aktivstatus dieser Revision; eine inaktive Revision wird weder in der Haltepunktsuche noch als Abhol-/Zielpunkt eines Angebots geliefert.
        approved_by:
          type: string
          minLength: 1
          maxLength: 200
          description: Freigebender Akteur (Annahme OP-9; Pseudonym user:<uuid>).
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - id
      - stop_id
      - revision
      - name
      - point
      - accessibility
      - traffic_products
      - active
      - approved_by
      - valid_from
      - valid_to
    GeoTrafficProducts:
      type: array
      minItems: 1
      maxItems: 10
      uniqueItems: true
      items:
        type: string
        pattern: ^[A-Z][A-Z0-9_]{1,39}$
      description: Zulässige Verkehrsprodukte (Kennung wie `traffic_product` der Dienstversion); ein Haltepunkt wird nur für Dienste angeboten, deren Verkehrsprodukt hier steht.
    GeoStopPassenger:
      type: object
      additionalProperties: false
      description: 'Fahrgastsicht auf einen Haltepunkt (WP-M2-40, PAX-004) ohne interne Felder (`approved_by`, Aktivstatus, Verkehrsprodukte, Gültigkeit): geliefert werden nur aktive, jetzt wirksame, für den Dienst zulässige Haltepunkte. `distance_m` ist die Luftlinie zum Suchpunkt (`near_*`), sonst null.'
      properties:
        stop_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        name:
          type: string
          minLength: 1
          maxLength: 200
        point:
          $ref: common.yaml#/components/schemas/Point
        accessibility:
          $ref: '#/components/schemas/GeoStopAccessibility'
        distance_m:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
      required:
      - stop_id
      - revision
      - name
      - point
      - accessibility
      - distance_m
    GeoServiceAreaPassenger:
      type: object
      additionalProperties: false
      description: 'Fahrgastsicht auf ein wirksames Bediengebiet (WP-M2-40): `area` ist generalisiert (nur zur Anzeige, nie für Prüfungen), `area_square_km` und `bounds` speisen die Textbeschreibung.'
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        area:
          $ref: '#/components/schemas/GeoMultiPolygon'
        area_square_km:
          type: number
          minimum: 0
        bounds:
          type: object
          additionalProperties: false
          properties:
            min_latitude:
              type: number
            min_longitude:
              type: number
            max_latitude:
              type: number
            max_longitude:
              type: number
          required:
          - min_latitude
          - min_longitude
          - max_latitude
          - max_longitude
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - id
      - service_id
      - revision
      - area
      - area_square_km
      - bounds
      - valid_from
      - valid_to
    GeoStopUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        point:
          $ref: common.yaml#/components/schemas/Point
        accessibility:
          $ref: '#/components/schemas/GeoStopAccessibility'
        traffic_products:
          $ref: '#/components/schemas/GeoTrafficProducts'
        active:
          type: boolean
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - name
      - point
      - accessibility
      - traffic_products
      - active
      - valid_from
    GeoStopCreate:
      type: object
      additionalProperties: false
      properties:
        stop_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        name:
          type: string
          minLength: 1
          maxLength: 200
        point:
          $ref: common.yaml#/components/schemas/Point
        accessibility:
          $ref: '#/components/schemas/GeoStopAccessibility'
        traffic_products:
          $ref: '#/components/schemas/GeoTrafficProducts'
        active:
          type: boolean
          default: true
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - name
      - point
      - accessibility
      - traffic_products
      - valid_from
      description: '`stop_id` ist optional (vorgegebener stabiler Identifikator, z. B. beim Import) und darf noch nicht vergeben sein (sonst 409); neue Revisionen entstehen mit PUT.'
      examples:
      - name: Marktplatz
        point:
          latitude: 51.05
          longitude: 13.74
        accessibility:
          schema_version: '1.0'
          step_free: 'YES'
          wheelchair_boarding: UNVERIFIED
        traffic_products:
        - AREA_ON_DEMAND
        valid_from: '2026-12-01T00:00:00+01:00'
    GeoStopPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
