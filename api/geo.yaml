paths:
  /v1/service-areas:
    get:
      summary: Bediengebiete auflisten
      operationId: listServiceAreas
      security:
      - oidc:
        - geo:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - name: service_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Filter auf einen Dienst.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoServiceAreaPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Bediengebiet anlegen (neue Revision)
      operationId: createServiceArea
      security:
      - oidc:
        - geo:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoServiceAreaCreate'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoServiceArea'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/service-areas/{area_id}:
    get:
      summary: Bediengebiet lesen
      description: '`area_id` ist der stabile Gebietsschlüssel (Feld `id`); geliefert wird die jüngste Revision oder die mit `revision` angeforderte. ETag = Revision. Fremder oder unbekannter Gebietsschlüssel: 404.'
      operationId: getServiceArea
      security:
      - oidc:
        - geo:read
      parameters:
      - name: area_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: revision
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        description: Nur diese Revision der Kette (ältere Revisionen bleiben lesbar); ohne Angabe die jüngste.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoServiceArea'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    put:
      summary: Neue Revision des Bediengebiets anlegen
      description: 'Legt die Revision + 1 an (If-Match = zuletzt gelesene Revision; veraltet 412, fehlend 428). Ungültige Geometrie, nicht geschlossener Ring oder `valid_to <= valid_from`: 422 mit Feldverweis, nichts gespeichert. Überlappende Wirksamkeit je Dienst: 409. Eine offene Vorgängerrevision endet mit dem Beginn der neuen; ältere Revisionen bleiben lesbar.'
      operationId: updateServiceArea
      security:
      - oidc:
        - geo:write
      parameters:
      - name: area_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoServiceAreaUpdate'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoServiceArea'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/stops:
    get:
      summary: Haltepunkte auflisten
      operationId: listStops
      security:
      - oidc:
        - geo:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoStopPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Haltepunkt anlegen (neue Revision)
      operationId: createStop
      security:
      - oidc:
        - geo:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoStopCreate'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoStop'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    GeoMultiPolygon:
      type: object
      additionalProperties: false
      properties:
        type:
          const: MultiPolygon
        coordinates:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: array
              minItems: 4
              maxItems: 10000
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: number
      required:
      - type
      - coordinates
      description: GeoJSON (RFC 7946), Koordinatenreihenfolge [longitude, latitude], SRID 4326; gültige Geometrie (ST_IsValid), sonst
        422.
    GeoServiceArea:
      type: object
      additionalProperties: false
      description: Eine Revision eines Bediengebiets. `id` ist der stabile Gebietsschlüssel der Revisionskette, `revision_id` die Zeile dieser Revision (Bezug bestehender Zusagen).
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        revision_id:
          $ref: common.yaml#/components/schemas/UUID
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        area:
          $ref: '#/components/schemas/GeoMultiPolygon'
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - id
      - revision_id
      - service_id
      - revision
      - area
      - valid_from
      - valid_to
    GeoServiceAreaUpdate:
      type: object
      additionalProperties: false
      properties:
        area:
          $ref: '#/components/schemas/GeoMultiPolygon'
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - area
      - valid_from
    GeoServiceAreaCreate:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        area:
          $ref: '#/components/schemas/GeoMultiPolygon'
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - service_id
      - area
      - valid_from
      examples:
      - service_id: 00000000-0000-4000-8000-000000000005
        area:
          type: MultiPolygon
          coordinates:
          - - - - 13.7
                - 51.0
              - - 13.8
                - 51.0
              - - 13.8
                - 51.1
              - - 13.7
                - 51.1
              - - 13.7
                - 51.0
        valid_from: '2026-12-01T00:00:00+01:00'
        valid_to: null
    GeoServiceAreaPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GeoServiceArea'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
    GeoStopAccessibility:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          const: '1.0'
        step_free:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
        wheelchair_boarding:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
        tactile_guidance:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
        shelter:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
      required:
      - schema_version
      - step_free
      - wheelchair_boarding
      description: Schema `stop-accessibility.v1`; `UNVERIFIED` ist nicht `YES` (M2 OP-41).
    GeoStop:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        stop_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        name:
          type: string
          minLength: 1
          maxLength: 200
        point:
          $ref: common.yaml#/components/schemas/Point
        accessibility:
          $ref: '#/components/schemas/GeoStopAccessibility'
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - id
      - stop_id
      - revision
      - name
      - point
      - accessibility
      - valid_from
      - valid_to
    GeoStopCreate:
      type: object
      additionalProperties: false
      properties:
        stop_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
        name:
          type: string
          minLength: 1
          maxLength: 200
        point:
          $ref: common.yaml#/components/schemas/Point
        accessibility:
          $ref: '#/components/schemas/GeoStopAccessibility'
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - name
      - point
      - accessibility
      - valid_from
      description: '`stop_id` fehlt für einen neuen Haltepunkt, sonst entsteht eine neue Revision des Haltepunkts.'
      examples:
      - name: Marktplatz
        point:
          latitude: 51.05
          longitude: 13.74
        accessibility:
          schema_version: '1.0'
          step_free: 'YES'
          wheelchair_boarding: UNVERIFIED
        valid_from: '2026-12-01T00:00:00+01:00'
    GeoStopPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GeoStop'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
