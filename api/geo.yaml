paths:
  /v1/service-areas:
    get:
      summary: Bediengebiete auflisten
      operationId: listServiceAreas
      security:
      - oidc:
        - geo:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - name: service_id
        in: query
        required: false
        schema: &id002
          $ref: common.yaml#/components/schemas/UUID
        description: Filter auf einen Dienst.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoServiceAreaPage'
        '400': &id001
          $ref: common.yaml#/components/responses/Problem
        '401': *id001
        '403': *id001
        '422': *id001
        '429': *id001
        '503': *id001
    post:
      summary: Bediengebiet anlegen (neue Revision)
      operationId: createServiceArea
      security:
      - oidc:
        - geo:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoServiceAreaCreate'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoServiceArea'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
        '409': *id001
        '422': *id001
        '429': *id001
        '503': *id001
  /v1/stops:
    get:
      summary: Haltepunkte auflisten
      operationId: listStops
      security:
      - oidc:
        - geo:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoStopPage'
        '400': *id001
        '401': *id001
        '403': *id001
        '422': *id001
        '429': *id001
        '503': *id001
    post:
      summary: Haltepunkt anlegen (neue Revision)
      operationId: createStop
      security:
      - oidc:
        - geo:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoStopCreate'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoStop'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400': *id001
        '401': *id001
        '403': *id001
        '409': *id001
        '422': *id001
        '429': *id001
        '503': *id001
components:
  schemas:
    GeoMultiPolygon:
      type: object
      additionalProperties: false
      properties:
        type:
          const: MultiPolygon
        coordinates:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: array
              minItems: 4
              maxItems: 10000
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: number
      required:
      - type
      - coordinates
      description: GeoJSON (RFC 7946), Koordinatenreihenfolge [longitude, latitude], SRID 4326; gültige Geometrie (ST_IsValid), sonst
        422.
    GeoServiceArea:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        service_id: *id002
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        area:
          $ref: '#/components/schemas/GeoMultiPolygon'
        valid_from: &id003
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - *id003
          - type: 'null'
      required:
      - id
      - service_id
      - revision
      - area
      - valid_from
      - valid_to
    GeoServiceAreaCreate:
      type: object
      additionalProperties: false
      properties:
        service_id: *id002
        area:
          $ref: '#/components/schemas/GeoMultiPolygon'
        valid_from: *id003
        valid_to:
          oneOf:
          - *id003
          - type: 'null'
      required:
      - service_id
      - area
      - valid_from
      examples:
      - service_id: 00000000-0000-4000-8000-000000000005
        area:
          type: MultiPolygon
          coordinates:
          - - - - 13.7
                - 51.0
              - - 13.8
                - 51.0
              - - 13.8
                - 51.1
              - - 13.7
                - 51.1
              - - 13.7
                - 51.0
        valid_from: '2026-12-01T00:00:00+01:00'
        valid_to: null
    GeoServiceAreaPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GeoServiceArea'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
    GeoStopAccessibility:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          const: '1.0'
        step_free:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
        wheelchair_boarding:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
        tactile_guidance:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
        shelter:
          type: string
          enum:
          - 'YES'
          - 'NO'
          - UNVERIFIED
      required:
      - schema_version
      - step_free
      - wheelchair_boarding
      description: Schema `stop-accessibility.v1`; `UNVERIFIED` ist nicht `YES` (M2 OP-41).
    GeoStop:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        stop_id: *id002
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        name:
          type: string
          minLength: 1
          maxLength: 200
        point:
          $ref: common.yaml#/components/schemas/Point
        accessibility:
          $ref: '#/components/schemas/GeoStopAccessibility'
        valid_from: *id003
        valid_to:
          oneOf:
          - *id003
          - type: 'null'
      required:
      - id
      - stop_id
      - revision
      - name
      - point
      - accessibility
      - valid_from
      - valid_to
    GeoStopCreate:
      type: object
      additionalProperties: false
      properties:
        stop_id:
          oneOf:
          - *id002
          - type: 'null'
        name:
          type: string
          minLength: 1
          maxLength: 200
        point:
          $ref: common.yaml#/components/schemas/Point
        accessibility:
          $ref: '#/components/schemas/GeoStopAccessibility'
        valid_from: *id003
        valid_to:
          oneOf:
          - *id003
          - type: 'null'
      required:
      - name
      - point
      - accessibility
      - valid_from
      description: '`stop_id` fehlt für einen neuen Haltepunkt, sonst entsteht eine neue Revision des Haltepunkts.'
      examples:
      - name: Marktplatz
        point:
          latitude: 51.05
          longitude: 13.74
        accessibility:
          schema_version: '1.0'
          step_free: 'YES'
          wheelchair_boarding: UNVERIFIED
        valid_from: '2026-12-01T00:00:00+01:00'
    GeoStopPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GeoStop'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
