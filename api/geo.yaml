paths:
  /v1/service-areas:
    get:
      summary: Bediengebiete auflisten
      description: 'Rollen mit Stammdatenrecht (`geo:write`) erhalten die jüngste Revision je Gebiet (`GeoServiceArea`). Alle anderen, insbesondere Fahrgäste, erhalten die **Fahrgastsicht** (`GeoServiceAreaPassenger`): nur zum Zeitpunkt `at` (Standard jetzt) wirksame Gebiete mit generalisierter Geometrie (vereinfacht, ca. 10 m gerundet; nur zur Anzeige), ohne Zonenrolle und ohne Revisions-IDs; höchstens `limit` Einträge, ohne Folgeseiten (`next_cursor` stets null).'
      operationId: listServiceAreas
      security:
      - oidc:
        - geo:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - name: service_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Filter auf einen Dienst.
      - name: at
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/Timestamp
        description: 'Nur Fahrgastsicht (Rollen ohne Stammdatenrecht): Zeitpunkt der Wirksamkeit (Standard jetzt).'
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoServiceAreaPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Bediengebiet anlegen (neue Revision)
      operationId: createServiceArea
      security:
      - oidc:
        - geo:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoServiceAreaCreate'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoServiceArea'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/service-areas/{area_id}:
    get:
      summary: Bediengebiet lesen
      description: '`area_id` ist der stabile Gebietsschlüssel (Feld `id`); geliefert wird die jüngste Revision oder die mit `revision` angeforderte. ETag = Revision. Fremder oder unbekannter Gebietsschlüssel: 404.'
      operationId: getServiceArea
      security:
      - oidc:
        - geo:read
      parameters:
      - name: area_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: revision
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        description: Nur diese Revision der Kette (ältere Revisionen bleiben lesbar); ohne Angabe die jüngste.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GeoServiceArea'
                - $ref: '#/components/schemas/GeoServiceAreaPassenger'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    put:
      summary: Neue Revision des Bediengebiets anlegen
      description: 'Legt die Revision + 1 an (If-Match = zuletzt gelesene Revision; veraltet 412, fehlend 428). Ungültige Geometrie, nicht geschlossener Ring oder `valid_to <= valid_from`: 422 mit Feldverweis, nichts gespeichert. Überlappende Wirksamkeit je Dienst: 409. Eine offene Vorgängerrevision endet mit dem Beginn der neuen; ältere Revisionen bleiben lesbar.'
      operationId: updateServiceArea
      security:
      - oidc:
        - geo:write
      parameters:
      - name: area_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoServiceAreaUpdate'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoServiceArea'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/stops:
    get:
      summary: Haltepunkte auflisten
      description: 'Fahrgäste und alle Rollen ohne Stammdatenrecht erhalten ausschließlich aktive, zum Zeitpunkt `at` (Standard jetzt) wirksame Haltepunkte (GEO-002). Mit `service_id` werden zusätzlich nur Haltepunkte geliefert, deren zulässiges Verkehrsprodukt zur zu `at` wirksamen Dienstversion passt; ohne wirksame Dienstversion ist die Liste leer. Rollen mit Stammdatenrecht sehen ohne `service_id` und `at` die jüngste Revision je Haltepunkt, `active` filtert dann nach Aktivstatus. `near_*` begrenzt auf einen Umkreis (Meter).'
      operationId: listStops
      security:
      - oidc:
        - geo:read
      parameters:
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - name: service_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Dienst, für den buchbare Haltepunkte gesucht werden.
      - name: at
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/Timestamp
        description: Zeitpunkt der Wirksamkeit (Standard jetzt).
      - name: near_latitude
        in: query
        required: false
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: near_longitude
        in: query
        required: false
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: near_radius_m
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1000
        description: Umkreis in Metern um near_latitude/near_longitude.
      - name: active
        in: query
        required: false
        schema:
          type: boolean
        description: Nur für Rollen mit Stammdatenrecht wirksam; alle anderen sehen nur aktive Haltepunkte.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoStopPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Haltepunkt anlegen
      description: 'Legt einen neuen Haltepunkt (Revision 1) an; `approved_by` ist der anlegende Akteur. Ein vorgegebener `stop_id`, der bereits existiert: 409. Neue Revisionen (auch die Deaktivierung) entstehen mit PUT /v1/stops/{stop_id}.'
      operationId: createStop
      security:
      - oidc:
        - geo:write
      parameters:
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoStopCreate'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoStop'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/stops/{stop_id}:
    get:
      summary: Haltepunkt lesen
      description: '`stop_id` ist der stabile Identifikator. Geliefert wird die jüngste Revision (Fahrgäste: nur wenn aktiv und jetzt wirksam, sonst 404). ETag = Revision.'
      operationId: getStop
      security:
      - oidc:
        - geo:read
      parameters:
      - name: stop_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: revision
        in: query
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        description: Nur diese Revision (nur Rollen mit Stammdatenrecht); ohne Angabe die jüngste.
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GeoStop'
                - $ref: '#/components/schemas/GeoStopPassenger'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    put:
      summary: Neue Revision des Haltepunkts anlegen (auch Deaktivierung)
      description: 'Legt die Revision + 1 an (If-Match = zuletzt gelesene Revision; veraltet 412, fehlend 428). Die Deaktivierung ist eine Revision mit `active: false`; bestehende Zusagen behalten ihren Haltepunktsnapshot. Eine offene Vorgängerrevision endet mit dem Beginn der neuen.'
      operationId: updateStop
      security:
      - oidc:
        - geo:write
      parameters:
      - name: stop_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoStopUpdate'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoStop'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/services/{service_id}/relation-rules:
    get:
      summary: Erlaubte Zielpunkte des Dienstes lesen
      description: 'Jüngste Mengenversion der erlaubten Zielpunkte; ETag = Revision. Revision 0 = keine Regel (keine Einschränkung durch Zielpunkte). Die Zonenrollen stehen an den Bediengebieten (`zone_role`).'
      operationId: getServiceRelationRule
      security:
      - oidc:
        - geo:read
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoRelationRule'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    put:
      summary: Erlaubte Zielpunkte als neue Mengenversion veröffentlichen
      description: 'Legt eine neue Version der Zielpunktmenge an (If-Match = zuletzt gelesene Revision, 0 = noch keine). Jeder Zielpunkt muss ein Haltepunkt des Mandanten sein (sonst 422 mit Pointer). Eine leere Menge hebt die Einschränkung auf. Überlappende Wirksamkeit 409, veraltet 412, fehlend 428; `reason` wird auditiert.'
      operationId: putServiceRelationRule
      security:
      - oidc:
        - geo:write
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - $ref: common.yaml#/components/parameters/Traceparent
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeoRelationRuleInput'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoRelationRule'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
  /v1/services/{service_id}/relation-check:
    get:
      summary: Relation auf Zulässigkeit prüfen (Zonen und Zielpunkte)
      description: 'Fachoperation „Relation zulässig?“: Start in der wirksamen Startzone, Ziel in der Zielzone und, wenn eine Zielpunktmenge gilt, an einem erlaubten aktiven Zielpunkt. Die Ablehnung trägt genau einen Grund (OUTSIDE_AREA = Gebiet, RULE_FORBIDDEN = Regelverbot; Katalog von WP-M2-13). Die Rückrichtung wird unabhängig bewertet; Punkte auf der Zonengrenze gelten als innerhalb.'
      operationId: checkServiceRelation
      security:
      - oidc:
        - geo:read
      parameters:
      - name: service_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
      - name: origin_latitude
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: origin_longitude
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: destination_latitude
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
      - name: destination_longitude
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
      - name: destination_stop_id
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: 'Ziel als Haltepunkt (stop_id): dann zählen dessen zum Zeitpunkt wirksame Koordinate (statt destination_latitude/-longitude) und die Zielpunktmenge; ohne Angabe ist das Ziel eine freie Koordinate.'
      - name: at
        in: query
        required: false
        schema:
          $ref: common.yaml#/components/schemas/Timestamp
        description: Zeitpunkt der Prüfung (Standard jetzt).
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoRelationCheck'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
components:
  schemas:
    GeoMultiPolygon:
      type: object
      additionalProperties: false
      properties:
        type:
          const: MultiPolygon
        coordinates:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: array
            minItems: 1
            maxItems: 100
            items:
              type: array
              minItems: 4
              maxItems: 10000
              items:
                type: array
                minItems: 2
                maxItems: 2
                items:
                  type: number
      required:
      - type
      - coordinates
      description: GeoJSON (RFC 7946), Koordinatenreihenfolge [longitude, latitude], SRID 4326; gültige Geometrie (ST_IsValid), sonst
        422.
    GeoServiceArea:
      type: object
      additionalProperties: false
      description: Eine Revision eines Bediengebiets. `id` ist der stabile Gebietsschlüssel der Revisionskette, `revision_id` die Zeile dieser Revision (Bezug bestehender Zusagen).
      properties:
        id:
          $ref: common.yaml#/components/schemas/UUID
        revision_id:
          $ref: common.yaml#/components/schemas/UUID
        zone_role:
          type: string
          enum:
          - ORIGIN
          - DESTINATION
          - BOTH
          description: 'Zonenrolle (WP-M2-06, PA-04): nur Start, nur Ziel oder beides. Je Dienst und Zeitpunkt höchstens eine wirksame Start- und eine wirksame Zielzone (`BOTH` zählt für beide). Beim PUT: fehlt das Feld, bleibt die Rolle der Vorgängerrevision.'
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        area:
          $ref: '#/components/schemas/GeoMultiPolygon'
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - id
      - revision_id
      - zone_role
      - service_id
      - revision
      - area
      - valid_from
      - valid_to
    GeoServiceAreaUpdate:
      type: object
      additionalProperties: false
      properties:
        area:
          $ref: '#/components/schemas/GeoMultiPolygon'
        zone_role:
          type: string
          enum:
          - ORIGIN
          - DESTINATION
          - BOTH
          description: 'Zonenrolle (WP-M2-06, PA-04): nur Start, nur Ziel oder beides. Je Dienst und Zeitpunkt höchstens eine wirksame Start- und eine wirksame Zielzone (`BOTH` zählt für beide). Beim PUT: fehlt das Feld, bleibt die Rolle der Vorgängerrevision.'
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - area
      - valid_from
    GeoServiceAreaCreate:
      type: object
      additionalProperties: false
      properties:
        service_id:
          $ref: common.yaml#/components/schemas/UUID
        area:
          $ref: '#/components/schemas/GeoMultiPolygon'
        zone_role:
          type: string
          enum:
          - ORIGIN
          - DESTINATION
          - BOTH
          default: BOTH
          description: 'Zonenrolle (WP-M2-06, PA-04): nur Start, nur Ziel oder beides. Je Dienst und Zeitpunkt höchstens eine wirksame Start- und eine wirksame Zielzone (`BOTH` zählt für beide). Beim PUT: fehlt das Feld, bleibt die Rolle der Vorgängerrevision.'
        valid_from:
          $ref: common.yaml#/components/schemas/Timestamp
        valid_to:
          oneOf:
          - $ref: common.yaml#/components/schemas/Timestamp
          - type: 'null'
      required:
      - service_id
      - area
      - valid_from
      examples:
      - service_id: 00000000-0000-4000-8000-000000000005
        area:
          type: MultiPolygon
          coordinates:
