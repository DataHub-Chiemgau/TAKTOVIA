paths:
  /v1/runs/{run_id}/revisions:
    get:
      summary: Planrevisionen eines Umlaufs lesen
      operationId: listRunRevisions
      security:
      - oidc:
        - operator:read
      description: 'Absteigend nach Revision; Fremder Umlauf: 404.'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Umlauf-ID.
      - $ref: common.yaml#/components/parameters/Limit
      - $ref: common.yaml#/components/parameters/Cursor
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunRevisionPage'
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
    post:
      summary: Manuelle Planänderung (Plan-CAS)
      operationId: createRunRevision
      security:
      - oidc:
        - dispatch:write
      description: 'If-Match trägt die gelesene Planrevision (gleich `base_plan_revision`); veraltet: 412 REVISION_MISMATCH mit der aktuellen
        Revision im ETag. Gesperrtes oder nicht freigegebenes Zielfahrzeug (Sicherheitsprüfung im Commit): 409 CONFLICT; Überbuchung einer Dimension:
        409 CAPACITY_UNAVAILABLE; Änderung im geschützten Stopphorizont (`protected_stop_horizon_min`), Überschreitung von `max_reassignments`
        und Verletzung zugesagter Zeitfenster: 409 mit den Codes PROTECTED_STOP_HORIZON, MAX_REASSIGNMENTS_EXCEEDED, PROMISE_WINDOW_VIOLATION, außer
        der dokumentierte Ausnahmeweg (`exception`) überstimmt genau diese Regel. Begründung ist Pflicht (OPS-003). Fremder Umlauf, Fahrzeug eines nicht
        berechtigten Dienstes und fremder Mandant: 404. Mit `compare_only` nur Planvergleich und Folgen, ohne Commit (200).'
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          $ref: common.yaml#/components/schemas/UUID
        description: Umlauf-ID.
      - $ref: common.yaml#/components/parameters/IdempotencyKey
      - $ref: common.yaml#/components/parameters/IfMatch
      - $ref: common.yaml#/components/parameters/Traceparent
      responses:
        '200':
          description: Planvergleich ohne Commit (`compare_only`), `committed` ist false.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunRevision'
        '201':
          description: Angelegt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
            Location:
              schema:
                type: string
              description: URL der angelegten Ressource.
        '400':
          $ref: common.yaml#/components/responses/Problem
        '401':
          $ref: common.yaml#/components/responses/Problem
        '403':
          $ref: common.yaml#/components/responses/Problem
        '404':
          $ref: common.yaml#/components/responses/Problem
        '409':
          $ref: common.yaml#/components/responses/Problem
        '412':
          $ref: common.yaml#/components/responses/Problem
        '422':
          $ref: common.yaml#/components/responses/Problem
        '428':
          $ref: common.yaml#/components/responses/Problem
        '429':
          $ref: common.yaml#/components/responses/Problem
        '503':
          $ref: common.yaml#/components/responses/Problem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRevisionCreate'
components:
  schemas:
    RunStopChange:
      type: object
      description: 'Änderungen gelten der Reihe nach, `new_sequence` ist die 1-basierte Position zum Zeitpunkt der Änderung. MOVE verschiebt den Stopp
        `route_stop_id` des Umlaufs; REMOVE nimmt `booking_id` (Einstieg und Ausstieg) aus dem Plan, `route_stop_id` ist ein Stopp dieser Buchung; INSERT
        übernimmt die Bewegung von `booking_id` am Stopp `route_stop_id` eines anderen Umlaufs als neuen Stopp an `new_sequence` (Einstieg und Ausstieg
        je eine Änderung; Umbuchung in einer Transaktion). Die Planzeiten behalten ihr Zeitraster (aufsteigend neu vergeben).'
      additionalProperties: false
      properties:
        route_stop_id:
          $ref: common.yaml#/components/schemas/UUID
        change:
          type: string
          enum:
          - MOVE
          - REMOVE
          - INSERT
        new_sequence:
          oneOf:
          - type: integer
            minimum: 1
          - type: 'null'
        booking_id:
          oneOf:
          - $ref: common.yaml#/components/schemas/UUID
          - type: 'null'
      required:
      - route_stop_id
      - change
    RunRevisionCreate:
      type: object
      additionalProperties: false
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/RunStopChange'
        reason:
          type: string
          minLength: 1
          maxLength: 500
        base_plan_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        compare_only:
          type: boolean
        exception:
          type: object
          additionalProperties: false
          description: 'Dokumentierter Ausnahmeweg (Annahme bis zur Freigabe durch den Auftraggeber): überstimmt ausdrücklich genannte Regeln mit Begründung
            (10 bis 500 Zeichen); Routeninvarianten, Kapazität, Sperre und Freigabe des Zielfahrzeugs lassen sich nie überstimmen. Wird gesondert im Audit protokolliert.'
          properties:
            rules:
              type: array
              minItems: 1
              maxItems: 3
              uniqueItems: true
              items:
                type: string
                enum:
                - PROTECTED_STOP_HORIZON
                - PROMISE_WINDOW
                - MAX_REASSIGNMENTS
            justification:
              type: string
              minLength: 10
              maxLength: 500
          required:
          - rules
          - justification
      required:
      - changes
      - reason
      - base_plan_revision
      description: Manuelle Planänderung mit Begründung (OPS-003). `base_plan_revision` ist die gelesene Planrevision (Plan-CAS); `compare_only`
        liefert nur den Planvergleich ohne Commit. Der Server prüft im Commit die Sicherheitsrevision (Sperre) und verschlechtert keine bestehende
        Zusage ohne Klärfall.
    RunRevision:
      type: object
      additionalProperties: false
      properties:
        run_id:
          $ref: common.yaml#/components/schemas/UUID
        plan_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        previous_revision:
          oneOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
        cause:
          type: string
          enum:
          - BOOKING_INSERTED
          - BOOKING_REMOVED
          - MANUAL_CHANGE
          - REPLAN
        reason:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 500
          - type: 'null'
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          minLength: 1
          maxLength: 200
        diff:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              route_stop_id:
                $ref: common.yaml#/components/schemas/UUID
              kind:
                type: string
                enum:
                - ADDED
                - REMOVED
                - MOVED
                - TIME_CHANGED
              old_sequence:
                oneOf:
                - type: integer
                  minimum: 1
                - type: 'null'
              new_sequence:
                oneOf:
                - type: integer
                  minimum: 1
                - type: 'null'
            required:
            - route_stop_id
            - kind
            - old_sequence
            - new_sequence
        committed:
          type: boolean
        impacts:
          type: array
          maxItems: 200
          description: Folgen für betroffene Buchungen (Zeiten vor und nach der Änderung, verletzte Zusagefenster).
          items:
            type: object
            additionalProperties: false
            properties:
              booking_id:
                $ref: common.yaml#/components/schemas/UUID
              kind:
                type: string
                enum:
                - ADDED
                - REMOVED
                - TIME_CHANGED
                - STOP_CHANGED
                - TOUCHED
              pickup_before:
                oneOf:
                - type: string
                  format: date-time
                - type: 'null'
              pickup_after:
                oneOf:
                - type: string
                  format: date-time
                - type: 'null'
              dropoff_before:
                oneOf:
                - type: string
                  format: date-time
                - type: 'null'
              dropoff_after:
                oneOf:
                - type: string
                  format: date-time
                - type: 'null'
              window_violations:
                type: array
                maxItems: 10
                items:
                  type: string
            required:
            - booking_id
            - kind
        exception:
          oneOf:
          - type: object
            additionalProperties: false
            properties:
              rules:
                type: array
                maxItems: 3
                items:
                  type: string
              justification:
                type: string
                maxLength: 500
            required:
            - rules
            - justification
          - type: 'null'
          description: Genutzter Ausnahmeweg dieser Revision, sonst null.
      required:
      - run_id
      - plan_revision
      - previous_revision
      - cause
      - reason
      - created_at
      - created_by
      - diff
      - committed
      description: Planrevision mit Planvergleich (Kap. 05 §5.7).
    RunRevisionPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunRevision'
          maxItems: 100
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        as_of:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - as_of
