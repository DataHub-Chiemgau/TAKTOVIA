# Testläufe laufen lokal ohne TLS (PostgreSQL und HTTP im Klartext auf Loopback); der TransportGuard wird in
# TransportSecurityTest mit eigenen Eigenschaften geprüft. Produktivkonfiguration: application.yml.
taktovia.environment=local
TAKTOVIA_DB_SSLMODE=disable
server.ssl.enabled=false
# Die bestehenden Gerüsttests laufen ohne Anmeldung (Prüfidentität aus Testheadern). Der Ressourcenserver (WP-M1-04) wird in den Tests unter
# de.taktovia.app.security mit taktovia.idp.enabled=true und einem lokalen Test-Issuer gestartet.
taktovia.idp.enabled=false
