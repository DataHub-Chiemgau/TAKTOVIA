spring:
  application:
    name: taktovia
  datasource:
    # Ausschließlich die Runtime-Rolle; Migrator-Zugangsdaten gehören nicht in die Laufzeitkonfiguration.
    url: jdbc:postgresql://${TAKTOVIA_DB_HOST:127.0.0.1}:${TAKTOVIA_DB_PORT:5432}/${TAKTOVIA_DB_NAME:taktovia}
    username: taktovia_runtime
    password: ${TAKTOVIA_DB_RUNTIME_PASSWORD}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
