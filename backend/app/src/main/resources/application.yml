spring:
  application:
    name: taktovia
  datasource:
    # Ausschließlich die Runtime-Rolle; Migrator-Zugangsdaten gehören nicht in die Laufzeitkonfiguration.
    url: jdbc:postgresql://${TAKTOVIA_DB_HOST:127.0.0.1}:${TAKTOVIA_DB_PORT:5432}/${TAKTOVIA_DB_NAME:taktovia}?sslmode=${TAKTOVIA_DB_SSLMODE:verify-full}
    username: taktovia_runtime
    password: ${TAKTOVIA_DB_RUNTIME_PASSWORD}
server:
  port: ${PORT:8080}
  ssl:
    # Transportverschlüsselung (WP-M1-36): TLS 1.2/1.3; Schlüsselspeicher aus der Secret-Verwaltung eingehängt.
    enabled: ${TAKTOVIA_TLS_ENABLED:true}
    enabled-protocols: TLSv1.3,TLSv1.2
    key-store: ${TAKTOVIA_TLS_KEYSTORE:}
    key-store-type: PKCS12
    key-store-password: ${TAKTOVIA_TLS_KEYSTORE_PASSWORD:}
taktovia:
  fields:
    datasource:
      # Modulzugang für sensible Felder (WP-M1-31): Passwort ausdrücklich (Secret-Verwaltung); nur Entwicklung/Test leiten es aus dem Runtime-Passwort ab.
      password: ${TAKTOVIA_DB_FIELDS_PASSWORD:}
  # `local` nur für lokale Entwicklung und Tests; jede andere oder fehlende Angabe erzwingt TLS überall (TransportGuard).
  environment: ${TAKTOVIA_ENVIRONMENT:production}
  idp:
    # Ressourcenserver (WP-M1-04): Issuer der Identitätsdomäne dieser Umgebung (WP-M1-40: je Umgebung verschieden). Ohne Issuer kein Start.
    # Ausschalten (`false`) ist nur mit taktovia.environment=local zulässig. Weitere Einstellungen: docs/umsetzungsplan/vertraege/idp-realm.md
    enabled: ${TAKTOVIA_IDP_ENABLED:true}
    issuer-uri: ${TAKTOVIA_IDP_ISSUER_URI:}
    audience: ${TAKTOVIA_IDP_AUDIENCE:taktovia-api}
logging:
  level:
    # Spring MVC und Tomcat protokollieren auf DEBUG/TRACE Anfrage-Inhalte und Header (Passwörter, Token). Diese Logger bleiben fest auf INFO
    # (WP-M1-04, LH-6.2-IAM-002: keine Klartextpasswörter in Logs); PasswordLogScanTest belegt das.
    org.springframework.web: INFO
    org.apache.coyote: INFO
    org.apache.tomcat.util.http: INFO
management:
  server:
    # Verwaltungsport (WP-M5-03): Prometheus-Ansicht nur dort, getrennt vom Mandanten-API-Port und nur im Betriebsnetz erreichbar. Leer: kein eigener Port;
    # dann liegt /actuator/prometheus hinter der API-Authentifizierung (401 ohne Token), nie öffentlich.
    port: ${TAKTOVIA_MANAGEMENT_PORT:}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # Traces per OTLP an den Collector (infra/observability); Logs verlassen den Prozess nur über stdout (maskiert, WP-M5-06), nie per OTLP-Logexport,
  # da dieser an der Maskierung der Logausgabe vorbeiführen würde.
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  tracing:
    sampling:
      probability: ${TAKTOVIA_TRACE_SAMPLING:1.0}
    export:
      enabled: ${TAKTOVIA_TRACING_EXPORT:true}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${TAKTOVIA_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    resource-attributes:
      service.name: taktovia-core
      service.namespace: taktovia
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
