# Loki (WP-M5-03): zentrale Logablage. Aufbewahrung 14 Tage (Arbeitsannahme, OP-08/D-11 offen). NICHT GESTARTET.
# Die Betriebsprüfung "Log-Stichprobe" (tools/log_stichprobe.py --loki ...) liest gegen diese Ablage.
auth_enabled: false
server: { http_listen_port: 3100 }
common:
  path_prefix: /var/loki
  replication_factor: 1
  ring: { kvstore: { store: inmemory } }
  storage: { filesystem: { chunks_directory: /var/loki/chunks, rules_directory: /var/loki/rules } }
schema_config:
  configs:
    - { from: "2024-01-01", store: tsdb, object_store: filesystem, schema: v13, index: { prefix: index_, period: 24h } }
limits_config:
  retention_period: 336h
  allow_structured_metadata: true
compactor:
  working_directory: /var/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
