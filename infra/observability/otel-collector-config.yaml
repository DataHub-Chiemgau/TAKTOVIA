# OpenTelemetry-Collector, lokal (WP-M0-10). NICHT GESTARTET (kein Docker-Daemon); Syntax per YAML-Parser geprueft.
# Receiver: OTLP vom Backend. Metriken werden fuer Prometheus bereitgestellt (Port 8889),
# Traces gehen vorerst nur in das debug-Exporter-Log (Anzeige-Werkzeug fuer Traces: offen, siehe README).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Datenschutz (Kap. 01 §1.1, Kap. 05 §5.1): keine Personen-, Kontakt- oder Ortssuchdaten in Telemetrie.
  attributes/pii_guard:
    actions:
      - { key: user.email, action: delete }
      - { key: user.name, action: delete }
      - { key: enduser.id, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.url, action: delete }
      - { key: url.query, action: delete }
      - { key: passenger.phone, action: delete }
      - { key: search.query, action: delete }
  batch: {}

exporters:
  debug:
    verbosity: basic
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pii_guard, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pii_guard, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pii_guard, batch]
      exporters: [debug]
