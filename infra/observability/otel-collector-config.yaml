# OpenTelemetry-Collector (WP-M0-10, ausgebaut in WP-M5-03/-06). NICHT GESTARTET (kein Docker-Daemon); Syntax per YAML-Parser geprueft
# (infra/check.py, infra/check_telemetry.py). Receiver: OTLP von Fachkern und Workern, Container-Logdateien (JSON-Zeilen).
# Metriken: Prometheus scrapt die Komponenten direkt (prometheus.yml); der Collector stellt OTLP-Metriken auf Port 8889 bereit.
# Traces gehen an Tempo, Logs an Loki (Overlay infra/compose/docker-compose.telemetry.yml). Aufbewahrung: docs/betrieb/telemetrie.md (OP-08 offen).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
  # Stdout-JSON-Logs der Container (Fachkern, Worker, Gateway), von der Container-Laufzeit in Dateien geschrieben.
  filelog:
    include: [/var/log/taktovia/*/*.log]
    include_file_path: true
    operators:
      - { type: json_parser, parse_from: body, on_error: send }

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
  # Datenschutz (Kap. 01 §1.1, Kap. 05 §5.1): keine Personen-, Kontakt- oder Ortssuchdaten in Telemetrie.
  attributes/pii_guard:
    actions:
      - { key: user.email, action: delete }
      - { key: user.name, action: delete }
      - { key: enduser.id, action: delete }
      - { key: http.request.header.authorization, action: delete }
      - { key: http.request.header.cookie, action: delete }
      - { key: http.url, action: delete }
      - { key: url.query, action: delete }
      - { key: passenger.phone, action: delete }
      - { key: search.query, action: delete }
  # Verteidigung in der Tiefe (WP-M5-06): Klartextmuster im Lognachrichtentext ersetzen, auch wenn eine Komponente fehlerhaft maskiert hat.
  transform/log_masking:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - replace_pattern(body, "[A-Za-z0-9._%+'-]+@[A-Za-z0-9-]+(\\.[A-Za-z0-9-]+)*\\.[A-Za-z]{2,}", "[maskiert:email]")
          - replace_pattern(body, "\\b[A-Z]{2}[0-9]{2}( ?[A-Z0-9]{4}){2,7}( ?[A-Z0-9]{1,3})?\\b", "[maskiert:iban]")
          - replace_pattern(body, "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{4,}", "[maskiert:token]")
  batch: {}

exporters:
  debug:
    verbosity: basic
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }   # nur im internen Betriebsnetz; Produktivbetrieb mit TLS nach WP-M5-28
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pii_guard, batch]
      exporters: [debug, otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/pii_guard, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, attributes/pii_guard, transform/log_masking, batch]
      exporters: [debug, otlphttp/loki]
