# Prometheus, lokal (WP-M0-10). NICHT GESTARTET. Metrikname/-pfad des Backends sind Annahmen (Backend-Endpunkt: WP-M0-10, Backend-Teil).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml
  - /etc/prometheus/operator-alert-rules.yml

# Alarmkanal: PLATZHALTER. Alarmierung ist erst M5; bewusst kein Alertmanager-Ziel konfiguriert.
# alerting:
#   alertmanagers:
#     - static_configs: [{ targets: ["alertmanager:9093"] }]   # Kanal/Empfaenger offen (D-12 Betriebsrolle)

scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  # WP-M5-03: je Serverkomponente ein Scrape-Ziel (Kap. 01 §1.2). Fachkern auf dem Verwaltungsport (TAKTOVIA_MANAGEMENT_PORT=9464), nicht auf dem API-Port.
  - job_name: backend-app
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:9464"], labels: { component: fachkern } }]
  - job_name: routing-worker
    metrics_path: /metrics
    static_configs: [{ targets: ["routing:8082"], labels: { component: routing-worker } }]
  - job_name: documents-worker
    metrics_path: /metrics
    static_configs: [{ targets: ["documents:8082"], labels: { component: documents-worker } }]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs: [{ targets: ["rabbitmq:15692"], labels: { component: rabbitmq } }]   # nur mit aktiviertem rabbitmq_prometheus-Plugin
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"], labels: { component: redis } }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"], labels: { component: postgres } }]
