# Prometheus, lokal (WP-M0-10). NICHT GESTARTET. Metrikname/-pfad des Backends sind Annahmen (Backend-Endpunkt: WP-M0-10, Backend-Teil).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml
  - /etc/prometheus/operator-alert-rules.yml

# Alarmkanal: PLATZHALTER. Alarmierung ist erst M5; bewusst kein Alertmanager-Ziel konfiguriert.
# alerting:
#   alertmanagers:
#     - static_configs: [{ targets: ["alertmanager:9093"] }]   # Kanal/Empfaenger offen (D-12 Betriebsrolle)

scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  - job_name: backend-app
    metrics_path: /actuator/prometheus   # Annahme (Spring Actuator); mit Backend abstimmen
    static_configs: [{ targets: ["host.docker.internal:8080"] }]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs: [{ targets: ["rabbitmq:15692"] }]   # nur mit aktiviertem rabbitmq_prometheus-Plugin
