# Prometheus, lokal (WP-M0-10). NICHT GESTARTET. Metrikname/-pfad des Backends sind Annahmen (Backend-Endpunkt: WP-M0-10, Backend-Teil).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml
  - /etc/prometheus/operator-alert-rules.yml
  # WP-M5-04: Alarmregeln der kritischen Fehlerszenarien (Katalog: infra/alerting/katalog.yaml)
  - /etc/prometheus/alert-rules.d/*.yml

# Alarmierung (WP-M5-04): genau ein Alertmanager-Ziel; Empfängerkanal und Totmannprüfung siehe infra/alerting/. Empfänger je Umgebung offen (D-12, OP-32/OP-39). NICHT gestartet (kein Docker).
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]

scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8889"] }]
  # WP-M5-03: je Serverkomponente ein Scrape-Ziel (Kap. 01 §1.2). Fachkern auf dem Verwaltungsport (TAKTOVIA_MANAGEMENT_PORT=9464), nicht auf dem API-Port.
  - job_name: backend-app
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["host.docker.internal:9464"], labels: { component: fachkern } }]
  - job_name: routing-worker
    metrics_path: /metrics
    static_configs: [{ targets: ["routing:8082"], labels: { component: routing-worker } }]
  - job_name: documents-worker
    metrics_path: /metrics
    static_configs: [{ targets: ["documents:8082"], labels: { component: documents-worker } }]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs: [{ targets: ["rabbitmq:15692"], labels: { component: rabbitmq } }]   # nur mit aktiviertem rabbitmq_prometheus-Plugin
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"], labels: { component: redis } }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"], labels: { component: postgres } }]
  # WP-M5-04: Gateway von außen (blackbox_exporter: Erreichbarkeit und Zertifikatsablauf) und die Alarmkette selbst
  - job_name: gateway-probe
    metrics_path: /probe
    params: { module: [https_2xx] }
    static_configs: [{ targets: ["https://gateway.taktovia.invalid/health"], labels: { component: gateway } }]   # Ziel je Umgebung (Domäne aus umgebungsmatrix.json)
    relabel_configs:
      - { source_labels: [__address__], target_label: __param_target }
      - { source_labels: [__param_target], target_label: instance }
      - { target_label: __address__, replacement: "blackbox-exporter:9115" }
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"], labels: { component: alarmkette } }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"], labels: { component: alarmkette } }]
