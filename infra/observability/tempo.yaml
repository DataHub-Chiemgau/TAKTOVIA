# Tempo (WP-M5-03): Traces. Aufbewahrung 7 Tage (Arbeitsannahme, OP-08 offen). NICHT GESTARTET.
server: { http_listen_port: 3200 }
distributor:
  receivers:
    otlp:
      protocols:
        grpc: { endpoint: 0.0.0.0:4317 }
compactor:
  compaction:
    block_retention: 168h
storage:
  trace:
    backend: local
    local: { path: /var/tempo/blocks }
    wal: { path: /var/tempo/wal }
