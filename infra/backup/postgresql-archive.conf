# Einzubindendes Fragment für kontinuierliches WAL (PITR), WP-M1-39/WP-M5-14. Gegen einen privaten Testcluster ausgeführt (tests/performance/test_pitr.py); die Zielumgebung (D-05) steht aus.
# Die Segmente werden vor Verlassen des Servers verschlüsselt (AES-256-GCM) und einmalig im Backupspeicher abgelegt (Betriebsrolle ops-backup). `taktovia_backup.wal` importiert keinen Datenbanktreiber.
# Der Aufruf läuft im Datenbankserver-Benutzer; Schlüsseldatei und Backupspeicher gehören der Betriebsidentität (nicht der Anwendung).
wal_level = replica
archive_mode = on
archive_timeout = 60s            # begrenzt den Verlust bei wenig Schreiblast; Archivierungsverzug-Alarm ab 10 min (Obergrenze RPO 15 min)
archive_command = 'env TAKTOVIA_BACKUP_DIR=/srv/taktovia-backup TAKTOVIA_BACKUP_KEY_FILE=/etc/taktovia/backup.key TAKTOVIA_BACKUP_PRINCIPAL=ops-backup PYTHONPATH=/opt/taktovia/infra/backup python3 -m taktovia_backup.wal archive %p %f'
# Wiederherstellung auf einen Zeitpunkt T: nicht von Hand, sondern über pitr.restore_pitr (prüft Manifest, Umgebung und WAL-Kette vor dem Entschlüsseln und schreibt restore_command, recovery_target_time,
# recovery_target_action = 'promote' selbst). Beispiel des erzeugten Fragments:
# restore_command = 'env TAKTOVIA_BACKUP_DIR=... TAKTOVIA_BACKUP_KEY_FILE=... TAKTOVIA_BACKUP_PRINCIPAL=ops-restore PYTHONPATH=... python3 -m taktovia_backup.wal restore %f %p'
# recovery_target_time = '2026-12-01 10:00:00+00'
# Nach dem Restore vor jeder Freigabe: Lösch-/Sperrjournal einspielen und Konsistenzprüfungen ausführen (Schritte 5 und 6 des Wiederanlaufdrehbuchs, tests/performance/wiederanlauf-drehbuch-m5.md).
