# Einzubindendes Fragment für kontinuierliches WAL (PITR), WP-M1-39. NICHT gegen einen Cluster ausgeführt (kein verwalteter Dienst, D-05 offen).
# Die Segmente werden vor Verlassen des Servers verschlüsselt und einmalig im Backupspeicher abgelegt (Betriebsrolle ops-backup).
archive_mode = on
archive_command = 'TAKTOVIA_BACKUP_PRINCIPAL=ops-backup python3 -m taktovia_backup archive-wal %p %f'
