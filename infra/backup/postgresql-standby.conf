# Standby (Streaming-Replikation) gemäß Betriebsmodell, WP-M5-14. ENTWURF, NICHT AUSGEFÜHRT (kein zweiter Host, Hosting/Betriebsmodell D-05 offen).
# Primär:   wal_level = replica, max_wal_senders >= 3, Replikationsrolle `taktovia_replica` (nur REPLICATION, kein Anmeldezugriff auf Fachdaten), pg_hba nur aus dem Netz der Umgebung.
# Standby:  per pg_basebackup aus dem Primär (-R), danach:
primary_conninfo = 'host=postgres.<umgebung>.taktovia.internal user=taktovia_replica passfile=/etc/taktovia/replica.pgpass sslmode=verify-full'
primary_slot_name = 'taktovia_standby'      # Slot verhindert den Verlust von WAL; belegt Platz, solange der Standby fehlt: `taktovia_standby_connected` und Platzalarm beobachten
hot_standby = on
# Metrik: `python -m taktovia_backup metrics --standby-expected` (taktovia_standby_connected aus pg_stat_replication); Verzug: pg_replication_lag_seconds (postgres_exporter, Regel DatenbankReplikationsverzug).
# Verschlüsselung und Zugriffstrennung: Verbindung TLS, Replikationsrolle ohne Zugriff auf Backupspeicher; der Standby hat dieselbe Umgebungskennung wie der Primär (kein Netzpfad zwischen Umgebungen).
