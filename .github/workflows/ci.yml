name: CI
on:
  push:
  pull_request:

jobs:
  repository:
    name: Repository (WP-M0-01)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python tools/check_repo.py
      - run: python tools/test_check_repo.py
        working-directory: tools

  vertraege:
    name: Vertragsprüfung (WP-M0-13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install PyYAML jsonschema openapi-spec-validator pglast
      - run: python docs/pflichtenheft/validate_artifacts.py
      - run: python docs/umsetzungsplan/check_wp.py
      - run: python docs/umsetzungsplan/check_tracking.py
      - run: python docs/umsetzungsplan/test_check_tracking.py
      - run: python docs/umsetzungsplan/gate_report.py M1
      - name: API-Verträge (WP-M0-04, -13)
        run: |
          python api/tools/bundle.py --check
          python api/tools/lint.py
          python api/tools/test_api.py
      - name: API-Dokumentation und Vertragspipeline (WP-M1-03)
        run: |
          python api/tools/gen_docs.py --check
          python -m unittest discover -s tests/acceptance/api -t . -p 'test_*.py'
      - name: Inkompatible API-Änderungen gegenüber dem Basiszweig
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          python api/tools/breaking.py origin/${{ github.base_ref }}
      - name: Zwölf semantische Contract-Fälle (übersprungen bis zu ihrem Meilenstein)
        run: python tests/contract/test_semantische_contract_faelle.py

  datenbank:
    name: Datenbankintegration (WP-M0-17)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_PASSWORD: ci_admin }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAKTOVIA_DB_HOST: 127.0.0.1
      TAKTOVIA_DB_NAME: taktovia_test
      TAKTOVIA_DB_ADMIN_USER: postgres
      TAKTOVIA_DB_ADMIN_PASSWORD: ci_admin
      TAKTOVIA_DB_MIGRATOR_PASSWORD: ci_migrator
      TAKTOVIA_DB_RUNTIME_PASSWORD: ci_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install "psycopg[binary]==3.2.*"
      - run: python db/db.py bootstrap
      - run: python db/db.py migrate
      - name: Schema gegen Dateninventar (WP-M1-32, SEC-004)
        run: python db/dateninventar.py check
      - run: python -m unittest discover -s db/tests -p 'test_*.py' -v
      - name: Frische Datenbank, zweiter Lauf
        run: python db/db.py reset && python db/db.py migrate && python -m unittest discover -s db/tests -p 'test_*.py'

  backend:
    name: Backend (WP-M0-02, -03)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_PASSWORD: ci_admin }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAKTOVIA_DB_HOST: 127.0.0.1
      TAKTOVIA_DB_NAME: taktovia_test
      TAKTOVIA_DB_ADMIN_USER: postgres
      TAKTOVIA_DB_ADMIN_PASSWORD: ci_admin
      TAKTOVIA_DB_MIGRATOR_PASSWORD: ci_migrator
      TAKTOVIA_DB_RUNTIME_PASSWORD: ci_runtime
      TAKTOVIA_REQUIRE_DB: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install "psycopg[binary]==3.2.*" PyYAML jsonschema openapi-spec-validator
      - run: sudo apt-get update && sudo apt-get install -y redis-server && sudo systemctl stop redis-server || true
        name: redis-server für den Rate-Limit-Speichertest (WP-M1-02)
      - run: python db/db.py bootstrap && python db/db.py migrate
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew build --console=plain
        working-directory: backend
      - name: Route ohne Vertrag bricht den Build (WP-M1-03)
        run: |
          python api/tools/check_routes.py backend/app/build/contract/routes.json
          python -m unittest discover -s tests/acceptance/api -t . -p 'test_contract_pipeline.py'
      - name: Angriffskatalog gegen die gebaute Anwendung und Befund-Gate (WP-M1-38)
        run: |
          python tools/lint_sql.py
          python -m unittest discover -s tests/acceptance/security -t . -p 'test_*.py'
      - name: JUnit-Ergebnisse für das Release-Gate einsammeln (WP-M5-22)
        if: always()
        run: |
          mkdir -p junit-backend
          find backend -path '*/build/test-results/test/TEST-*.xml' -exec cp {} junit-backend/ \;
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-junit, path: junit-backend }

  web:
    name: Web (WP-M0-05)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install PyYAML
      - name: API-Client ist aus api/*.yaml erzeugt (WP-M1-43)
        run: python api/tools/gen_ts_client.py --check
      - run: npm run lint && npm test && npm run build
        working-directory: web
      - name: Barrierefreiheit im Browser (axe mit Kontrast, Reflow 320 px, 200 % Text, Touchflächen; WP-M1-43)
        run: npm run a11y:browser
        working-directory: web
        env: { CHROME_PATH: /usr/bin/google-chrome }
      - name: Selbsttest der Barrierefreiheitsprüfung (Probekomponenten ohne Namen, ohne Fokus, mit zu geringem Kontrast müssen fehlschlagen; WP-M5-18)
        run: npm run a11y:selftest
        working-directory: web
        env: { CHROME_PATH: /usr/bin/google-chrome }
      - name: Kernreise Planer UI-12 im Browser (Tastaturpfad, axe, Reflow; WP-M4-18/-19, WP-M5-18)
        run: npm run dienstplan:browser
        working-directory: web
        env: { CHROME_PATH: /usr/bin/google-chrome }
      - name: Kernreisen Leitstelle, Flotte, Belege, Verwaltung, Fahrgast im Browser (Tastaturdurchlauf, Mandantenwechsel mit zwei Tabs; WP-M5-30)
        run: npm run kernreisen:browser
        working-directory: web
        env: { CHROME_PATH: /usr/bin/google-chrome }

  workers:
    name: Worker (WP-M0-07)
    runs-on: ubuntu-24.04
    strategy:
      matrix: { worker: [routing, documents] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements-dev.lock
        working-directory: workers/${{ matrix.worker }}
      - run: python -m pytest -q && python -m ruff check .
        working-directory: workers/${{ matrix.worker }}

  mobile:
    name: Mobile Fahrer-App (WP-M0-06) – noch nicht verifiziert
    runs-on: ubuntu-24.04
    continue-on-error: true   # Flutter wurde in der Entwicklungsumgebung nicht ausgeführt; nach erstem grünen Lauf entfernen
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.9', channel: stable }
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: mobile/driver

  lieferkette:
    name: Lieferkette (WP-M0-14) – angelegt, nicht ausgeführt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret-Scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Schwachstellen und Lizenzen der festgeschriebenen Abhängigkeiten
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=web/package-lock.json
            --recursive
            ./backend

  secret-scan:
    name: Secret-Scan und Transportprüfung (WP-M1-36) – Pflichtschritt, in dieser Umgebung nur lokal ausgeführt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install PyYAML
      - name: Quellcode, Git-Historie (jeder Fund lässt den Build scheitern; Ausnahmen nur über tools/secret_scan_allowlist.csv)
        run: |
          python tools/secret_scan.py tree .
          python tools/secret_scan.py history .
      - name: Selbsttests Secret-Scan, TLS-Scanner, Konfiguration
        run: python -m unittest discover -s tests/acceptance/security -p 'test_*.py' -v
      - name: Gateway- und Infrastrukturprüfung
        run: python infra/check.py
      # Gebaute Images (Auslieferungsartefakt): sobald der Image-Bau steht, `docker save <image> -o image.tar`
      # und `python tools/secret_scan.py artifact image.tar` sowie über das SBOM-Verzeichnis. NICHT ausgeführt (kein Docker).

  release-gate:
    name: Release-Gate (WP-M5-22) – Pflichtprüfungen Kernbuchung und Disposition
    # Verweigert das Release, sobald eine Pflichtstufe fehlt oder rot ist; das Release-Artefakt (Manifest + Signatur) entsteht nur bei vollständig grünem Lauf
    # und nur auf Versions-Tags. mobile ist (noch nicht verifiziert, continue-on-error) bewusst keine Pflichtstufe. Stufen: tools/release_gate/pflichtpruefungen.json.
    needs: [repository, vertraege, datenbank, backend, web, workers, lieferkette, secret-scan]
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_PASSWORD: ci_admin }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAKTOVIA_DB_HOST: 127.0.0.1
      TAKTOVIA_DB_NAME: taktovia_test
      TAKTOVIA_DB_ADMIN_USER: postgres
      TAKTOVIA_DB_ADMIN_PASSWORD: ci_admin
      TAKTOVIA_DB_MIGRATOR_PASSWORD: ci_migrator
      TAKTOVIA_DB_RUNTIME_PASSWORD: ci_runtime
      TAKTOVIA_REQUIRE_DB: 'true'
      TAKTOVIA_GATE_EXTERN_GITLEAKS: ${{ needs.lieferkette.result }}
      TAKTOVIA_GATE_EXTERN_OSV: ${{ needs.lieferkette.result }}
      TAKTOVIA_RELEASE_SIGNING_KEY: ${{ secrets.TAKTOVIA_RELEASE_SIGNING_KEY }}
      TAKTOVIA_BUILD_ID: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # die Migrationsstufe liest den freigegebenen Vorstand aus der Git-Historie
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install "psycopg[binary]==3.2.*" PyYAML jsonschema openapi-spec-validator pytest==9.2.0
      - uses: actions/download-artifact@v4
        with: { name: backend-junit, path: junit-backend }
      - run: python db/db.py bootstrap && python db/db.py migrate
      - name: Selbsttest des Gates (rote Stufen verhindern das Release)
        run: python -m unittest discover -s tests/acceptance/release -p 'test_*.py' -v
      - name: Pflichtprüfungen; Release-Artefakt nur auf Versions-Tags
        run: python tools/release_gate/gate.py run --ci --ergebnisse junit-backend --out release-out ${{ startsWith(github.ref, 'refs/tags/v') && ' ' || '--ohne-artefakt' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: release-gate-bericht, path: release-out }

