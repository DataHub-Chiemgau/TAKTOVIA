name: CI
on:
  push:
  pull_request:

jobs:
  repository:
    name: Repository (WP-M0-01)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python tools/check_repo.py
      - run: python tools/test_check_repo.py
        working-directory: tools

  vertraege:
    name: Vertragsprüfung (WP-M0-13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install PyYAML jsonschema openapi-spec-validator pglast
      - run: python docs/pflichtenheft/validate_artifacts.py
      - run: python docs/umsetzungsplan/check_wp.py
      - run: python docs/umsetzungsplan/check_tracking.py
      - run: python docs/umsetzungsplan/test_check_tracking.py
      - name: API-Verträge (WP-M0-04, -13)
        run: |
          python api/tools/bundle.py --check
          python api/tools/lint.py
          python api/tools/test_api.py
      - name: API-Dokumentation und Vertragspipeline (WP-M1-03)
        run: |
          python api/tools/gen_docs.py --check
          python -m unittest discover -s tests/acceptance/api -t . -p 'test_*.py'
      - name: Inkompatible API-Änderungen gegenüber dem Basiszweig
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          python api/tools/breaking.py origin/${{ github.base_ref }}
      - name: Zwölf semantische Contract-Fälle (übersprungen bis zu ihrem Meilenstein)
        run: python tests/contract/test_semantische_contract_faelle.py

  datenbank:
    name: Datenbankintegration (WP-M0-17)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_PASSWORD: ci_admin }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAKTOVIA_DB_HOST: 127.0.0.1
      TAKTOVIA_DB_NAME: taktovia_test
      TAKTOVIA_DB_ADMIN_USER: postgres
      TAKTOVIA_DB_ADMIN_PASSWORD: ci_admin
      TAKTOVIA_DB_MIGRATOR_PASSWORD: ci_migrator
      TAKTOVIA_DB_RUNTIME_PASSWORD: ci_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install "psycopg[binary]==3.2.*"
      - run: python db/db.py bootstrap
      - run: python db/db.py migrate
      - run: python -m unittest discover -s db/tests -p 'test_*.py' -v
      - name: Frische Datenbank, zweiter Lauf
        run: python db/db.py reset && python db/db.py migrate && python -m unittest discover -s db/tests -p 'test_*.py'

  backend:
    name: Backend (WP-M0-02, -03)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_PASSWORD: ci_admin }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TAKTOVIA_DB_HOST: 127.0.0.1
      TAKTOVIA_DB_NAME: taktovia_test
      TAKTOVIA_DB_ADMIN_USER: postgres
      TAKTOVIA_DB_ADMIN_PASSWORD: ci_admin
      TAKTOVIA_DB_MIGRATOR_PASSWORD: ci_migrator
      TAKTOVIA_DB_RUNTIME_PASSWORD: ci_runtime
      TAKTOVIA_REQUIRE_DB: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install "psycopg[binary]==3.2.*" PyYAML jsonschema openapi-spec-validator
      - run: sudo apt-get update && sudo apt-get install -y redis-server && sudo systemctl stop redis-server || true
        name: redis-server für den Rate-Limit-Speichertest (WP-M1-02)
      - run: python db/db.py bootstrap && python db/db.py migrate
      - uses: gradle/actions/wrapper-validation@v4
      - run: ./gradlew build --console=plain
        working-directory: backend
      - name: Route ohne Vertrag bricht den Build (WP-M1-03)
        run: |
          python api/tools/check_routes.py backend/app/build/contract/routes.json
          python -m unittest discover -s tests/acceptance/api -t . -p 'test_contract_pipeline.py'
      - name: Angriffskatalog gegen die gebaute Anwendung und Befund-Gate (WP-M1-38)
        run: |
          python tools/lint_sql.py
          python -m unittest discover -s tests/acceptance/security -t . -p 'test_*.py'

  web:
    name: Web (WP-M0-05)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm test && npm run build
        working-directory: web

  workers:
    name: Worker (WP-M0-07)
    runs-on: ubuntu-24.04
    strategy:
      matrix: { worker: [routing, documents] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -r requirements-dev.lock
        working-directory: workers/${{ matrix.worker }}
      - run: python -m pytest -q && python -m ruff check .
        working-directory: workers/${{ matrix.worker }}

  mobile:
    name: Mobile Fahrer-App (WP-M0-06) – noch nicht verifiziert
    runs-on: ubuntu-24.04
    continue-on-error: true   # Flutter wurde in der Entwicklungsumgebung nicht ausgeführt; nach erstem grünen Lauf entfernen
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.9', channel: stable }
      - run: flutter pub get && flutter analyze && flutter test
        working-directory: mobile/driver

  lieferkette:
    name: Lieferkette (WP-M0-14) – angelegt, nicht ausgeführt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret-Scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Schwachstellen und Lizenzen der festgeschriebenen Abhängigkeiten
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=web/package-lock.json
            --recursive
            ./backend
