        accepted_terms_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        return_uri:
          type: string
          format: uri
      required:
      - max_authorized_amount
      - accepted_terms_sha256
      description: payment_method_token nur erforderlich bei positivem Betrag und fehlender hinterlegter PSP-Methode;
        keine Zahlungsdaten. return_uri muss freigegebene Client-URI sein.
      examples:
      - payment_method_token: psp_test_token_not_a_real_credential
        max_authorized_amount:
          amount_minor: 1800
          currency: EUR
          exponent: 2
        accepted_terms_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    JourneyLeg:
