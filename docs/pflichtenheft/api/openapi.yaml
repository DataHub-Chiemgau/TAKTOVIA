        operation_id:
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: 'null'
        updated_at:
          type: string
          format: date-time
        execution_state:
          type: string
          enum:
          - NOT_STARTED
          - IN_PROGRESS
