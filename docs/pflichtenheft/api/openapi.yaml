openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: TAKTOVIA – Kernverträge Pflichtenheft
  version: 0.1.0
  description: Entwurf vom 25.10.2026. Vertragsartefakt, keine laufende Implementierung. Ergänzender Endpunktkatalog in 05-api-vertraege.md.
    URLs unter .example sind Platzhalter; Produktion ist deploymentabhängig.
servers:
- url: https://api.taktovia.example
  description: Dokumentationsplatzhalter, kein produktiver Dienst
paths:
  /v1/federation/journeys/plan:
    post:
      summary: Reisevarianten und Preise ermitteln
      operationId: planJourney
      security:
      - oidc:
        - journeys:plan
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: Erzeugt TravelRequestAttempt genau einmal pro Idempotenzschlüssel. Keine Kapazitätszusage. Leere offers
        mit reject_reason sind fachliches 200, ungültige Anfrage 422. Zeitbudget 5 s; Teilverfügbarkeit einzelner Partner
        bleibt sichtbar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
  /v1/federation/offers/{offer_id}:
    get:
      summary: Unveränderten Angebotsstand lesen
      operationId: getOffer
      security:
      - oidc:
        - journeys:read
      parameters:
      - $ref: '#/components/parameters/offer_id'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyOffer'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/federation/offers/{offer_id}/hold:
    post:
      summary: Kapazitäten der buchbaren Segmente halten
      operationId: holdOffer
      security:
      - oidc:
        - journeys:book
      parameters:
      - $ref: '#/components/parameters/offer_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: 'Erzeugt eine Journey und Saga. Gleiche Offer-Revision, Preise, Terms und kooperierende Partner prüfen.
        Abgelaufenes Angebot: 409 OFFER_EXPIRED. Operation SUCCEEDED bedeutet nur alle erforderlichen Holds vorhanden, nicht
        endgültig gebucht.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
  /v1/federation/journeys/{journey_id}:
    get:
      summary: Reise- und Segmentstatus lesen
      operationId: getJourney
      security:
      - oidc:
        - journeys:read
      parameters:
      - $ref: '#/components/parameters/journey_id'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/federation/journeys/{journey_id}/confirm:
    post:
      summary: Gehaltene Reise bestätigen und Zahlungsablauf starten
      operationId: confirmJourney
      security:
      - oidc:
        - journeys:book
      parameters:
      - $ref: '#/components/parameters/journey_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Erforderliche Holds müssen bis zum abgesicherten Commit-Zeitpunkt gültig sein. max_authorized_amount muss
        exakt pay_at_platform entsprechen; Preisänderung führt zu 409 REQUOTE_REQUIRED. PSP-Authentifizierung wird als ACTION_REQUIRED
        über Journey angezeigt. HTTP 202 ist keine Bestätigung.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
  /v1/federation/journeys/{journey_id}/cancellation-quotes:
    post:
      summary: Stornokosten und Folgen anbieten
      operationId: quoteCancellation
      security:
      - oidc:
        - journeys:cancel
      parameters:
      - $ref: '#/components/parameters/journey_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationQuote'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Keine Stornowirkung. Prüft auch Erreichbarkeit der verbleibenden Reisekette; Tarif-/Erstattungsregeln je
        Segment snapshotten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationQuoteRequest'
  /v1/federation/journeys/{journey_id}/cancel:
    post:
      summary: Geprüften Stornovorschlag ausführen
      operationId: cancelJourney
      security:
      - oidc:
        - journeys:cancel
      parameters:
      - $ref: '#/components/parameters/journey_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Cancel exakt der im gültigen cancellation_quote gespeicherten Segmente. Neue Gebühren werden nie still
        akzeptiert. UNKNOWN bleibt offen bis Providerabgleich; Erstattung und Reservierungsstorno werden getrennt nachgewiesen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
  /v1/federation/partners/{partner_id}/events:
    post:
      summary: Signiertes Partnerereignis zustellen
      operationId: receivePartnerEvent
      description: HMAC-SHA256 über timestamp + Punkt + exakte Request-Bytes. Zeitfenster ±300 s. Schlüsselbindung legt Partner
        und zulässige tenant_id fest. Replay-Ledger und Zustandsversion prüfen. 202 erst nach durable Inbox-Commit; Duplikat
        liefert 200. OAuth allein ersetzt die Nachrichtensignatur nicht.
      security:
      - partnerSignature: []
      parameters:
      - $ref: '#/components/parameters/partner_id'
      - name: X-Partner-Key-Id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: X-Partner-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerEvent'
      responses:
        '202':
          description: Neu in dauerhafte Inbox aufgenommen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '200':
          description: Identisches Ereignis bereits gespeichert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/operations/{operation_id}:
    get:
      summary: Dauerhaften Bearbeitungsstatus lesen
      operationId: getOperation
      security:
      - oidc:
        - operations:read
      parameters:
      - $ref: '#/components/parameters/operation_id'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/cost-events/{cost_event_id}/allocations:
    post:
      summary: Kostenbasis auf Kostenträger verteilen
      operationId: allocateCost
      security:
      - oidc:
        - costs:allocate
      parameters:
      - $ref: '#/components/parameters/cost_event_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationResult'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Atomare vollständige Allokationsrevision innerhalb eigener Rechtseinheit. Exakte Summe und freigegebene
        offene Periode prüfen; 409 PERIOD_CLOSED oder ALREADY_ALLOCATED. Keine neue Quellkostenwirkung; Korrekturen erfolgen
        über gesonderte Gegenbuchung.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
  /v1/expenses/{expense_id}/approve:
    post:
      summary: Belegrevision fachlich freigeben
      operationId: approveExpense
      security:
      - oidc:
        - expenses:approve
      parameters:
      - $ref: '#/components/parameters/expense_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseApproval'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Vieraugenregel nach Betrag/Policy; Ersteller darf erforderliche Zweitfreigabe nicht selbst erfüllen. POSTED
        erst nach atomarem Journal+Outbox-Commit. Dublettenkandidat blockiert mit 409 DUPLICATE_REVIEW_REQUIRED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
  /v1/config/revisions/{revision_id}/publish:
    post:
      summary: Geprüfte Konfigurationsrevision veröffentlichen
      operationId: publishConfig
      security:
      - oidc:
        - config:publish
      parameters:
      - $ref: '#/components/parameters/revision_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Mandant aus Berechtigungskontext; Wirkungsanalyse, Freigaben und Sicherheitsinvarianten müssen zu unveränderter
        Revision passen. Keine rückwirkende Änderung bestätigter Zusagen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
  /v1/rosters/{roster_id}/publish:
    post:
      summary: Geprüften Dienstplan veröffentlichen
      operationId: publishRoster
      security:
      - oidc:
        - rosters:publish
      parameters:
      - $ref: '#/components/parameters/roster_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Ruhezeit, Qualifikation, Abwesenheit, Doppelbelegung und Fahrzeugfreigabe serverseitig prüfen. Publikation
        einer neuen Revision, kein Überschreiben der alten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
  /v1/driver/events:
    post:
      summary: Ein-/Ausstieg oder No-Show übermitteln
      operationId: recordDriverEvent
      security:
      - oidc:
        - driver:events
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEventResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: Objektberechtigung auf aktuelle zugewiesene Schicht/Route. Ereignis-ID dedupliziert dauerhaft. Verspätete
        Offline-Ereignisse überschreiben keine neuere sicherheitsrelevante Freigabe. REVIEW_REQUIRED ist keine ausgeführte
        Beförderungsbuchung.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverEvent'
  /v1/audit-events:
    get:
      summary: Auditereignisse abfragen (nur lesend)
      operationId: listAuditEvents
      security:
      - oidc:
        - audit:read
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: object_ref
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/company-profile:
    get:
      summary: Unternehmensprofil lesen
      operationId: getCompanyProfile
      security:
      - oidc:
        - company:read
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
    put:
      summary: Unternehmensprofil ändern
      operationId: updateCompanyProfile
      security:
      - oidc:
        - company:write
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyProfile'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
