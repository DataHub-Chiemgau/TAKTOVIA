      - planned_departure_at
      - planned_arrival_at
      - estimated_arrival_at
      - fare
      - hold_expires_at
      - pickup_window
      - arrival_window
      - execution_state
      description: ' Für PLATFORM_BOOKABLE enthält das Angebot konkrete vorgeschlagene Abhol-/Ankunftsfenster. Im
        bestätigten JourneyLeg sind sie die gebundene Zusage; nominale Zeitpunkte sind davon getrennt. Externe Legs
