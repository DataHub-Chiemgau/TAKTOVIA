openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: TAKTOVIA – Kernverträge Pflichtenheft
  version: 0.1.0
  description: Entwurf vom 25.10.2026. Vertragsartefakt, keine laufende Implementierung. Ergänzender Endpunktkatalog
    in 05-api-vertraege.md. URLs unter .example sind Platzhalter; Produktion ist deploymentabhängig.
servers:
- url: https://api.taktovia.example
  description: Dokumentationsplatzhalter, kein produktiver Dienst
paths:
  /v1/federation/journeys/plan:
    post:
      summary: Reisevarianten und Preise ermitteln
      operationId: planJourney
      security:
      - oidc:
        - journeys:plan
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanResponse'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: Erzeugt TravelRequestAttempt genau einmal pro Idempotenzschlüssel. Keine Kapazitätszusage. Leere
        offers mit reject_reason sind fachliches 200, ungültige Anfrage 422. Zeitbudget 5 s; Teilverfügbarkeit einzelner
        Partner bleibt sichtbar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
  /v1/federation/offers/{offer_id}:
    get:
      summary: Unveränderten Angebotsstand lesen
      operationId: getOffer
      security:
      - oidc:
        - journeys:read
      parameters:
      - $ref: '#/components/parameters/offer_id'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JourneyOffer'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/federation/offers/{offer_id}/hold:
    post:
      summary: Kapazitäten der buchbaren Segmente halten
      operationId: holdOffer
      security:
      - oidc:
        - journeys:book
      parameters:
      - $ref: '#/components/parameters/offer_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: 'Erzeugt eine Journey und Saga. Gleiche Offer-Revision, Preise, Terms und kooperierende Partner
        prüfen. Abgelaufenes Angebot: 409 OFFER_EXPIRED. Operation SUCCEEDED bedeutet nur alle erforderlichen Holds
        vorhanden, nicht endgültig gebucht.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
  /v1/federation/journeys/{journey_id}:
    get:
      summary: Reise- und Segmentstatus lesen
      operationId: getJourney
      security:
      - oidc:
        - journeys:read
      parameters:
      - $ref: '#/components/parameters/journey_id'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/federation/journeys/{journey_id}/confirm:
    post:
      summary: Gehaltene Reise bestätigen und Zahlungsablauf starten
      operationId: confirmJourney
      security:
      - oidc:
        - journeys:book
      parameters:
      - $ref: '#/components/parameters/journey_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Erforderliche Holds müssen bis zum abgesicherten Commit-Zeitpunkt gültig sein. max_authorized_amount
        muss exakt pay_at_platform entsprechen; Preisänderung führt zu 409 REQUOTE_REQUIRED. PSP-Authentifizierung
        wird als ACTION_REQUIRED über Journey angezeigt. HTTP 202 ist keine Bestätigung.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
  /v1/federation/journeys/{journey_id}/cancellation-quotes:
    post:
      summary: Stornokosten und Folgen anbieten
      operationId: quoteCancellation
      security:
      - oidc:
        - journeys:cancel
      parameters:
      - $ref: '#/components/parameters/journey_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancellationQuote'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Keine Stornowirkung. Prüft auch Erreichbarkeit der verbleibenden Reisekette; Tarif-/Erstattungsregeln
        je Segment snapshotten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationQuoteRequest'
  /v1/federation/journeys/{journey_id}/cancel:
    post:
      summary: Geprüften Stornovorschlag ausführen
      operationId: cancelJourney
      security:
      - oidc:
        - journeys:cancel
      parameters:
      - $ref: '#/components/parameters/journey_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '202':
          $ref: '#/components/responses/OperationAccepted'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Cancel exakt der im gültigen cancellation_quote gespeicherten Segmente. Neue Gebühren werden
        nie still akzeptiert. UNKNOWN bleibt offen bis Providerabgleich; Erstattung und Reservierungsstorno werden
        getrennt nachgewiesen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRequest'
  /v1/operations/{operation_id}:
    get:
      summary: Dauerhaften Bearbeitungsstatus lesen
      operationId: getOperation
      security:
      - oidc:
        - operations:read
      parameters:
      - $ref: '#/components/parameters/operation_id'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operation'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /v1/cost-events/{cost_event_id}/allocations:
    post:
      summary: Kostenbasis auf Kostenträger verteilen
      operationId: allocateCost
      security:
      - oidc:
        - costs:allocate
      parameters:
      - $ref: '#/components/parameters/cost_event_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllocationResult'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Atomare vollständige Allokationsrevision innerhalb eigener Rechtseinheit. Exakte Summe und freigegebene
        offene Periode prüfen; 409 PERIOD_CLOSED oder ALREADY_ALLOCATED. Keine neue Quellkostenwirkung; Korrekturen
        erfolgen über gesonderte Gegenbuchung.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllocationRequest'
  /v1/expenses/{expense_id}/approve:
    post:
      summary: Belegrevision fachlich freigeben
      operationId: approveExpense
      security:
      - oidc:
        - expenses:approve
      parameters:
      - $ref: '#/components/parameters/expense_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseApproval'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Vieraugenregel nach Betrag/Policy; Ersteller darf erforderliche Zweitfreigabe nicht selbst erfüllen.
        POSTED erst nach atomarem Journal+Outbox-Commit. Dublettenkandidat blockiert mit 409 DUPLICATE_REVIEW_REQUIRED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
  /v1/config/revisions/{revision_id}/publish:
    post:
      summary: Geprüfte Konfigurationsrevision veröffentlichen
      operationId: publishConfig
      security:
      - oidc:
        - config:publish
      parameters:
      - $ref: '#/components/parameters/revision_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Mandant aus Berechtigungskontext; Wirkungsanalyse, Freigaben und Sicherheitsinvarianten müssen
        zu unveränderter Revision passen. Keine rückwirkende Änderung bestätigter Zusagen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
  /v1/rosters/{roster_id}/publish:
    post:
      summary: Geprüften Dienstplan veröffentlichen
      operationId: publishRoster
      security:
      - oidc:
        - rosters:publish
      parameters:
      - $ref: '#/components/parameters/roster_id'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedRevision'
          headers:
            ETag:
              schema:
                type: string
                pattern: ^"[0-9]+"$
              description: Starke Ressourcenrevision.
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '412':
          $ref: '#/components/responses/Problem'
        '428':
          $ref: '#/components/responses/Problem'
      description: Ruhezeit, Qualifikation, Abwesenheit, Doppelbelegung und Fahrzeugfreigabe serverseitig prüfen.
        Publikation einer neuen Revision, kein Überschreiben der alten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
  /v1/driver/events:
    post:
      summary: Ein-/Ausstieg oder No-Show übermitteln
      operationId: recordDriverEvent
      security:
      - oidc:
        - driver:events
      parameters:
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverEventResult'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
      description: Objektberechtigung auf aktuelle zugewiesene Schicht/Route. Ereignis-ID dedupliziert dauerhaft.
        Verspätete Offline-Ereignisse überschreiben keine neuere sicherheitsrelevante Freigabe. REVIEW_REQUIRED
        ist keine ausgeführte Beförderungsbuchung.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverEvent'
  /v1/federation/partners/{partner_id}/events:
    post:
      summary: Signiertes Partnerereignis zustellen
      operationId: receivePartnerEvent
      description: HMAC-SHA256 über timestamp + Punkt + exakte Request-Bytes. Zeitfenster ±300 s. Schlüsselbindung
        legt Partner und zulässige tenant_id fest. Replay-Ledger und Zustandsversion prüfen. 202 erst nach durable
        Inbox-Commit; Duplikat liefert 200. OAuth allein ersetzt die Nachrichtensignatur nicht.
      security:
      - partnerSignature: []
      parameters:
      - $ref: '#/components/parameters/partner_id'
      - name: X-Partner-Key-Id
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 256
      - name: X-Partner-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9]{10}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerEvent'
      responses:
        '202':
          description: Neu in dauerhafte Inbox aufgenommen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '200':
          description: Identisches Ereignis bereits gespeichert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventReceipt'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    oidc:
      type: oauth2
      description: OIDC-login/PKCE für Personen; kurzlebige OAuth Access Tokens, issuer/audience/tenant Mitgliedschaft
        serverseitig geprüft. Deployment ersetzt example-URLs. Machine-to-machine über freigegebene Serviceidentitäten.
      flows:
        authorizationCode:
          authorizationUrl: https://identity.taktovia.example/oauth2/authorize
          tokenUrl: https://identity.taktovia.example/oauth2/token
          scopes:
            journeys:plan: journeys:plan
            journeys:read: journeys:read
            journeys:book: journeys:book
            journeys:cancel: journeys:cancel
            operations:read: operations:read
            costs:allocate: costs:allocate
            expenses:approve: expenses:approve
            config:publish: config:publish
            rosters:publish: rosters:publish
            driver:events: driver:events
        clientCredentials:
          tokenUrl: https://identity.taktovia.example/oauth2/token
          scopes:
            journeys:plan: journeys:plan
            journeys:read: journeys:read
            journeys:book: journeys:book
            journeys:cancel: journeys:cancel
            operations:read: operations:read
            costs:allocate: costs:allocate
            expenses:approve: expenses:approve
            config:publish: config:publish
            rosters:publish: rosters:publish
            driver:events: driver:events
    partnerSignature:
      type: apiKey
      in: header
      name: X-Partner-Signature
      description: v1=<64 hex HMAC-SHA256>; API-Key-Syntax beschreibt den Header, Semantik ist eine dynamische Nachrichtensignatur.
        Schlüssel nie übertragen. Zusätzliche Pflichtheader im Vertrag.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
      description: 'Stabil pro logischem Befehl. Scope = principal + tenant + operation; anderer Payload zu gleichem
        Schlüssel: 409.'
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
      description: 'Starker ETag der gelesenen Ressourcenrevision, z. B. "7". Fehlt: 428, veraltet: 412.'
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
    offer_id:
      name: offer_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    journey_id:
      name: journey_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    operation_id:
      name: operation_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    partner_id:
      name: partner_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    cost_event_id:
      name: cost_event_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    expense_id:
      name: expense_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    revision_id:
      name: revision_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    roster_id:
      name: roster_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
  responses:
    Problem:
      description: Fehler gemäß application/problem+json; code ist stabil und maschinenlesbar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OperationAccepted:
      description: Befehl dauerhaft gespeichert; noch keine Buchungs-/Stornozusage.
      headers:
        Location:
          schema:
            type: string
          description: /v1/operations/{operation_id}
        Retry-After:
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 300
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Operation'
  schemas:
    UUID:
      type: string
      format: uuid
    Money:
      type: object
      additionalProperties: false
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        exponent:
          type: integer
          format: int64
          minimum: 0
          maximum: 4
      required:
      - amount_minor
      - currency
      - exponent
      description: Nichtnegativer Geldbetrag in kleinster Einheit. EUR 12,50 = {amount_minor:1250,currency:EUR,exponent:2}.
        ISO-4217-Exponent serverseitig prüfen. Keine binären Gleitkommazahlen.
    SignedMoney:
      type: object
      additionalProperties: false
      properties:
        amount_minor:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        exponent:
          type: integer
          format: int64
          minimum: 0
          maximum: 4
      required:
      - amount_minor
      - currency
      - exponent
    DecimalQuantity:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
      description: Exakte Dezimalzeichenfolge, maximal sechs Nachkommastellen; nicht als Binary Float verarbeiten.
    Point:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
      - latitude
      - longitude
    Place:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        point:
          $ref: '#/components/schemas/Point'
        stop_id:
          $ref: '#/components/schemas/UUID'
      required:
      - label
      - point
    Party:
      type: object
      additionalProperties: false
      properties:
        persons:
          type: integer
          format: int64
          minimum: 1
          maximum: 50
        wheelchair_places:
          type: integer
          format: int64
          minimum: 0
          maximum: 10
        child_seats:
          type: integer
          format: int64
          minimum: 0
          maximum: 10
        assistance_codes:
          type: array
          items:
            type: string
            enum:
            - BOARDING_HELP
            - AUDIO_GUIDANCE
            - LOW_FLOOR
          uniqueItems: true
      required:
      - persons
      - wheelchair_places
      - child_seats
      - assistance_codes
      description: wheelchair_places/child_seats sind Teilmengen von persons; keine Diagnosen. Fahrzeugspezifische
        Kapazitätsmatrix serverseitig.
    PlanRequest:
      type: object
      additionalProperties: false
      properties:
        origin:
          $ref: '#/components/schemas/Place'
        destination:
          $ref: '#/components/schemas/Place'
        time_mode:
          type: string
          enum:
          - DEPART_AFTER
          - ARRIVE_BY
        desired_at:
          type: string
          format: date-time
        time_zone:
          type: string
          minLength: 1
          maxLength: 64
          examples:
          - Europe/Berlin
        party:
          $ref: '#/components/schemas/Party'
        max_transfers:
          type: integer
          format: int64
          minimum: 0
          maximum: 4
        booking_subject:
          $ref: '#/components/schemas/BookingSubject'
        entitlement_refs:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          uniqueItems: true
          maxItems: 20
          description: Server prüft Berechtigung, Inhaber, Zeitraum und Tarif; keine vertrauenswürdige Preisvorgabe.
      required:
      - origin
      - destination
      - time_mode
      - desired_at
      - time_zone
      - party
      - max_transfers
      - booking_subject
      - entitlement_refs
      examples:
      - origin:
          label: Start A
          point:
            latitude: 47.856
            longitude: 12.352
        destination:
          label: Ziel B
          point:
            latitude: 47.856
            longitude: 12.352
        time_mode: DEPART_AFTER
        desired_at: '2026-11-02T08:00:00+01:00'
        time_zone: Europe/Berlin
        party:
          persons: 1
          wheelchair_places: 0
          child_seats: 0
          assistance_codes: []
        max_transfers: 2
        booking_subject:
          mode: SELF
          passenger_ref: null
          delegation_ref: null
        entitlement_refs: []
    PartnerAvailability:
      type: object
      additionalProperties: false
      properties:
        operator_id:
          $ref: '#/components/schemas/UUID'
        state:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
          - TIMEOUT
          - STALE
        reason_code:
          oneOf:
          - type: string
            enum:
            - CAPACITY
            - STAFF_UNAVAILABLE
            - NO_SERVICE
            - PARTNER_TIMEOUT
            - CONTRACT_INACTIVE
            - STALE_DATA
          - type: 'null'
      required:
      - operator_id
      - state
      - reason_code
    PlanResponse:
      type: object
      additionalProperties: false
      properties:
        request_id:
          $ref: '#/components/schemas/UUID'
        evaluated_at:
          type: string
          format: date-time
        offers:
          type: array
          items:
            $ref: '#/components/schemas/JourneyOffer'
          maxItems: 20
        partners:
          type: array
          items:
            $ref: '#/components/schemas/PartnerAvailability'
        reject_reason:
          oneOf:
          - type: string
            enum:
            - NO_ROUTE
            - CAPACITY
            - STAFF_UNAVAILABLE
            - NO_SERVICE
            - NO_ACCESSIBLE_TRANSFER
            - PROVIDER_UNAVAILABLE
          - type: 'null'
      required:
      - request_id
      - evaluated_at
      - offers
      - partners
      - reject_reason
    Transfer:
      type: object
      additionalProperties: false
      properties:
        from_leg_id:
          $ref: '#/components/schemas/UUID'
        to_leg_id:
          $ref: '#/components/schemas/UUID'
        hub_id:
          $ref: '#/components/schemas/UUID'
        walking_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
        minimum_transfer_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
        available_seconds:
          type: integer
          format: int64
          minimum: 0
          maximum: 86400
        accessible:
          type: boolean
        assurance:
          type: string
          enum:
          - NOT_GUARANTEED
          - CONTRACTUAL_PROTECTION
        policy_revision:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - from_leg_id
      - to_leg_id
      - hub_id
      - walking_seconds
      - minimum_transfer_seconds
      - available_seconds
      - accessible
      - assurance
      - policy_revision
    FareComponent:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - TRANSPORT
          - DISCOUNT
          - SURCHARGE
          - SUBSIDY
          - COMMISSION
          - TAX
        description:
          type: string
          minLength: 1
          maxLength: 256
        amount:
          $ref: '#/components/schemas/SignedMoney'
        tax_code:
          type: string
          minLength: 1
          maxLength: 256
        tariff_revision:
          type: string
          minLength: 1
          maxLength: 256
      required:
      - code
      - description
      - amount
      - tariff_revision
    CancellationTerms:
      type: object
      additionalProperties: false
      properties:
        policy_revision:
          type: string
          minLength: 1
          maxLength: 256
        terms_uri:
          type: string
          format: uri
        terms_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        free_until:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        refundable:
          type: boolean
      required:
      - policy_revision
      - terms_uri
      - terms_sha256
      - free_until
      - refundable
    OfferLeg:
      type: object
      additionalProperties: false
      properties:
        leg_id:
          $ref: '#/components/schemas/UUID'
        sequence:
          type: integer
          format: int64
          minimum: 1
          maximum: 20
        operator_id:
          $ref: '#/components/schemas/UUID'
        seller_legal_entity_id:
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: 'null'
        mode:
          type: string
          enum:
          - ON_DEMAND
          - BUS
          - RAIL
          - WALK
        origin:
          $ref: '#/components/schemas/Place'
        destination:
          $ref: '#/components/schemas/Place'
        departure_at:
          type: string
          format: date-time
        arrival_at:
          type: string
          format: date-time
        booking_capability:
          type: string
          enum:
          - PLATFORM_BOOKABLE
          - EXTERNAL_BOOKING
          - INFORMATION_ONLY
        fare_status:
          type: string
          enum:
          - KNOWN
          - UNKNOWN
          - NOT_APPLICABLE
        quoted_fare:
          oneOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        fare_components:
          type: array
          items:
            $ref: '#/components/schemas/FareComponent'
        tariff_revision:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
        partner_offer_ref:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
        expires_at:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        external_booking_uri:
          oneOf:
          - type: string
            format: uri
          - type: 'null'
        cancellation_terms:
          oneOf:
          - $ref: '#/components/schemas/CancellationTerms'
          - type: 'null'
        accessibility_confirmed:
          type: boolean
        pickup_window:
          oneOf:
          - $ref: '#/components/schemas/TimeWindow'
          - type: 'null'
        arrival_window:
          oneOf:
          - $ref: '#/components/schemas/TimeWindow'
          - type: 'null'
      required:
      - leg_id
      - sequence
      - operator_id
      - seller_legal_entity_id
      - mode
      - origin
      - destination
      - departure_at
      - arrival_at
      - booking_capability
      - fare_status
      - quoted_fare
      - fare_components
      - tariff_revision
      - partner_offer_ref
      - expires_at
      - external_booking_uri
      - cancellation_terms
      - accessibility_confirmed
      - pickup_window
      - arrival_window
      description: ' Für PLATFORM_BOOKABLE enthält das Angebot konkrete vorgeschlagene Abhol-/Ankunftsfenster. Im
        bestätigten JourneyLeg sind sie die gebundene Zusage; nominale Zeitpunkte sind davon getrennt. Externe Legs
        dürfen null liefern.'
      allOf:
      - if:
          properties:
            booking_capability:
              const: PLATFORM_BOOKABLE
        then:
          properties:
            pickup_window:
              $ref: '#/components/schemas/TimeWindow'
            arrival_window:
              $ref: '#/components/schemas/TimeWindow'
    PriceSummary:
      type: object
      additionalProperties: false
      properties:
        pay_at_platform:
          $ref: '#/components/schemas/Money'
        external_known:
          $ref: '#/components/schemas/Money'
        external_unknown_leg_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          uniqueItems: true
        total_known_amount:
          $ref: '#/components/schemas/Money'
        is_complete_total:
          type: boolean
      required:
      - pay_at_platform
      - external_known
      - external_unknown_leg_ids
      - total_known_amount
      - is_complete_total
      description: total_known_amount = pay_at_platform + external_known. is_complete_total nur true ohne unbekannte
        externe Preise; externe Beträge sind nicht Bestandteil des Checkout. Dieselbe Währung/Exponent im gesamten
        Objekt.
      examples:
      - pay_at_platform:
          amount_minor: 1800
          currency: EUR
          exponent: 2
        external_known:
          amount_minor: 0
          currency: EUR
          exponent: 2
        external_unknown_leg_ids: []
        total_known_amount:
          amount_minor: 1800
          currency: EUR
          exponent: 2
        is_complete_total: true
      - pay_at_platform:
          amount_minor: 800
          currency: EUR
          exponent: 2
        external_known:
          amount_minor: 0
          currency: EUR
          exponent: 2
        external_unknown_leg_ids:
        - 00000000-0000-4000-8000-000000000003
        total_known_amount:
          amount_minor: 800
          currency: EUR
          exponent: 2
        is_complete_total: false
    JourneyOffer:
      type: object
      additionalProperties: false
      properties:
        offer_id:
          $ref: '#/components/schemas/UUID'
        revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        legs:
          type: array
          items:
            $ref: '#/components/schemas/OfferLeg'
          minItems: 1
          maxItems: 20
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
        price:
          $ref: '#/components/schemas/PriceSummary'
        terms_bundle_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        booking_policy:
          type: string
          enum:
          - COMPENSATE_ON_FAILURE
          - ALLOW_PARTIAL_WITH_EXPLICIT_CONSENT
        fully_platform_bookable:
          type: boolean
      required:
      - offer_id
      - revision
      - created_at
      - expires_at
      - legs
      - transfers
      - price
      - terms_bundle_sha256
      - booking_policy
      - fully_platform_bookable
      description: ' Angebot bindet serverseitig den geprüften BookingSubject und die Entitlementrevisionen aus
        der Planung. Hold/Confirm dürfen weder Fahrgast noch Anspruch still wechseln; Vertretung wird erneut geprüft.'
    HoldRequest:
      type: object
      additionalProperties: false
      properties:
        offer_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        accepted_terms_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        acknowledged_external_leg_ids:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
          uniqueItems: true
        partial_booking_consent:
          type: boolean
      required:
      - offer_revision
      - accepted_terms_sha256
      - acknowledged_external_leg_ids
      - partial_booking_consent
      description: Alle nicht plattformbuchbaren Legs explizit quittieren. consent false als UI-Default. Änderungen
        von Preis/Terms erzeugen neues Angebot statt stiller Anpassung.
      examples:
      - offer_revision: 1
        accepted_terms_sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        acknowledged_external_leg_ids: []
        partial_booking_consent: false
    Operation:
      type: object
      additionalProperties: false
      properties:
        operation_id:
          $ref: '#/components/schemas/UUID'
        kind:
          type: string
          enum:
          - HOLD
          - CONFIRM
          - CANCEL
          - RECONCILE
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - RECONCILING
          - SUCCEEDED
          - FAILED
          - MANUAL_REVIEW
        journey_id:
          oneOf:
          - $ref: '#/components/schemas/UUID'
          - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result_code:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 256
          - type: 'null'
        retry_after_seconds:
          type: integer
          format: int64
          minimum: 1
          maximum: 300
      required:
      - operation_id
      - kind
      - status
      - journey_id
      - created_at
      - updated_at
      - result_code
      - retry_after_seconds
      examples:
      - operation_id: 00000000-0000-4000-8000-000000000050
        kind: CONFIRM
        status: RECONCILING
        journey_id: 00000000-0000-4000-8000-000000000020
        created_at: '2026-11-02T06:59:00Z'
        updated_at: '2026-11-02T06:59:05Z'
        result_code: PARTNER_RESULT_UNKNOWN
        retry_after_seconds: 3
    PaymentAction:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - PSP_AUTHENTICATION
        redirect_uri:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
      required:
