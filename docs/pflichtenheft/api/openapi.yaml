      - if:
          properties:
            booking_capability:
              const: PLATFORM_BOOKABLE
            state:
              enum:
              - CONFIRMED
              - COMPLETED
        then:
          properties:
            pickup_window:
              $ref: '#/components/schemas/TimeWindow'
            arrival_window:
              $ref: '#/components/schemas/TimeWindow'
